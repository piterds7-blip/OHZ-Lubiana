/* ===================== PRZYWRACANIE DANYCH Z KOPII ========================
   Narzędzie Twórcy: porównuje obecne dawki / grupy / surowce / mieszanki z kopią
   z wybranego dnia i przywraca zaznaczone pozycje. Przed zapisem robi kopię
   stanu bieżącego, więc każde przywrócenie można cofnąć tym samym narzędziem.
   ========================================================================= */

/* Czy rekord jest identyczny z danymi przykładowymi (czyli najpewniej nadpisany)? */
const sklKlucz = lista => JSON.stringify((lista||[]).filter(x=>(x.kg||x.procent||0)>0)
  .map(x=>[x.surowiecId, Math.round((x.kg??x.procent)*1000)/1000]).sort((a,b)=>a[0].localeCompare(b[0])));
const grDawKlucz = lista => JSON.stringify((lista||[]).map(x=>[x.dawkaId, x.udzial]).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))));
function jakPrzykladowa(typ, id, rek){
  if(!rek) return false;
  if(typ==='dawka'){ const p=PRZYKLADOWE.dawki.find(x=>x.id===id); return !!p && sklKlucz(p.skladniki)===sklKlucz(rek.skladniki); }
  if(typ==='mieszanka'){ const p=PRZYKLADOWE.mieszanki.find(x=>x.id===id); return !!p && sklKlucz(p.skladniki)===sklKlucz(rek.skladniki); }
  if(typ==='surowiec'){ const p=PRZYKLADOWE.surowce.find(x=>x.id===id); return !!p && p.nazwa===rek.nazwa && Math.abs((rek.cenaTona||0)-p.cenaTona)<0.01; }
  if(typ==='grupaSkl'){ const p=PRZYKLADOWE.grupy.find(x=>x.id===id); return !!p && p.nazwa===rek.nazwa && grDawKlucz(p.dawki)===grDawKlucz(rek.dawki); }
  if(typ==='grupaSzt'){ const p=PRZYKLADOWE.grupy.find(x=>x.id===id); return !!p && p.sztuk===rek.sztuk; }
  return false;
}

/* Data nadpisania danymi przykładowymi: najczęstsza data ceny wśród surowców
   identycznych z przykładowymi — o ile istnieją dane starsze (inaczej to zwykła instalacja). */
function wykryjNadpisanie(){
  const licz = {};
  PRZYKLADOWE.surowce.forEach(p=>{
    const s = store.surowce[p.id];
    if(s && s.dataCeny && jakPrzykladowa('surowiec', p.id, s)) licz[s.dataCeny]=(licz[s.dataCeny]||0)+1;
  });
  const [data, ile] = Object.entries(licz).sort((a,b)=>b[1]-a[1])[0] || [];
  if(!data || ile<5) return null;
  const starsze = [...Object.values(store.snapshoty).map(s=>s.data||''), ...Object.values(store.zywienie).map(z=>z.data||''),
                   ...Object.values(store.wersjeDawek).map(w=>w.odData||'')].some(d=>d && d<data);
  return starsze ? {data, ile} : null;
}

/* Wszystkie kopie w bazie, z których da się przywracać */
function zrodlaPrzywracania(){
  const z = [];
  Object.values(store.snapshoty).forEach(s=>{
    if(!s.dane) return;
    const d = s.data || (s.ts ? new Date(s.ts).toISOString().slice(0,10) : '');
    z.push({id:'s:'+s.id, data:d, ts:s.ts||0, kto:s.autor||'',
      opis: s.typ==='przed przywróceniem' ? 'Stan sprzed przywracania' : 'Kopia dawek (koniec dnia)',
      dawki:s.dane, grupy:s.grupy||null, surowce:s.surowce||null, mieszanki:s.mieszanki||null});
  });
  Object.values(store.wersjeDawek).forEach(w=>{
    if(w.zaplanowana && !w.zastosowanaTs) return;
    if(!w.dawki) return;
    z.push({id:'w:'+w.id, data:w.odData||'', ts:w.ts||0, kto:w.rola||'',
      opis:'Wersja dawek obowiązująca od tego dnia', dawki:w.dawki, grupy:w.grupy||null, surowce:null, mieszanki:null});
  });
  return z.sort((a,b)=>(b.data||'').localeCompare(a.data||'') || b.ts-a.ts);
}

/* Grupy wg dziennych zapisów żywienia: ostatni wpis każdej grupy nie późniejszy niż `doDnia` */
function grupyZZywienia(doDnia){
  const wynik = {};
  Object.values(store.zywienie).filter(d=>(d.data||'')<=doDnia).sort((a,b)=>a.data.localeCompare(b.data)).forEach(d=>{
    Object.entries(d.grupy||{}).forEach(([gid,z])=>{
      if(!z) return;
      const w = wynik[gid] || (wynik[gid]={});
      if(z.sztuk!=null) w.sztuk = z.sztuk;
      if((z.udzialy||[]).length) w.dawki = z.udzialy;
      if(z.nazwaGrupy) w.nazwa = z.nazwaGrupy;
      w.zDnia = d.data;
    });
  });
  return wynik;
}

let przywrStan = null;   // {zrodloId, plik, doDnia}

/* Czerwony baner dla Twórcy, gdy wykryto nadpisanie danymi przykładowymi */
function banerPrzywracania(){
  if(rolaAkt!=='tworca') return '';
  const n = wykryjNadpisanie(); if(!n) return '';
  // po wykonanym przywróceniu baner już nie straszy (narzędzie zostaje w Raporty → Historia dawek)
  if(Object.values(store.snapshoty).some(s=>s.typ==='przed przywróceniem' && (s.data||'')>=n.data)) return '';
  return `<div class="baner-przywr">⚠ <span><b>${dataPL(n.data)}</b> część danych została nadpisana danymi przykładowymi
    (${n.ile} surowców ma ceny i nazwy przykładowe).</span><span style="flex:1"></span>
    <button class="btn maly" onclick="window.__przywroc&&window.__przywroc()">⟲ Przywróć z kopii…</button></div>`;
}
window.__przywroc = ()=>oknoPrzywracania();

function oknoPrzywracania(){
  if(rolaAkt!=='tworca'){ toast('Narzędzie dostępne tylko dla Twórcy.', true); return; }
  const nadp = wykryjNadpisanie();
  const zrodla = zrodlaPrzywracania();
  const domDzien = nadp ? dataMinus(nadp.data,1) : dzisiaj();
  const domZrodlo = zrodla.find(z=>z.data<=domDzien && z.opis!=='Stan sprzed przywracania') || zrodla[0];
  przywrStan = {zrodloId: domZrodlo?.id || '', plik:null, doDnia:domDzien};
  const n = modal({tytul:'⟲ Przywróć dane z kopii', szer:'1180px', tresc:'<div id="przTresc"></div>',
    przyciski:[{tekst:'Zamknij'}, {tekst:'⟲ Przywróć zaznaczone', klasa:'', akcja:async(nn)=>{
      const ok = await wykonajPrzywracanie(nn);
      return ok ? undefined : false;
    }}]});
  rysujPrzywracanie(n, nadp, zrodla);
}

function rysujPrzywracanie(n, nadp, zrodla){
  const el = n.querySelector('#przTresc');
  const zr = przywrStan.plik || zrodla.find(z=>z.id===przywrStan.zrodloId) || null;
  const grupyZr = zr?.grupy || null;
  const grupyZyw = grupyZZywienia(zr?.data || przywrStan.doDnia);
  const nazwaSur = id => store.surowce[id]?.nazwa || zr?.surowce?.[id]?.nazwa || '(brak surowca)';
  const nazwaDaw = id => store.dawki[id]?.nazwa || zr?.dawki?.[id]?.nazwa || '?';

  // ---- DAWKI ----
  const dawkiRoz = [];
  Object.entries(zr?.dawki||{}).forEach(([id,k])=>{
    const t = store.dawki[id];
    const mapa = l => { const m={}; (l||[]).forEach(x=>{ if(x.kg>0) m[x.surowiecId]=(m[x.surowiecId]||0)+x.kg; }); return m; };
    const a = mapa(t?.skladniki), b = mapa(k.skladniki);
    const zmiany = [...new Set([...Object.keys(a),...Object.keys(b)])].filter(s=>Math.abs((a[s]||0)-(b[s]||0))>0.0005)
      .map(s=>({s, teraz:a[s]||0, kopia:b[s]||0}));
    const zmNazwa = t && t.nazwa!==k.nazwa;
    if(!t || zmiany.length || zmNazwa){
      const brakSur = Object.keys(b).filter(s=>!store.surowce[s]);
      dawkiRoz.push({id, k, t, zmiany, zmNazwa, brakSur, przykl:jakPrzykladowa('dawka', id, t),
        sumaT:mapaSuma(a), sumaK:mapaSuma(b)});
    }
  });

  // ---- GRUPY ----
  const grupyRoz = [];
  const idsGr = new Set([...Object.keys(store.grupyTech), ...Object.keys(grupyZr||{})]);
  idsGr.forEach(id=>{
    const t = store.grupyTech[id];
    const k = grupyZr?.[id] || (grupyZyw[id] && t ? {...t, ...grupyZyw[id]} : null);
    if(!k) return;
    const sklInna = !t || (k.nazwa||'')!==(t.nazwa||'') || grDawKlucz(k.dawki)!==grDawKlucz(t.dawki);
    const sztInna = !t || (k.sztuk??null)!==(t.sztuk??null);
    if(!sklInna && !sztInna) return;
    grupyRoz.push({id, t, k, sklInna, sztInna, zDnia: grupyZr?.[id] ? zr.data : grupyZyw[id]?.zDnia,
      przyklSkl: jakPrzykladowa('grupaSkl', id, t), przyklSzt: jakPrzykladowa('grupaSzt', id, t)});
  });
  grupyRoz.sort((a,b)=>((a.t||a.k).lokalizacja||'').localeCompare((b.t||b.k).lokalizacja||'') || ((a.t||a.k).kolejnosc??99)-((b.t||b.k).kolejnosc??99));

  // ---- MIESZANKI ----
  const mixRoz = [];
  Object.entries(zr?.mieszanki||{}).forEach(([id,k])=>{
    const t = store.mieszanki[id];
    if(!t || sklKlucz(t.skladniki)!==sklKlucz(k.skladniki) || t.nazwa!==k.nazwa)
      mixRoz.push({id, k, t, przykl:jakPrzykladowa('mieszanka', id, t)});
  });

  // ---- SUROWCE ----
  const surRoz = [];
  const idsSur = new Set([...Object.keys(zr?.surowce||{}), ...PRZYKLADOWE.surowce.map(p=>p.id)]);
  idsSur.forEach(id=>{
    const t = store.surowce[id], k = zr?.surowce?.[id] || null;
    if(!t && !k) return;
    if(t?.zMieszalni || k?.zMieszalni) return;     // ceny mieszanek liczą się same z receptur
    const przykl = jakPrzykladowa('surowiec', id, t);
    const inna = k && t && (Math.abs((k.cenaTona||0)-(t.cenaTona||0))>0.005 || k.nazwa!==t.nazwa);
    if(!inna && !(przykl && nadp && t?.dataCeny===nadp.data) && !(k && !t)) return;
    surRoz.push({id, t, k, przykl});
  });
  const uzyteSur = new Set();
  Object.values(store.dawki).forEach(d=>(d.skladniki||[]).forEach(x=>{ if(x.kg>0) uzyteSur.add(x.surowiecId); }));
  Object.values(zr?.dawki||{}).forEach(d=>(d.skladniki||[]).forEach(x=>{ if(x.kg>0) uzyteSur.add(x.surowiecId); }));
  Object.values(store.mieszanki).forEach(m=>(m.skladniki||[]).forEach(x=>uzyteSur.add(x.surowiecId)));
  Object.values(zr?.mieszanki||{}).forEach(m=>(m.skladniki||[]).forEach(x=>uzyteSur.add(x.surowiecId)));
  const wHistorii = new Set();
  Object.values(store.zywienie).forEach(d=>Object.values(d.grupy||{}).forEach(z=>(z?.skladniki||[]).forEach(x=>wHistorii.add(x.surowiecId))));

  const zaznacz = (domyslnie, klucz) => `<input type="checkbox" class="prz-ch" data-prz="${klucz}" ${domyslnie?'checked':''}>`;
  const opisZr = z => `${dataPL(z.data)} — ${z.opis}${z.kto?' · '+esc(z.kto):''}${z.ts?' · zapis '+new Date(z.ts).toTimeString().slice(0,5):''}`
    + ` [${[z.dawki?'dawki':'', z.grupy?'grupy':'', z.surowce?'surowce':'', z.mieszanki?'mieszanki':''].filter(Boolean).join(', ')}]`;

  el.innerHTML = `
    ${nadp ? `<div class="pasek-wersja" style="margin:-4px 0 12px;border-radius:8px">⚠ Wykryto nadpisanie danymi przykładowymi
       <b>${dataPL(nadp.data)}</b> (${nadp.ile} surowców identycznych z przykładowymi). Proponuję kopię z <b>${dataPL(dataMinus(nadp.data,1))}</b> lub wcześniej.</div>` : ''}
    <div class="wiersz2" style="align-items:end;gap:10px;flex-wrap:wrap">
      <div class="pole-grupa" style="flex:3;min-width:320px;margin:0"><label>Źródło — kopia z dnia</label>
        <select id="przZrodlo">
          ${przywrStan.plik?`<option value="__plik" selected>📄 Plik: ${esc(przywrStan.plik.opis)}</option>`:''}
          ${zrodla.map(z=>`<option value="${esc(z.id)}" ${!przywrStan.plik && z.id===przywrStan.zrodloId?'selected':''}>${opisZr(z)}</option>`).join('')}
          ${!zrodla.length && !przywrStan.plik ? '<option value="">— brak kopii w bazie —</option>':''}
        </select></div>
      <button class="btn szary maly" id="przPlikBtn">📄 Wczytaj plik kopii zapasowej (.json)</button>
      <input type="file" id="przPlik" accept="application/json,.json" hidden>
    </div>
    <div class="podpis" style="margin:8px 0 14px">Zaznaczone są pozycje, które <b>dziś wyglądają jak dane przykładowe</b> (najpewniej nadpisane).
      Pozycje zmienione później ręcznie są odznaczone — sprawdź je i zaznacz, jeśli też mają wrócić.
      Przed przywróceniem zapisuję kopię stanu obecnego — można ją przywrócić tym samym narzędziem.</div>

    ${!zr ? '<div class="pusto">Wybierz źródło.</div>' : `
    <div class="prz-sekcja">
      <div class="prz-tyt">Dawki <span class="podpis">${dawkiRoz.length} różnic</span>
        <span style="flex:1"></span><button class="btn maly szary" data-wsz="d">zaznacz wszystkie</button><button class="btn maly szary" data-nic="d">odznacz</button></div>
      ${dawkiRoz.length ? `<div class="przewijak"><table class="gt-tabela prz-tab">
        <thead><tr><th style="width:36px"></th><th>Dawka</th><th class="num">Teraz<br>kg/szt</th><th class="num">Z kopii<br>kg/szt</th><th>Różnice (teraz → kopia)</th></tr></thead>
        <tbody>${dawkiRoz.map(d=>`<tr>
          <td>${zaznacz(d.przykl || !d.t, 'd|'+d.id)}</td>
          <td><b>${esc(d.k.nazwa)}</b>${d.zmNazwa?`<br><span class="podpis">teraz: ${esc(d.t.nazwa)}</span>`:''}
            ${!d.t?'<br><span class="plakietka mieszanka">usunięta — wróci</span>':''}
            ${d.przykl?'<br><span class="plakietka auto">jak przykładowa</span>':(d.t?'<br><span class="plakietka">zmieniana później</span>':'')}</td>
          <td class="num">${fmt(d.sumaT,2)}</td><td class="num"><b>${fmt(d.sumaK,2)}</b></td>
          <td class="podpis prz-roz">${d.zmiany.map(z=>`${esc(nazwaSur(z.s))}: <span style="color:var(--czerwony)">${z.teraz?fmt(z.teraz,2):'—'}</span> → <b style="color:var(--zielony-ok)">${z.kopia?fmt(z.kopia,2):'—'}</b>`).join(' · ')}
            ${d.brakSur.length?`<br><b style="color:var(--czerwony)">⚠ W bazie brak surowców: ${d.brakSur.map(s=>esc(nazwaSur(s))).join(', ')}${zr.surowce?' — wrócą z kopii, jeśli zaznaczysz je niżej':''}</b>`:''}</td>
        </tr>`).join('')}</tbody></table></div>` : '<div class="podpis" style="padding:6px 0">Dawki zgodne z kopią.</div>'}
    </div>

    <div class="prz-sekcja">
      <div class="prz-tyt">Grupy technologiczne <span class="podpis">${grupyRoz.length} różnic · ${grupyZr?'z kopii':'z dziennych zapisów żywienia (ostatni wpis ≤ '+dataPL(zr.data)+')'}</span>
        <span style="flex:1"></span><button class="btn maly szary" data-wsz="g">zaznacz wszystkie</button><button class="btn maly szary" data-nic="g">odznacz</button></div>
      ${grupyRoz.length ? `<div class="przewijak"><table class="gt-tabela prz-tab">
        <thead><tr><th>Lok.</th><th>Grupa</th><th style="width:36px">Skład</th><th>Dawki: teraz → kopia</th><th style="width:36px">Sztuk</th><th class="num">Sztuk: teraz → kopia</th><th>Wpis z</th></tr></thead>
        <tbody>${grupyRoz.map(g=>{
          const opisD = l => (l||[]).map(x=>`${esc(nazwaDaw(x.dawkaId))} ${x.udzial}%`).join(' + ') || '—';
          return `<tr>
            <td>${(g.t||g.k).lokalizacja==='nadarzyn'?'N':'B'}</td>
            <td><b>${esc(g.k.nazwa||g.t?.nazwa||'?')}</b>${g.t && g.t.nazwa!==g.k.nazwa?`<br><span class="podpis">teraz: ${esc(g.t.nazwa)}</span>`:''}</td>
            <td>${g.sklInna?zaznacz(g.przyklSkl || !g.t,'gs|'+g.id):''}</td>
            <td class="podpis">${g.sklInna?`<span style="color:var(--czerwony)">${opisD(g.t?.dawki)}</span> → <b style="color:var(--zielony-ok)">${opisD(g.k.dawki)}</b>`:'bez zmian'}</td>
            <td>${g.sztInna?zaznacz(g.przyklSzt || !g.t,'gz|'+g.id):''}</td>
            <td class="num">${g.sztInna?`<span style="color:var(--czerwony)">${g.t?.sztuk??'—'}</span> → <b style="color:var(--zielony-ok)">${g.k.sztuk??'—'}</b>`:'bez zmian'}</td>
            <td class="podpis">${g.zDnia?dataPL(g.zDnia):'—'}</td></tr>`;
        }).join('')}</tbody></table></div>
        <div class="podpis">Liczba sztuk zmienia się normalnie z dnia na dzień — zaznaczona jest tylko tam, gdzie dziś równa się przykładowej.</div>`
        : '<div class="podpis" style="padding:6px 0">Grupy zgodne z kopią.</div>'}
    </div>

    ${zr.mieszanki ? `<div class="prz-sekcja">
      <div class="prz-tyt">Mieszanki (receptury mieszalni) <span class="podpis">${mixRoz.length} różnic</span></div>
      ${mixRoz.length ? `<div class="przewijak"><table class="gt-tabela prz-tab">
        <thead><tr><th style="width:36px"></th><th>Mieszanka</th><th>Skład z kopii (%)</th></tr></thead>
        <tbody>${mixRoz.map(m=>`<tr><td>${zaznacz(m.przykl || !m.t,'m|'+m.id)}</td>
          <td><b>${esc(m.k.nazwa)}</b>${m.przykl?'<br><span class="plakietka auto">dziś jak przykładowa</span>':''}</td>
          <td class="podpis">${(m.k.skladniki||[]).map(x=>esc(nazwaSur(x.surowiecId))+' '+fmt(x.procent,1)).join(' · ')}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="podpis" style="padding:6px 0">Mieszanki zgodne z kopią.</div>'}
    </div>` : `<div class="prz-sekcja"><div class="prz-tyt">Mieszanki</div>
      <div class="podpis">Ta kopia nie zawiera receptur mieszalni${PRZYKLADOWE.mieszanki.some(p=>jakPrzykladowa('mieszanka',p.id,store.mieszanki[p.id]))
        ? ' — <b>identyczne z przykładowymi są dziś: '+PRZYKLADOWE.mieszanki.filter(p=>jakPrzykladowa('mieszanka',p.id,store.mieszanki[p.id])).map(p=>esc(store.mieszanki[p.id].nazwa)).join(', ')+'</b>. Popraw je ręcznie w Mieszalni albo wczytaj plik kopii zapasowej.':'.'}</div></div>`}

    <div class="prz-sekcja">
      <div class="prz-tyt">Surowce i ceny <span class="podpis">${surRoz.length} do sprawdzenia</span></div>
      ${surRoz.length ? `<div class="przewijak"><table class="gt-tabela prz-tab">
        <thead><tr><th style="width:36px"></th><th>Surowiec</th><th class="num">Cena teraz<br>zł/t</th><th class="num">Data ceny</th><th class="num">Cena z kopii<br>zł/t</th><th class="num">Nowa cena zł/t<br><span style="font-weight:400">(wpisz ręcznie)</span></th><th>Usuń</th></tr></thead>
        <tbody>${surRoz.map(s=>{
          const uzyty = uzyteSur.has(s.id), hist = wHistorii.has(s.id);
          const mozeUsun = s.t && s.przykl && !uzyty;
          return `<tr>
            <td>${s.k?zaznacz(s.przykl || !s.t,'s|'+s.id):''}</td>
            <td><b>${esc(s.k?.nazwa||s.t?.nazwa)}</b>${s.t&&s.k&&s.t.nazwa!==s.k.nazwa?`<br><span class="podpis">teraz: ${esc(s.t.nazwa)}</span>`:''}
              ${s.przykl?'<br><span class="plakietka auto">jak przykładowy</span>':''}${!s.t?'<br><span class="plakietka mieszanka">usunięty — wróci</span>':''}</td>
            <td class="num">${s.t?fmt(s.t.cenaTona,2):'—'}</td><td class="num">${s.t?.dataCeny?dataPL(s.t.dataCeny):'—'}</td>
            <td class="num"><b>${s.k?fmt(s.k.cenaTona,2):'—'}</b></td>
            <td class="num">${s.t?`<input class="pole num" data-prz-cena="${s.id}" inputmode="decimal" placeholder="—" style="width:90px">`:''}</td>
            <td>${mozeUsun?`<label class="podpis"><input type="checkbox" data-prz-usun="${s.id}"> nieużywany${hist?' (był w zapisach dziennych)':''}</label>`:(s.przykl&&uzyty?'<span class="podpis">używany</span>':'')}</td></tr>`;
        }).join('')}</tbody></table></div>
        <div class="podpis">${zr.surowce?'Zaznaczenie przywraca nazwę i cenę z kopii.':'Ta kopia nie ma cen surowców — wpisz prawdziwe ceny w kolumnie „Nowa cena” (puste = bez zmian) albo wczytaj plik kopii zapasowej.'}
          „Usuń” dotyczy tylko surowców przykładowych, których nie używa żadna dawka ani mieszanka.</div>`
        : '<div class="podpis" style="padding:6px 0">Brak surowców do sprawdzenia.</div>'}
    </div>`}`;

  n._przywr = {zr, dawkiRoz, grupyRoz, mixRoz, surRoz};

  const odrysuj = ()=>rysujPrzywracanie(n, nadp, zrodla);
  el.querySelector('#przZrodlo').onchange = e=>{
    if(e.target.value==='__plik') return;
    przywrStan.zrodloId = e.target.value; przywrStan.plik = null; odrysuj();
  };
  el.querySelector('#przPlikBtn').onclick = ()=>el.querySelector('#przPlik').click();
  el.querySelector('#przPlik').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const j = JSON.parse(fr.result); const k = j.kolekcje||{};
        if(!k.dawki){ toast('Plik nie zawiera dawek aplikacji.', true); return; }
        const data = (j.data||'').slice(0,10);
        przywrStan.plik = {id:'__plik', data, ts:Date.parse(j.data)||0, kto:'plik',
          opis:`${f.name} (${dataPL(data)})`, dawki:k.dawki, grupy:k.grupyTech||null, surowce:k.surowce||null, mieszanki:k.mieszanki||null};
        odrysuj();
      }catch(err){ toast('Nieprawidłowy plik JSON.', true); }
    };
    fr.readAsText(f);
  };
  el.querySelectorAll('[data-wsz]').forEach(b=>b.onclick=()=>el.querySelectorAll(`[data-prz^="${b.dataset.wsz}"]`).forEach(c=>c.checked=true));
  el.querySelectorAll('[data-nic]').forEach(b=>b.onclick=()=>el.querySelectorAll(`[data-prz^="${b.dataset.nic}"]`).forEach(c=>c.checked=false));
}

async function wykonajPrzywracanie(n){
  const P = n._przywr; if(!P?.zr){ toast('Wybierz źródło.', true); return false; }
  const zazn = new Set([...n.querySelectorAll('.prz-ch:checked')].map(c=>c.dataset.prz));
  const ceny = [...n.querySelectorAll('[data-prz-cena]')].filter(i=>i.value.trim()).map(i=>({id:i.dataset.przCena, cena:liczba(i.value)}));
  const usun = [...n.querySelectorAll('[data-prz-usun]:checked')].map(c=>c.dataset.przUsun);
  const ile = zazn.size + ceny.length + usun.length;
  if(!ile){ toast('Nic nie zaznaczono.', true); return false; }
  if(!confirm(`Przywrócić ${ile} pozycji z kopii ${dataPL(P.zr.data)}?\n\nStan obecny zostanie wcześniej zapisany jako kopia „Stan sprzed przywracania”.`)) return false;

  // 1. kopia bezpieczeństwa
  const ts = Date.now();
  await DB.zapiszCaly('snapshoty', 'przed_'+ts, {typ:'przed przywróceniem', data:dzisiaj(), ts,
    autor:ROLE[rolaAkt]?.nazwa||'?', dane:klon(store.dawki), grupy:klon(store.grupyTech),
    surowce:klon(store.surowce), mieszanki:klon(store.mieszanki)});
  let n1=0;
  // 2. surowce najpierw (dawki mogą ich potrzebować)
  for(const s of P.surRoz){
    if(!zazn.has('s|'+s.id) || !s.k) continue;
    const {id, ...dane} = s.k;
    await DB.zapisz('surowce', s.id, {...dane, dataCeny:s.k.dataCeny||dzisiaj()}); n1++;
  }
  for(const c of ceny){ await DB.zapisz('surowce', c.id, {cenaTona:Math.round(c.cena*100)/100, dataCeny:dzisiaj()}); n1++; }
  // 3. mieszanki
  for(const m of P.mixRoz){
    if(!zazn.has('m|'+m.id)) continue;
    await DB.zapisz('mieszanki', m.id, {nazwa:m.k.nazwa, skladniki:m.k.skladniki||[], kosztKg:m.k.kosztKg??null}); n1++;
  }
  // 4. dawki — z wpisem do rejestru zmian
  for(const d of P.dawkiRoz){
    if(!zazn.has('d|'+d.id)) continue;
    const pola = {nazwa:d.k.nazwa, skladniki:(d.k.skladniki||[]).map(x=>({surowiecId:x.surowiecId, kg:x.kg}))};
    ['kolejnosc','suchyTMR','lokalizacja'].forEach(k=>{ if(d.k[k]!==undefined) pola[k]=d.k[k]; });
    d.zmiany.forEach(z=>zapiszZmiane(d.id, z.s, z.teraz, z.kopia, dzisiaj(), false));
    await DB.zapisz('dawki', d.id, pola); n1++;
  }
  // 5. grupy
  for(const g of P.grupyRoz){
    const pola = {};
    if(zazn.has('gs|'+g.id)){
      pola.dawki = (g.k.dawki||[]).map(x=>({dawkaId:x.dawkaId, udzial:x.udzial}));
      if(g.k.nazwa) pola.nazwa = g.k.nazwa;
      ['kolejnosc','parentId','lokalizacja'].forEach(k=>{ if(g.k[k]!==undefined) pola[k]=g.k[k]; });
    }
    if(zazn.has('gz|'+g.id) && g.k.sztuk!=null) pola.sztuk = g.k.sztuk;
    if(Object.keys(pola).length){ await DB.zapisz('grupyTech', g.id, pola); n1++; }
  }
  // 6. usunięcie nieużywanych surowców przykładowych
  for(const id of usun){ await DB.usun('surowce', id); n1++; }
  // 7. ceny mieszanek z receptur, wersja dawek od dziś, przeliczenie dzisiejszych wozów
  try{ przeliczCenyMieszanek(); }catch(e){}
  try{ await zapiszWersje(dzisiaj()); zapiszSnapshotDnia(); }catch(e){ console.error(e); }
  for(const lok of ['nadarzyn','boguszyn']){
    if(pzDok(lok, dzisiaj())) await synchronizujZywienieZPaszowozu(lok, dzisiaj());
  }
  toast(`Przywrócono ${n1} pozycji. Kopia stanu sprzed zmian: „Stan sprzed przywracania”.`);
  render();
  return true;
}

function oknoUstawienia(){
  const st = store.config.settings || {};
  const mozeHasla = ROLE[rolaAkt]?.hasla;
  const mozeEd = ['tworca','hodowca'].includes(rolaAkt);
  modal({
    tytul:'Ustawienia',
    szer:'620px',
    tresc:`
      <div class="pole-grupa">
        <label>Nazwa gospodarstwa</label>
        <input id="uNazwa" value="${esc(st.nazwaGospodarstwa||'OHZ Lubiana')}" ${mozeEd?'':'disabled'}>
      </div>
      <div class="pole-grupa">
        <label>Kategorie surowców (jedna w wierszu)</label>
        <textarea id="uKat" rows="6" style="width:100%;padding:10px 12px;border:1.5px solid var(--linia);border-radius:8px" ${mozeEd?'':'disabled'}>${esc(kategorie().join('\n'))}</textarea>
        <div class="hint">Zmiana nazwy kategorii nie przepisuje jej automatycznie w istniejących surowcach.</div>
      </div>
      ${mozeHasla ? `
      <hr style="border:none;border-top:1px solid var(--linia);margin:18px 0">
      <div style="font-weight:600;margin-bottom:10px">Hasła ról</div>
      <div class="podpis" style="margin-bottom:10px">Hasła widoczne poniżej to aktualnie obowiązujące. Zmiana działa od razu na wszystkich urządzeniach.
      <br>Logowanie porównuje skrót SHA-256, ale hasło jest też zapisane jawnie w bazie, żeby dało się je tutaj odczytać —
      kto ma dostęp do konsoli Firebase, ten je zobaczy.</div>
      ${Object.keys(ROLE).map(r=>{
        const dt = store.config.passwords?.zmienioneRole?.[r];
        const akt = store.config.passwords?.jawne?.[r];
        return `
        <div class="pole-grupa">
          <label>${esc(ROLE[r].nazwa)}</label>
          <input data-haslo="${r}" type="text" value="${esc(akt||'')}"
                 placeholder="${akt?'':'hasło nieznane — wpisz nowe'}" autocomplete="off" spellcheck="false">
          <div class="hint">${akt
            ? (dt ? 'Zmienione '+dataPL(dt) : 'Hasło startowe')
            : '<b style="color:var(--zolty)">Hasło ustawiono przed aktualizacją — nie da się go odczytać. Wpisz nowe, żeby było widoczne.</b>'}</div>
        </div>`;}).join('')}
      ` : ''}
      ${rolaAkt==='tworca' ? `
      <hr style="border:none;border-top:1px solid var(--linia);margin:18px 0">
      <div style="font-weight:600;margin-bottom:10px">Uprawnienia ról</div>
      <div class="podpis" style="margin-bottom:12px">
        Wiersze = role, kolumny = zakładki. Zmień komórkę, żeby dać rolę dostęp do zakładki.
        Poziomy: <b>—</b> brak (zakładka niewidoczna), <b>podgląd</b> tylko odczyt,
        <b>wpis</b> może wpisywać dane, <b>pełny</b> edycja wszystkiego.<br>
        <b style="color:var(--zielen)">Twórca jest zawsze pełny</b> — nie da się mu odebrać dostępu, żeby nie zablokować sobie aplikacji.
      </div>
      <div style="overflow-x:auto;margin-bottom:6px">
      <table class="upr-tab">
        <thead><tr>
          <th style="text-align:left">Rola</th>
          ${ZAKLADKI.map(z=>`<th title="${esc(z.etykieta)}">${esc(z.etykieta.replace('🚛 ',''))}</th>`).join('')}
        </tr></thead>
        <tbody>
          ${Object.keys(ROLE_BAZOWE).map(r=>{
            const bazowe = ROLE_BAZOWE[r];
            const nadpis = store.config?.uprawnienia?.[r] || {};
            const tworca = r==='tworca';
            return `<tr>
              <td style="text-align:left;font-weight:600">${esc(bazowe.nazwa)}${tworca?' <span class="podpis">(nietykalny)</span>':''}</td>
              ${ZAKLADKI.map(z=>{
                const aktualny = tworca ? 'pelny' : (nadpis[z.id] ?? bazowe.zakl[z.id] ?? '');
                return `<td><select data-upr-rola="${r}" data-upr-zakl="${z.id}" ${tworca?'disabled':''}>
                  <option value="" ${!aktualny?'selected':''}>—</option>
                  <option value="podglad" ${aktualny==='podglad'?'selected':''}>podgląd</option>
                  <option value="wpis" ${aktualny==='wpis'?'selected':''}>wpis</option>
                  <option value="pelny" ${aktualny==='pelny'?'selected':''}>pełny</option>
                </select></td>`;
              }).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
      <div class="podpis">Zmiana zapisuje się z pozostałymi ustawieniami po kliknięciu <b>Zapisz</b>. Odświeżenie na urządzeniach ról następuje automatycznie.</div>
      ` : ''}
      <div class="podpis">Wersja: ${esc(WERSJA_APP)} · Tryb: ${trybLokalny?'lokalny':'Firestore'}</div>`,
    przyciski:[
      {tekst:'Zamknij'},
      ...(mozeEd?[{tekst:'Zapisz', klasa:'', akcja:async(n)=>{
        // Zbierz WSZYSTKIE dane z inputów ZANIM wykonamy jakikolwiek await
        // (modal może zostać zamknięty między await-ami)
        const dane = {
          nazwaGospodarstwa: n.querySelector('#uNazwa').value.trim() || 'OHZ Lubiana',
          kategorie: n.querySelector('#uKat').value.split('\n').map(x=>x.trim()).filter(Boolean)
        };
        let noweHasla = null, noweDaty = null, noweJawne = null;
        if(mozeHasla){
          const hasla = {...(store.config.passwords?.hasla||{})};
          const jawne = {...(store.config.passwords?.jawne||{})};
          const daty  = {...(store.config.passwords?.zmienioneRole||{})};
          let zmiany=0, puste=[];
          n.querySelectorAll('[data-haslo]').forEach(inp=>{
            const r = inp.dataset.haslo;
            const v = inp.value.trim();
            if(!v){ if(jawne[r]) puste.push(ROLE[r].nazwa); return; }   // puste = zostaw stare
            if(v === jawne[r]) return;                                  // bez zmiany
            hasla[r]=sha256(v); jawne[r]=v; daty[r]=dzisiaj(); zmiany++;
          });
          if(puste.length){ toast('Puste pole nie kasuje hasła: '+puste.join(', ')); }
          if(zmiany){ noweHasla=hasla; noweJawne=jawne; noweDaty=daty; }
        }
        // Uprawnienia — tylko Twórca może zmieniać (widok jest ukryty dla innych ról)
        let noweUprawnienia = null;
        if(rolaAkt==='tworca'){
          const upr = {};
          n.querySelectorAll('[data-upr-rola]').forEach(sel=>{
            const r = sel.dataset.uprRola, z = sel.dataset.uprZakl, v = sel.value;
            if(r==='tworca') return;   // pomijamy — Twórca nietykalny
            (upr[r] ||= {})[z] = v || 'brak';
          });
          // zapisujemy tylko faktyczną zmianę — inaczej „zamrażalibyśmy” domyślne uprawnienia
          const biezace = {};
          Object.keys(upr).forEach(r=>{ biezace[r]={}; Object.keys(upr[r]).forEach(z=>{ biezace[r][z]=ROLE[r]?.zakl?.[z]||'brak'; }); });
          if(JSON.stringify(biezace)!==JSON.stringify(upr)) noweUprawnienia = upr;
        }
        // Teraz bezpiecznie zapisujemy — inputy już nie są potrzebne
        await DB.zapisz('config','settings',dane);
        if(noweHasla) await DB.zapisz('config','passwords',
          {hasla:noweHasla, jawne:noweJawne, zmienioneRole:noweDaty, zmienione:dzisiaj()});
        if(noweUprawnienia) await DB.zapisz('config','uprawnienia', noweUprawnienia);
        document.getElementById('hNazwa').textContent = dane.nazwaGospodarstwa;
        zbudujTaby(); render();
        toast(noweHasla || noweUprawnienia
          ? 'Zapisano ustawienia' + (noweHasla?', hasła':'') + (noweUprawnienia?' i uprawnienia':'') + '.'
          : 'Zapisano ustawienia.');
      }}]:[])
    ]
  });
}

/* ===================== KOPIA ZAPASOWA ===================================== */
function oknoBackup(){
  modal({
    tytul:'Kopia zapasowa',
    tresc:`
      <p style="margin-top:0">Pełny zrzut wszystkich kolekcji do pliku JSON. Rób to regularnie — plik trzymaj poza telefonem.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">
        <button class="btn" id="bkEksport">⬇ Eksportuj JSON</button>
        <button class="btn szary" id="bkImport">⬆ Importuj z pliku</button>
      </div>
      <input type="file" id="bkPlik" accept="application/json,.json" hidden>
      <div class="podpis">Import <b>nadpisuje</b> dokumenty o tych samych identyfikatorach i dodaje brakujące. Nie usuwa dokumentów, których nie ma w pliku.</div>`,
    przyciski:[{tekst:'Zamknij'}]
  });
  document.getElementById('bkEksport').onclick = eksportBackup;
  document.getElementById('bkImport').onclick = ()=> document.getElementById('bkPlik').click();
  document.getElementById('bkPlik').onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{ importBackup(JSON.parse(fr.result)); }catch(err){ toast('Nieprawidłowy plik JSON.', true); } };
    fr.readAsText(f);
  };
}

function eksportBackup(){
  const dane = {
    aplikacja:'OHZ Lubiana — Żywienie',
    wersja:WERSJA_APP,
    data:new Date().toISOString(),
    kolekcje:{}
  };
  KOLEKCJE.forEach(k=> dane.kolekcje[k]=store[k]);
  const blob = new Blob([JSON.stringify(dane,null,2)], {type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download = `lubiana-zywienie-${dzisiaj()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Pobrano kopię zapasową.');
}

function importBackup(dane){
  if(!dane.kolekcje){ toast('Plik nie zawiera danych aplikacji.', true); return; }
  const ile = Object.values(dane.kolekcje).reduce((s,k)=>s+Object.keys(k||{}).length,0);
  potwierdz('Wczytać kopię?',
    `Plik z ${esc(dane.data? dataPL(dane.data.slice(0,10)) : 'nieznanej daty')} — ${ile} dokumentów.\n\nDokumenty o tych samych identyfikatorach zostaną nadpisane.`,
    async ()=>{
      zamknijModal();
      let n=0;
      for(const [kol, docs] of Object.entries(dane.kolekcje)){
        if(!KOLEKCJE.includes(kol)) continue;
        for(const [id, d] of Object.entries(docs||{})){ await DB.zapisz(kol, id, d); n++; }
      }
      toast(`Wczytano ${n} dokumentów.`);
      render();
    }, 'Wczytaj');
}

/* ===================== INSTALACJA PWA ===================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btnInstaluj').hidden = false;
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('btnInstaluj').hidden = true;
  toast('Aplikacja zainstalowana.');
});
document.getElementById('btnInstaluj').onclick = async () => {
  if (!deferredPrompt) {
    toast('Otwórz stronę w Chrome i wybierz „Zainstaluj" z menu przeglądarki.');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') toast('Instalowanie…');
  deferredPrompt = null;
  document.getElementById('btnInstaluj').hidden = true;
};

/* ===================== REAKCJA NA ZMIANY DANYCH =========================== */
['surowce','dawki','mieszanki','grupyTech','produkcja','zywienie','paszowozy','zmianyDawek','wersjeDawek','snapshoty'].forEach(kol=>{
  nasluchuj(kol, ()=>{
    if(!rolaAkt) return;
    const akt = document.activeElement;
    if(akt && akt.tagName==='INPUT' && akt.closest && akt.closest('#tabSurowce')){ renderOdlozony=true; return; }
    if(akt && akt.tagName==='INPUT' && akt.closest && akt.closest('#macierzDawek')){ dRenderOdlozony=true; return; }
    render();
  });
});
nasluchuj('config', ()=>{
  if(!rolaAkt) return;
  document.getElementById('hNazwa').textContent = store.config.settings?.nazwaGospodarstwa || 'OHZ Lubiana';
  // Uprawnienia mogły się zmienić — pasek zakładek przebudowujemy TYLKO gdy faktycznie
  // zmienił się zestaw dostępnych zakładek (inaczej każdy zapis konfiguracji skakał na górę strony)
  const podpis = ZAKLADKI.map(z=>z.id+':'+(poziom(z.id)||'')).join('|');
  if(podpis!==podpisZakladek){ podpisZakladek = podpis; zbudujTaby(); return; }
  // Kolejność wierszy macierzy siedzi w config/ukladDawki — bez tego strzałki nie odświeżały widoku
  const akt = document.activeElement;
  if(akt && akt.tagName==='INPUT' && akt.closest && akt.closest('#macierzDawek')) return;
  render();
});
document.addEventListener('focusout', e=>{
  if(renderOdlozony && e.target.closest && e.target.closest('#tabSurowce')){
    renderOdlozony=false; setTimeout(()=>{ if(!document.activeElement?.closest?.('#tabSurowce')) render(); }, 120);
  }
  if(dRenderOdlozony && e.target.closest && e.target.closest('#macierzDawek')){
    dRenderOdlozony=false; setTimeout(()=>{ if(!document.activeElement?.closest?.('#macierzDawek')) render(); }, 120);
  }
});

window.addEventListener('keydown', e=>{ if(e.key==='Escape') zamknijModal(); });
</script>
