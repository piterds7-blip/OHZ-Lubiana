<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OHZ Lubiana — Żywienie</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14532d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Żywienie">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-64.png">
<style>
:root{
  --zielen:#14532d;
  --zielen-jasna:#1b6b3a;
  --zielen-bardzo-jasna:#e8f3ec;
  --akcent:#14532d;
  --nadarzyn:#0e6f8e;
  --boguszyn:#a8560c;
  --tlo:#f4f6f4;
  --karta:#ffffff;
  --tekst:#1c2420;
  --tekst-slaby:#55645b;
  --linia:#dde5df;
  --czerwony:#b3261e;
  --zolty:#a06a00;
  --zielony-ok:#1e7a3c;
  --cien:0 1px 3px rgba(0,0,0,.10), 0 4px 14px rgba(0,0,0,.05);
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--tlo);color:var(--tekst);font-size:15px;line-height:1.45;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
[hidden]{display:none !important}

/* ---------- SPLASH ---------- */
#splash{
  position:fixed;inset:0;z-index:100;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
}
#splash img{width:150px;height:150px;object-fit:contain}
#splash h1{margin:0;font-size:21px;letter-spacing:.02em;color:var(--zielen);text-align:center}
#splashStan{color:var(--tekst-slaby);font-size:13px;min-height:20px;text-align:center;max-width:460px}
.spinner{width:26px;height:26px;border:3px solid var(--zielen-bardzo-jasna);border-top-color:var(--zielen);border-radius:50%;animation:obrot .8s linear infinite}
@keyframes obrot{to{transform:rotate(360deg)}}
#splashBlad{color:var(--czerwony);font-size:13px;max-width:520px;text-align:left;background:#fdecea;border:1px solid #f5c6c2;border-radius:var(--r);padding:12px 14px;white-space:pre-wrap}

/* ---------- LOGOWANIE ---------- */
#logowanie{
  position:fixed;inset:0;z-index:90;background:var(--tlo);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.karta-log{
  background:#fff;border-radius:14px;box-shadow:var(--cien);padding:28px 24px;width:100%;max-width:390px;text-align:center;
}
.karta-log img{width:104px;height:104px;object-fit:contain;margin-bottom:6px}
.karta-log h2{margin:0 0 2px;font-size:19px;color:var(--zielen)}
.karta-log p.pod{margin:0 0 20px;color:var(--tekst-slaby);font-size:13px}
.karta-log input{
  width:100%;padding:13px 14px;border:1.5px solid var(--linia);border-radius:var(--r);
  font-size:17px;text-align:center;letter-spacing:.06em;background:#fff;
}
.karta-log input:focus{outline:none;border-color:var(--zielen-jasna)}
.karta-log button{
  width:100%;margin-top:12px;padding:13px;background:var(--zielen);color:#fff;
  border-radius:var(--r);font-size:16px;font-weight:600;
}
.karta-log button:active{background:var(--zielen-jasna)}
#blad-log{color:var(--czerwony);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- NAGŁÓWEK ---------- */
header{
  background:var(--akcent);color:#fff;padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;
  transition:background .18s;
}
header .tytul{display:flex;flex-direction:column;min-width:0;flex:1}
header .tytul b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tytul span{font-size:11.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ikony{display:flex;align-items:center;gap:2px}
header .ikony button{
  color:#fff;width:36px;height:36px;border-radius:8px;font-size:17px;
  display:flex;align-items:center;justify-content:center;
}
header .ikony button:active{background:rgba(255,255,255,.18)}
#sync{font-size:17px;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
#sync.zapis{animation:puls 1s ease-in-out infinite}
@keyframes puls{50%{opacity:.35}}
.baner{background:#fff4d6;color:#6b4c00;border-bottom:1px solid #f0dca6;padding:7px 12px;font-size:12.5px;text-align:center}

/* ---------- ZAKŁADKI ---------- */
nav{
  background:#fff;border-bottom:1px solid var(--linia);display:flex;overflow-x:auto;
  position:sticky;top:0;z-index:35;scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:12px 16px;font-size:14px;font-weight:600;color:var(--tekst-slaby);
  border-bottom:3px solid transparent;white-space:nowrap;flex:0 0 auto;
}
nav button.akt{color:var(--akcent);border-bottom-color:var(--akcent)}

main{padding:12px;padding-bottom:calc(28px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto}

/* ---------- ELEMENTY ---------- */
.panel{background:var(--karta);border-radius:var(--r);box-shadow:var(--cien);overflow:hidden;margin-bottom:12px}
.panel-tyt{padding:11px 14px;border-bottom:1px solid var(--linia);font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-tyt .licznik{color:var(--tekst-slaby);font-weight:400;font-size:12.5px}
.pasek{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--linia);background:#fbfcfb}
.pasek input[type=search],.pasek select{
  padding:9px 11px;border:1.5px solid var(--linia);border-radius:8px;background:#fff;min-width:0;
}
.pasek input[type=search]{flex:1 1 190px}
.pasek select{flex:0 1 210px}
.btn{
  padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;
  background:var(--akcent);color:#fff;display:inline-flex;align-items:center;gap:6px;
}
.btn:active{opacity:.85}
.btn.szary{background:#eceeed;color:var(--tekst)}
.btn.czerw{background:var(--czerwony);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.maly{padding:6px 10px;font-size:13px}

table{border-collapse:collapse;width:100%;font-size:14px}
.przewijak{overflow-x:auto;-webkit-overflow-scrolling:touch}
thead th{
  background:var(--zielen);color:#fff;font-weight:600;font-size:12.5px;text-align:left;
  padding:9px 10px;white-space:nowrap;position:sticky;top:0;z-index:2;
}
thead th.klik{cursor:pointer;user-select:none}
thead th.klik:hover{background:var(--zielen-jasna)}
tbody td{padding:5px 10px;border-bottom:1px solid var(--linia);vertical-align:middle}
tbody tr:nth-child(even) td{background:#fafcfa}
tbody tr.rozwiniety td{background:var(--zielen-bardzo-jasna)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.akcje{white-space:nowrap;text-align:right;width:1%}
.lipka{position:sticky;left:0;background:inherit;z-index:1}
thead th.lipka{background:var(--zielen);z-index:3}
tbody tr:nth-child(even) td.lipka{background:#fafcfa}
tbody tr:nth-child(odd) td.lipka{background:#fff}
tbody tr.rozwiniety td.lipka{background:var(--zielen-bardzo-jasna)}

input.pole{
  width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;
}
input.pole:hover{border-color:var(--linia);background:#fff}
input.pole:focus{outline:none;border-color:var(--zielen-jasna);background:#fff;box-shadow:0 0 0 2px rgba(27,107,58,.12)}
input.pole.num{text-align:right;font-variant-numeric:tabular-nums}
select.pole{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent}
select.pole:hover{border-color:var(--linia);background:#fff}
select.pole:focus{outline:none;border-color:var(--zielen-jasna);background:#fff}
.ikonka{width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--tekst-slaby)}
.ikonka:hover{background:#eef1ef}
.ikonka.usun:hover{background:#fdecea;color:var(--czerwony)}
.plakietka{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--zielen-bardzo-jasna);color:var(--zielen);white-space:nowrap}
.plakietka.mieszanka{background:#fff1d9;color:#8a5300}
.plakietka.recept{background:#e7f0fb;color:#1e5aac;font-size:9.5px;padding:1px 5px;margin-left:4px}
.pusto{padding:36px 16px;text-align:center;color:var(--tekst-slaby);font-size:14px}
.podpis{color:var(--tekst-slaby);font-size:12px}
.skladPod{font-size:12.5px;color:var(--tekst-slaby);padding:2px 10px 8px 34px}
.skladPod table{width:auto;min-width:280px;font-size:12.5px}
.skladPod td{padding:2px 10px 2px 0;border:none;background:none !important}

/* ---------- MODAL ---------- */
#nakladka{position:fixed;inset:0;background:rgba(15,25,20,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column}
.modal h3{margin:0;padding:15px 18px;border-bottom:1px solid var(--linia);font-size:16px}
.modal .tresc{padding:16px 18px;overflow:auto}
.modal .stopka{padding:12px 18px;border-top:1px solid var(--linia);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pole-grupa{margin-bottom:14px}
.pole-grupa label{display:block;font-size:12.5px;font-weight:600;color:var(--tekst-slaby);margin-bottom:5px}
.pole-grupa input,.pole-grupa select{width:100%;padding:10px 12px;border:1.5px solid var(--linia);border-radius:8px;background:#fff}
.pole-grupa input:focus,.pole-grupa select:focus{outline:none;border-color:var(--zielen-jasna)}
.pole-grupa .hint{font-size:12px;color:var(--tekst-slaby);margin-top:4px}
.wiersz2{display:flex;gap:10px;flex-wrap:wrap}
.wiersz2>*{flex:1 1 160px}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:120;
  background:#22302a;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;box-shadow:var(--cien);
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
#toast.pokaz{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.blad{background:var(--czerwony)}

@media(max-width:640px){
  main{padding:8px}
  .pasek select{flex:1 1 100%}
  thead th,tbody td{padding-left:8px;padding-right:8px}
}

/* ---------- MACIERZ DAWEK ---------- */
.macierz{overflow:auto;max-height:calc(100vh - 220px);-webkit-overflow-scrolling:touch;position:relative}
.macierz table{min-width:800px;table-layout:fixed}
.macierz thead th{position:sticky;top:0;z-index:4;padding:6px 4px;font-size:11.5px;text-align:center;width:120px;min-width:120px;vertical-align:bottom}
.macierz thead th.lipka{z-index:6;width:220px;min-width:220px;text-align:left;padding-left:10px}
.macierz tbody td{width:120px;min-width:120px}
.macierz tbody td.lipka{width:220px;min-width:220px}
.macierz thead th .nazwa-kol{writing-mode:horizontal-tb;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin:0 auto}
.macierz thead th .kol-akcje{display:flex;gap:2px;justify-content:center;margin-top:3px}
.macierz thead th .kol-akcje button{color:rgba(255,255,255,.7);font-size:11px;width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.macierz thead th .kol-akcje button:hover{color:#fff;background:rgba(255,255,255,.2)}
/* Flagi przypisania dawki do lokalizacji: N, B, W, — (brak) */
.flagi-lok{display:flex;gap:1px;justify-content:center;margin:3px 0 1px}
.flaga-lok{display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;line-height:1;text-align:center;
  border:1px solid rgba(255,255,255,.4);border-radius:3px;
  font-size:9px;font-weight:800;letter-spacing:0;
  color:rgba(255,255,255,.7);background:rgba(0,0,0,.2);
  cursor:pointer;user-select:none;transition:all .12s;
  font-family:system-ui,Arial,sans-serif;padding:0}
.flaga-lok:hover{background:rgba(255,255,255,.25);color:#fff;border-color:#fff;transform:scale(1.15)}
.flaga-lok.akt{background:#fff;border-color:#fff;color:var(--zielen);box-shadow:0 0 0 1px var(--zielen)}
.flaga-lok.wsp.akt{color:#0066cc}
.flaga-lok.brak.akt{color:#999;background:#f0f0f0}
.flaga-lok.brak{font-size:11px}
/* Panel uprawnień w Ustawieniach */
.upr-tab{border-collapse:collapse;font-size:13px;width:100%}
.upr-tab th{background:var(--zielen);color:#fff;padding:6px 8px;font-size:11px;font-weight:600;
  text-align:center;border:1px solid var(--zielen-ciemna);white-space:nowrap}
.upr-tab td{padding:4px 6px;border:1px solid var(--linia);vertical-align:middle}
.upr-tab select{padding:4px 6px;border:1px solid var(--linia);border-radius:5px;font-size:12px;background:#fff;width:100%;min-width:76px}
.upr-tab select:disabled{background:#f0f8f0;color:var(--zielen);font-weight:600}
.upr-tab tbody tr:nth-child(even) td{background:#fafcfa}
.macierz tbody td{padding:2px 3px}
.macierz tbody td.lipka{padding-left:6px;font-size:13px;white-space:nowrap}
.macierz tbody td.lipka .nazwaS{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.macierz input.komorka{
  width:80px;padding:4px 6px;border:1px solid transparent;border-radius:5px;
  background:transparent;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;
}
.macierz input.komorka:hover{border-color:var(--linia);background:#fff}
.macierz input.komorka:focus{outline:none;border-color:var(--zielen-jasna);background:#fff;box-shadow:0 0 0 2px rgba(27,107,58,.12)}
.macierz input.komorka.puste{color:var(--tekst-slaby)}
.macierz .suma-wiersz td{background:#d4edda !important;font-weight:700;font-size:13px;border-top:2px solid var(--zielen)}
.macierz .koszt-wiersz td{background:#f0faf3 !important;font-size:12px;color:var(--zielen);font-weight:600}
.macierz .strzalki{display:inline-flex;flex-direction:column;gap:0;vertical-align:middle;margin-right:3px}
.macierz .strzalki button{width:16px;height:13px;font-size:9px;line-height:1;color:var(--tekst-slaby);padding:0;display:flex;align-items:center;justify-content:center;border-radius:3px}
.macierz .strzalki button:hover{background:var(--zielen-bardzo-jasna);color:var(--zielen)}
.macierz .strzalki button:disabled{opacity:.2}
.macierz .mix-badge{font-size:10px;color:var(--zolty);cursor:pointer;margin-left:2px;vertical-align:middle}
.macierz .wiersz-rozw td{background:#fffdf0 !important;padding:2px 6px 6px 36px;font-size:12px;color:var(--tekst-slaby)}
.dawki-kart{display:none}
/* Na telefonie macierz zostaje — przewijana poziomo, tak jak na komputerze */
@media(max-width:720px){
  .macierz{max-height:calc(100vh - 190px)}
  .macierz thead th.lipka{width:150px;min-width:150px}
  .macierz tbody td.lipka{width:150px;min-width:150px}
  .macierz tbody td.lipka .nazwaS{max-width:100px;font-size:12px}
  .macierz input.komorka{width:64px;font-size:12px;padding:4px}
  .macierz thead th{width:90px;min-width:90px;font-size:10.5px}
  .macierz tbody td{width:90px;min-width:90px}
}

/* ---------- LOKALIZACJE (grupy technologiczne) ---------- */
.gt-tabela{width:100%;font-size:13.5px}
.gt-tabela th{text-align:left;padding:8px 10px;font-size:12px;color:#fff;background:var(--zielen)}
.gt-tabela th.num{text-align:right}          /* nagłówek NAD kolumną liczb, nie obok */
.gt-tabela td{padding:6px 10px;border-bottom:1px solid var(--linia);cursor:pointer;color:var(--tekst)}
.gt-tabela tr:hover td{background:var(--zielen-bardzo-jasna)}
.gt-tabela tr.podgrupa td{padding-left:30px}
.gt-tabela tr.podgrupa td:first-child::before{content:'↳ ';color:var(--tekst-slaby)}
.gt-tabela tr.suma td{background:#c3e6cb !important;font-weight:700;border-top:2px solid var(--zielen);cursor:default;color:#0f3d1f}
.gt-tabela .blad-udzial{color:var(--czerwony);font-size:11px;font-weight:700}
.gt-tabela tr.wgplanu td{background:#fcfcf7}
.gt-tabela tr.wgplanu:hover td{background:var(--zielen-bardzo-jasna)}
.plakietka.auto{background:#f0ecd8;color:#6b5d1f;font-size:10px;margin-left:6px;font-weight:600}
input.pole.potw{background:#f0faf3;border-color:#b9dfc6}
.btn-nied{padding:4px 10px;border:1px dashed var(--linia);border-radius:6px;font-size:13px;
  color:var(--tekst-slaby);font-variant-numeric:tabular-nums;min-width:44px}
.btn-nied:hover{border-color:var(--zielen-jasna);background:#fff}
.btn-nied.ma{background:#fff8e1;border:1px solid #e6c96b;color:#7a5c00;font-weight:700}
.nd-bilans{padding:6px 10px;border-radius:8px;font-size:12.5px;margin-bottom:10px}
.nd-bilans.ok{background:#eaf6ee;color:#0f3d1f}
.nd-bilans.zle{background:#fdecea;color:var(--czerwony);font-weight:600}
.wybor-data{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--linia);
  border-radius:8px;cursor:pointer}
.wybor-data:hover{border-color:var(--zielen-jasna);background:#fafcfa}
.wybor-data input[type=radio]{margin-top:3px}
.pasek-wersja{background:#fff4d6;border-bottom:1px solid #f0dca6;padding:8px 14px;font-size:13px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pasek-wersja.przyszla{background:#e7f0fb;border-color:#bcd4ef}
.menu-eks{position:absolute;z-index:130;background:#fff;border:1px solid var(--linia);border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.18);overflow:hidden;min-width:220px}
.menu-eks button{display:block;width:100%;text-align:left;padding:11px 14px;font-size:13.5px;background:#fff}
.menu-eks button:hover{background:var(--zielen-bardzo-jasna)}
.menu-eks button+button{border-top:1px solid var(--linia)}
.dzien-blok{border-bottom:1px solid var(--linia)}
.dzien-nag{padding:10px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;flex-wrap:wrap;font-size:13.5px}
.dzien-nag:hover{background:var(--zielen-bardzo-jasna)}
.dzien-nag.otwarty{background:var(--zielen-bardzo-jasna);font-weight:600}
.dzien-tresc{background:#fafcfa;border-top:1px solid var(--linia);padding-bottom:8px}

/* ---------- PASZOWÓZ ---------- */
.pz-siatka{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:14px}
.pz-woz{border:2px solid var(--linia);border-radius:12px;background:#fff;overflow:hidden;transition:.15s}
.pz-woz.stan-ok{border-color:#4ade80;box-shadow:0 2px 8px rgba(74,222,128,.15)}
.pz-woz.stan-zle{border-color:#fbbf24;box-shadow:0 2px 8px rgba(251,191,36,.15)}
.pz-woz.stan-brak{border-color:var(--linia);border-style:dashed}
.pz-woz-nag{padding:10px 12px;background:linear-gradient(180deg,#f6faf7,#eef4f0);border-bottom:1px solid var(--linia);
  display:flex;gap:8px;align-items:center}
.pz-nazwa{flex:1;border:none;background:transparent;font-size:14.5px;font-weight:700;color:var(--zielen);padding:2px 4px}
.pz-nazwa:focus{outline:none;background:#fff;border-radius:4px;box-shadow:0 0 0 2px var(--zielen-jasna)}
.pz-stan{font-size:20px;line-height:1}
.pz-stan.ok{color:#22c55e}
.pz-stan.zle{color:#f59e0b}
.pz-stan.brak{color:var(--linia)}
.pz-woz-pola{padding:10px 14px;border-bottom:1px solid var(--linia)}

    const bazowa = ROLE_BAZOWE[rola];
    if(!bazowa) return undefined;
    if(rola==='tworca') return bazowa;   // Twórca — nietykalny
    const nadpis = store.config?.uprawnienia?.[rola];
    if(!nadpis) return bazowa;
    // Puste wartości ('' albo brak) traktujemy jako "brak dostępu do zakładki"
    const zakl = {};
    for(const [z,poz] of Object.entries(nadpis)){
      if(poz && poz!=='brak') zakl[z] = poz;
    }
    return {...bazowa, zakl};
  },
  ownKeys(){ return Object.keys(ROLE_BAZOWE); },
  getOwnPropertyDescriptor(){ return {enumerable:true, configurable:true}; }
});

const CACHE_KEY = k => 'ohz_cache_'+k;
const LOKAL_KEY = k => 'ohz_lokal_'+k;

function nasluchuj(kolekcja, cb){ (sluchacze[kolekcja] ||= []).push(cb); }
function powiadom(kolekcja){ (sluchacze[kolekcja]||[]).forEach(cb=>{try{cb()}catch(e){console.error(e)}}); }

function nowyId(){
  return (Date.now().toString(36) + Math.random().toString(36).slice(2,8));
}

const DB = {
  async zapisz(kolekcja, id, dane){
    id = id || nowyId();
    store[kolekcja][id] = {...(store[kolekcja][id]||{}), ...dane, id};
    powiadom(kolekcja);
    zapiszCache(kolekcja);
    if(trybLokalny){ zapiszLokal(kolekcja); return id; }
    stanSync('zapis');
    try{
      await FS.setDoc(FS.doc(FS.db, kolekcja, id), dane, {merge:true});
      stanSync('ok');
    }catch(e){ console.error(e); stanSync('blad'); toast('Błąd zapisu: '+e.message, true); }
    return id;
  },
  /* Zapis CAŁEGO dokumentu (bez scalania). Firestore przy merge:true scala zagnieżdżone
     mapy, więc usunięta grupa/wóz zostawałby na serwerze — tu dokument jest zastępowany. */
  async zapiszCaly(kolekcja, id, dane){
    store[kolekcja][id] = {...dane, id};
    powiadom(kolekcja);
    zapiszCache(kolekcja);
    if(trybLokalny){ zapiszLokal(kolekcja); return id; }
    stanSync('zapis');
    try{
      await FS.setDoc(FS.doc(FS.db, kolekcja, id), dane);
      stanSync('ok');
    }catch(e){ console.error(e); stanSync('blad'); toast('Błąd zapisu: '+e.message, true); }
    return id;
  },
  async usun(kolekcja, id){
    delete store[kolekcja][id];
    powiadom(kolekcja);
    zapiszCache(kolekcja);
    if(trybLokalny){ zapiszLokal(kolekcja); return; }
    stanSync('zapis');
    try{ await FS.deleteDoc(FS.doc(FS.db, kolekcja, id)); stanSync('ok'); }
    catch(e){ console.error(e); stanSync('blad'); toast('Błąd usuwania: '+e.message, true); }
  }
};

function zapiszCache(kolekcja){
  try{ localStorage.setItem(CACHE_KEY(kolekcja), JSON.stringify(store[kolekcja])); }catch(e){}
}
function czytajCache(kolekcja){
  try{ const s=localStorage.getItem(CACHE_KEY(kolekcja)); if(s) store[kolekcja]=JSON.parse(s); }catch(e){}
}
function zapiszLokal(kolekcja){
  try{ localStorage.setItem(LOKAL_KEY(kolekcja), JSON.stringify(store[kolekcja])); }catch(e){}
}
function czytajLokal(kolekcja){
  try{ const s=localStorage.getItem(LOKAL_KEY(kolekcja)); if(s) store[kolekcja]=JSON.parse(s); }catch(e){}
}

/* ===================== WSKAŹNIK SYNCHRONIZACJI ============================ */
let stanBiezacy='ok';
function stanSync(stan){
  stanBiezacy = stan;
  const el = document.getElementById('sync');
  if(!el) return;
  el.classList.remove('zapis');
  if(trybLokalny){ el.textContent='▤'; el.title='Tryb lokalny — dane tylko w tej przeglądarce'; return; }
  if(!navigator.onLine){ el.textContent='☁✕'; el.title='Offline — zmiany zapiszą się po odzyskaniu połączenia'; return; }
  if(stan==='zapis'){ el.textContent='☁↑'; el.title='Zapisywanie…'; el.classList.add('zapis'); return; }
  if(stan==='blad'){ el.textContent='☁!'; el.title='Błąd synchronizacji'; return; }
  if(stan==='cache'){ el.textContent='☁~'; el.title='Dane z pamięci podręcznej'; return; }
  el.textContent='☁✓'; el.title='Zsynchronizowano';
}
addEventListener('online', ()=>stanSync('ok'));
addEventListener('offline', ()=>stanSync('ok'));

function toast(txt, blad=false){
  const t=document.getElementById('toast');
  t.textContent=txt; t.classList.toggle('blad',blad); t.classList.add('pokaz');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('pokaz'), 2800);
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function liczba(v){ if(v===''||v==null) return 0; const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(n)?0:n; }
function fmt(n, dec=2){ return (Number(n)||0).toLocaleString('pl-PL',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function dzisiaj(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dataPL(iso){ if(!iso) return '—'; const [r,m,d]=iso.split('-'); return `${d}.${m}.${r}`; }

function modal({tytul, tresc, przyciski=[], szer}){
  const n=document.getElementById('nakladka');
  n.innerHTML = `<div class="modal" ${szer?`style="max-width:${szer}"`:''}>
      <h3>${esc(tytul)}</h3>
      <div class="tresc">${tresc}</div>
      <div class="stopka">${przyciski.map((p,i)=>`<button class="btn ${p.klasa||'szary'}" data-i="${i}">${esc(p.tekst)}</button>`).join('')}</div>
    </div>`;
  n.hidden=false;
  n.querySelectorAll('.stopka button').forEach(b=>{
    b.onclick=async()=>{ const p=przyciski[+b.dataset.i]; if(!p.akcja || (await p.akcja(n))!==false) zamknijModal(); };
  });
  n.onclick=e=>{ if(e.target===n) zamknijModal(); };
  return n;
}
function zamknijModal(){ const n=document.getElementById('nakladka'); n.hidden=true; n.innerHTML=''; }
function potwierdz(tytul, tekst, naTak, tekstTak='Usuń'){
  modal({tytul, tresc:`<div style="white-space:pre-wrap">${tekst}</div>`,
    przyciski:[{tekst:'Anuluj'},{tekst:tekstTak, klasa:'czerw', akcja:naTak}]});
}

/* ---------- Firebase ---------- */
async function polaczFirebase(){
  const [appM, fsM, authM] = await Promise.all([
    import(SDK+'firebase-app.js'),
    import(SDK+'firebase-firestore.js'),
    import(SDK+'firebase-auth.js')
  ]);
  const app = appM.initializeApp(firebaseConfig);

  let db;
  try{
    db = fsM.initializeFirestore(app, {
      localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})
    });
  }catch(e){ db = fsM.getFirestore(app); }

  FS = {db, ...fsM};

  // Logowanie anonimowe — reguły Firestore mogą wymagać request.auth != null
  const auth = authM.getAuth(app);
  try{ await authM.signInAnonymously(auth); }
  catch(e){ console.warn('Anonimowe logowanie nieudane:', e.message); }

  // Nasłuch na wszystkie kolekcje
  KOLEKCJE.forEach(kol=>{
    FS.onSnapshot(FS.collection(FS.db, kol), {includeMetadataChanges:true},
      snap=>{
        const bylPotw = !!serwerPotwierdzil[kol];
        if(!snap.metadata.fromCache) serwerPotwierdzil[kol] = true;
        // zmiana samych metadanych (np. potwierdzenie zapisu) — bez przerysowania widoku,
        // chyba że właśnie dostaliśmy pierwsze potwierdzenie z serwera
        if(pierwszySnapshot[kol] && !snap.docChanges().length && bylPotw===!!serwerPotwierdzil[kol]){
          stanSync(snap.metadata.fromCache ? 'cache' : 'ok'); return;
        }
        const nowe={};
        snap.forEach(d=> nowe[d.id]={...d.data(), id:d.id});
        store[kol]=nowe;                 // Firestore nadpisuje cache — jest źródłem prawdy
        zapiszCache(kol);
        pierwszySnapshot[kol]=true;
        powiadom(kol);
        stanSync(snap.metadata.fromCache ? 'cache' : 'ok');
      },
      err=>{ console.error('onSnapshot '+kol, err); pierwszySnapshot[kol]=true; stanSync('blad'); }
    );
  });
}

/* Preload konfiguracji (hasła!) zanim pokaże się formularz logowania.
   To był błąd poprzedniej aplikacji: hasła ładowały się dopiero po zalogowaniu,
   więc zmiana hasła nie propagowała się na inne urządzenia. */
async function preloadConfig(){
  const start = Date.now();
  while(!pierwszySnapshot.config && Date.now()-start < 8000){
    await new Promise(r=>setTimeout(r,80));
  }
  if(!pierwszySnapshot.config) console.warn('Konfiguracja nie dotarła w 8 s — działam na pamięci podręcznej.');
}

/* ---------- Zasiew danych startowych ---------- */
/* Czeka, aż wskazane kolekcje przyjdą z SERWERA (nie z pamięci urządzenia). */
async function czekajNaSerwer(kolekcje, ms){
  if(trybLokalny) return true;
  const start = Date.now();
  while(Date.now()-start < ms){
    if(kolekcje.every(k=>serwerPotwierdzil[k])) return true;
    await new Promise(r=>setTimeout(r,100));
  }
  return kolekcje.every(k=>serwerPotwierdzil[k]);
}

/* Zasiew danych startowych — WYŁĄCZNIE gdy serwer potwierdził, że baza jest naprawdę pusta.
   Wcześniej wystarczyło, że urządzenie z pustą pamięcią nie dostało jeszcze danych,
   i dane przykładowe nadpisywały prawdziwe (incydent z 25.09.2026). */
async function zasiej(){
  if(!trybLokalny){
    if(!navigator.onLine) return;
    const ok = await czekajNaSerwer(['config','surowce','dawki','grupyTech','mieszanki'], 8000);
    if(!ok){ console.warn('Brak potwierdzenia z serwera — pomijam zasiew danych startowych.'); return; }
  }
  if(!store.config.settings){
    await DB.zapisz('config','settings',{
      nazwaGospodarstwa:'OHZ Lubiana',
      waluta:'PLN',
      jednostkaCeny:'zl_tona',        // ceny wprowadzane w zł/t, w obliczeniach zł/kg
      kategorie:KATEGORIE_START,
      wersja:WERSJA_APP
    });
  }
  if(!store.config.passwords){
    const hasla={}, jawne={};
    for(const [k,v] of Object.entries(HASLA_STARTOWE)){ hasla[k]=sha256(v); jawne[k]=v; }
    await DB.zapisz('config','passwords',{hasla, jawne, zmienione:dzisiaj()});
    console.info('Zasiano hasła startowe:', HASLA_STARTOWE);
  }
  // Dane przykładowe — tylko gdy baza jest pusta
  const pusto = k => Object.keys(store[k]).length===0;
  if(pusto('surowce') && pusto('dawki') && pusto('mieszanki') && pusto('grupyTech')) await zasiejPrzykladowe();
  // Grupy dosiewamy tylko do bazy, w której są dawki przykładowe — nigdy nie nadpisujemy istniejących grup
  else if(pusto('grupyTech') && PRZYKLADOWE.dawki.every(d=>store.dawki[d.id])) await zasiejGrupy();
}

async function zasiejPrzykladowe(){
  console.info('Zasiewam dane przykładowe…');
  const d = dzisiaj();

  /* ===== SUROWCE ===== */
  const S = PRZYKLADOWE.surowce;
  for(let i=0; i<S.length; i++){
    const s=S[i];
    await DB.zapisz('surowce', s.id, {
      nazwa:s.nazwa, kategoria:s.kategoria, cenaTona:s.cenaTona,
      dataCeny:d, kolejnosc:i+1, zMieszalni:false, mieszankaId:null, lokalizacja:null
    });
  }

  /* ===== MIESZANKI (receptury w %) ===== */
  const M = PRZYKLADOWE.mieszanki;

  // Oblicz koszt mieszanki i dodaj jako surowiec
  const cenySur = {};
  S.forEach(s=> cenySur[s.id]=s.cenaTona);

  for(let i=0; i<M.length; i++){
    const m = M[i];
    // Koszt zł/t = Σ (procent/100 × cenaTona składnika)
    const kosztTona = m.skladniki.reduce((sum,sk)=> sum + (sk.procent/100)*(cenySur[sk.surowiecId]||0), 0);
    const kosztKg = kosztTona / 1000;

    await DB.zapisz('mieszanki', m.id, {
      nazwa:m.nazwa, skladniki:m.skladniki, kosztKg:Math.round(kosztKg*10000)/10000
    });
    // Dodaj mieszankę jako surowiec
    await DB.zapisz('surowce', m.surId, {
      nazwa:m.nazwa, kategoria:'Mieszanka własna', cenaTona:Math.round(kosztTona*100)/100,
      dataCeny:d, kolejnosc:S.length+i+1, zMieszalni:true, mieszankaId:m.id, lokalizacja:null
    });
  }

  /* ===== DAWKI (10 grup żywieniowych — kg świeżej masy / szt / dobę) ===== */
  const D = PRZYKLADOWE.dawki;

  for(const daw of D){
    await DB.zapisz('dawki', daw.id, {
      nazwa:daw.nazwa, suchyTMR:daw.suchyTMR,
      skladniki:daw.skladniki, kolejnosc:daw.kolejnosc
    });
  }

  console.info('Zasiano:', S.length, 'surowców,', M.length, 'mieszanek,', D.length, 'dawek');
  await zasiejGrupy();
}

const inpHaslo = document.getElementById('haslo');
const bladLog  = document.getElementById('blad-log');

function probujZalogowac(){
  const h = inpHaslo.value.trim();
  if(!h){ bladLog.textContent='Podaj hasło.'; return; }
  const hasla = store.config.passwords?.hasla || {};
  const hash = sha256(h);
  const rola = Object.keys(hasla).find(r => hasla[r]===hash);
  if(!rola || !ROLE[rola]){ bladLog.textContent='Nieprawidłowe hasło.'; inpHaslo.value=''; return; }
  bladLog.textContent=''; inpHaslo.value='';
  zaloguj(rola);
}

function zapiszSesje(rola){
  try{ localStorage.setItem('ohz_sesja', JSON.stringify({rola, ts:Date.now()})); }catch(e){}
}
function wczytajSesje(){
  try{
    const s=JSON.parse(localStorage.getItem('ohz_sesja')||'null');
    if(!s || !ROLE[s.rola]) return null;
    if(Date.now()-s.ts > 30*24*3600*1000) return null;   // sesja ważna 30 dni
    return s.rola;
  }catch(e){ return null; }
}

  podpisZakladek = ZAKLADKI.map(z=>z.id+':'+(poziom(z.id)||'')).join('|');

function przejdz(id){
  zakladkaAkt = id;
  document.querySelectorAll('#taby button').forEach(b=> b.classList.toggle('akt', b.dataset.z===id));
  const akcent = id==='nadarzyn' ? 'var(--nadarzyn)' : id==='boguszyn' ? 'var(--boguszyn)' : 'var(--zielen)';
  document.documentElement.style.setProperty('--akcent', akcent);
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.content = id==='nadarzyn' ? '#0e6f8e' : id==='boguszyn' ? '#a8560c' : '#14532d';
  document.getElementById('widok').scrollTop=0; window.scrollTo(0,0);
  render();
}

/* Przerysowanie widoku nie może zabierać fokusu ani gubić tego, co ktoś właśnie wpisuje
   (dane z innego urządzenia przychodzą w dowolnej chwili). */
function render(){
  const w = document.getElementById('widok');
  const a = document.activeElement;
  let klucz=null, wartosc=null, edytowane=false, zaznacz=null;
  if(a && w.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){
    for(const at of a.attributes){
      if(at.name.startsWith('data-') && at.value){ klucz=`[${at.name}="${at.value.replace(/["\\]/g,'\\$&')}"]`; break; }
    }
    if(!klucz && a.id) klucz = '#'+a.id;
    wartosc = a.value;
    edytowane = a.tagName!=='SELECT' && a.value!==a.defaultValue;
    try{ zaznacz=[a.selectionStart, a.selectionEnd]; }catch(e){}
  }
  renderWidok(w);
  if(klucz){
    let n=null; try{ n = w.querySelector(klucz); }catch(e){}
    if(n && n!==document.activeElement){
      if(edytowane && n.tagName!=='SELECT') n.value = wartosc;
      n.focus({preventScroll:true});
      try{ if(zaznacz && zaznacz[0]!=null) n.setSelectionRange(zaznacz[0], zaznacz[1]); }catch(e){}
    }
  }
}
function renderWidok(w){
  if(zakladkaAkt==='surowce'){ renderSurowce(w); return; }
  if(zakladkaAkt==='dawki'){ renderDawki(w); return; }
  if(zakladkaAkt==='nadarzyn'){ renderLokalizacja(w,'nadarzyn'); return; }
  if(zakladkaAkt==='boguszyn'){ renderLokalizacja(w,'boguszyn'); return; }
  if(zakladkaAkt==='paszowozN'){ renderPaszowoz(w,'nadarzyn'); return; }
  if(zakladkaAkt==='paszowozB'){ renderPaszowoz(w,'boguszyn'); return; }
  if(zakladkaAkt==='mieszalnia'){ renderMieszalnia(w); return; }
  if(zakladkaAkt==='raporty'){ renderRaporty(w); return; }
  w.innerHTML = `<div class="panel">
      <div class="panel-tyt">${esc(ZAKLADKI.find(z=>z.id===zakladkaAkt)?.etykieta||'')}</div>
      <div class="pusto">Moduł w przygotowaniu — zbudujemy go w kolejnym kroku.</div>
    </div>`;
}

let sSort = {pole:'kolejnosc', kier:1};
let sSzukaj = '';
let sKategoria = '';

let renderOdlozony = false;

function kategorie(){ return store.config.settings?.kategorie || KATEGORIE_START; }

function listaSurowcow(){
  let arr = Object.values(store.surowce);
  if(sSzukaj){
    const q = sSzukaj.toLowerCase();
    arr = arr.filter(s => (s.nazwa||'').toLowerCase().includes(q));
  }
  if(sKategoria) arr = arr.filter(s => s.kategoria===sKategoria);
  const p = sSort.pole, k = sSort.kier;
  arr.sort((a,b)=>{
    let x,y;
    if(p==='kolejnosc'){ x=a.kolejnosc??9999; y=b.kolejnosc??9999; }
    else if(p==='cena'){ x=a.cenaTona??0; y=b.cenaTona??0; }
    else { x=(a[p]||'').toString().toLowerCase(); y=(b[p]||'').toString().toLowerCase(); }
    if(x<y) return -1*k; if(x>y) return 1*k;
    return (a.nazwa||'').localeCompare(b.nazwa||'','pl');
  });
  return arr;
}

function uzycieSurowca(id){
  const wDawkach = Object.values(store.dawki).filter(d => (d.skladniki||[]).some(s=>s.surowiecId===id)).map(d=>d.nazwa||'dawka');
  const wMieszankach = Object.values(store.mieszanki).filter(m => (m.skladniki||[]).some(s=>s.surowiecId===id)).map(m=>m.nazwa||'mieszanka');
  return {wDawkach, wMieszankach, ile:wDawkach.length+wMieszankach.length};
}

            <th class="klik" data-sort="dataCeny">Data ceny${strzalka('dataCeny')}</th>
            ${edycja?'<th class="akcje"></th>':''}
          </tr>
        </thead>
        <tbody>
          ${lista.length ? lista.map((s,i)=>wierszSurowca(s,i,lista,edycja)).join('')
            : `<tr><td colspan="${edycja?7:6}"><div class="pusto">${wszystkie? 'Brak surowców pasujących do filtrów.' : 'Brak surowców. '+(edycja?'Dodaj pierwszy przyciskiem „+ Surowiec”.':'')}</div></td></tr>`}
        </tbody>
      </table>
    </div>
  </div>
  <div class="podpis" style="padding:0 4px 10px">
    Ceny wprowadzasz w <b>zł za tonę</b>. W dawkach, mieszankach i raportach aplikacja przelicza je na <b>zł/kg</b>.
    Mieszanki z Mieszalni pojawiają się tu automatycznie jako pojedynczy surowiec — strzałką ▸ rozwiniesz ich skład.
  </div>`;

  // filtry
  const inpSz = w.querySelector('#sSzukaj');
  inpSz.oninput = e=>{ sSzukaj=e.target.value; const poz=e.target.selectionStart; renderSurowce(w);
    const n=document.getElementById('sSzukaj'); n.focus(); n.setSelectionRange(poz,poz); };
  w.querySelector('#sKat').onchange = e=>{ sKategoria=e.target.value; renderSurowce(w); };
  w.querySelector('#btnSortWlasny').onclick = ()=>{ sSort={pole:'kolejnosc',kier:1}; renderSurowce(w); };
  w.querySelectorAll('th.klik').forEach(th=>{
    th.onclick = ()=>{
      const p=th.dataset.sort;
      sSort = (sSort.pole===p) ? {pole:p, kier:-sSort.kier} : {pole:p, kier:1};
      renderSurowce(w);
    };
  });
  const btnDod = w.querySelector('#btnDodajSur');
  if(btnDod) btnDod.onclick = oknoNowySurowiec;

  // wiersze
  w.querySelectorAll('[data-rozwin]').forEach(b=>{
    b.onclick=()=>{ const id=b.dataset.rozwin;
      sRozwiniete.has(id)?sRozwiniete.delete(id):sRozwiniete.add(id); renderSurowce(w); };
  });
  w.querySelectorAll('[data-pole]').forEach(el=>{
    el.onchange = ()=>{
      const {id, pole} = el.dataset;
      const s = store.surowce[id]; if(!s) return;
      if(pole==='nazwa'){
        const nowa = el.value.trim();
        if(!nowa){ el.value=s.nazwa; return; }
        const dubel = Object.values(store.surowce).find(x=>x.id!==id && (x.nazwa||'').toLowerCase()===nowa.toLowerCase());
        if(dubel){ toast('Surowiec o tej nazwie już istnieje.', true); el.value=s.nazwa; return; }
        DB.zapisz('surowce', id, {nazwa:nowa});
      }else if(pole==='kategoria'){
        DB.zapisz('surowce', id, {kategoria:el.value});
      }else if(pole==='cena'){
        const v = liczba(el.value);
        if(v<0){ toast('Cena nie może być ujemna.', true); el.value=fmt(s.cenaTona,2); return; }
        DB.zapisz('surowce', id, {cenaTona:v, dataCeny:dzisiaj()});
        // Zmiana ceny składnika może wpływać na koszt mieszanek — przelicz
        setTimeout(przeliczCenyMieszanek, 500);
      }
    };
    el.onfocus = ()=>{ if(el.dataset.pole==='cena') el.value = el.dataset.raw||''; };
    el.onblur  = ()=>{ if(el.dataset.pole==='cena' && !renderOdlozony) el.value = fmt(liczba(el.value),2); };
  });
  w.querySelectorAll('[data-usun]').forEach(b=> b.onclick=()=>usunSurowiec(b.dataset.usun));
  w.querySelectorAll('[data-gora]').forEach(b=> b.onclick=()=>przesun(b.dataset.gora,-1));
  w.querySelectorAll('[data-dol]').forEach(b=> b.onclick=()=>przesun(b.dataset.dol,1));
}

function wierszSurowca(s, i, lista, edycja){
  const mieszanka = s.zMieszalni || s.kategoria==='Mieszanka własna';
  const rozw = sRozwiniete.has(s.id);
  const wlasna = sSort.pole==='kolejnosc';
  const zlKg = (s.cenaTona||0)/1000;
  let html = `
  <tr class="${rozw?'rozwiniety':''}">
    <td>${mieszanka?`<button class="ikonka" data-rozwin="${s.id}" title="Pokaż skład">${rozw?'▾':'▸'}</button>`:''}</td>
    <td class="lipka">
      ${edycja
        ? `<input class="pole" data-id="${s.id}" data-pole="nazwa" value="${esc(s.nazwa)}">`
        : esc(s.nazwa)}
    </td>
    <td>
      ${edycja
        ? `<select class="pole" data-id="${s.id}" data-pole="kategoria">
             ${kategorie().map(k=>`<option ${k===s.kategoria?'selected':''}>${esc(k)}</option>`).join('')}
           </select>`
        : `<span class="plakietka ${mieszanka?'mieszanka':''}">${esc(s.kategoria||'—')}</span>`}
    </td>
    <td class="num">
      ${edycja && !s.zMieszalni
        ? `<input class="pole num" data-id="${s.id}" data-pole="cena" data-raw="${s.cenaTona??''}" value="${fmt(s.cenaTona,2)}" inputmode="decimal">`
        : `${fmt(s.cenaTona,2)}${s.zMieszalni?' <span class="plakietka recept" title="Cena wyliczona automatycznie z receptury i bieżących cen składników">z receptury</span>':''}`}
    </td>
    <td class="num">${fmt(zlKg,4)}</td>
    <td>${dataPL(s.dataCeny)}</td>
    ${edycja?`<td class="akcje">
        ${wlasna?`<button class="ikonka" data-gora="${s.id}" ${i===0?'disabled style="opacity:.25"':''} title="W górę">↑</button>
                  <button class="ikonka" data-dol="${s.id}" ${i===lista.length-1?'disabled style="opacity:.25"':''} title="W dół">↓</button>`:''}
        <button class="ikonka usun" data-usun="${s.id}" title="Usuń">✕</button>
      </td>`:''}
  </tr>`;

  if(mieszanka && rozw){
    const m = store.mieszanki[s.mieszankaId] || Object.values(store.mieszanki).find(x=>x.nazwa===s.nazwa);
    const kol = edycja?7:6;
    let tresc;
    if(m && (m.skladniki||[]).length){
      tresc = `<table>${(m.skladniki||[]).map(sk=>{
        const sur = store.surowce[sk.surowiecId];
        return `<tr><td>${esc(sur?.nazwa||'—')}</td><td class="num">${fmt(sk.procent ?? sk.udzial ?? 0,2)} %</td></tr>`;
      }).join('')}</table>`;
    }else{
      tresc = 'Skład pojawi się po zdefiniowaniu receptury w zakładce Mieszalnia.';
    }
    html += `<tr class="rozwiniety"><td colspan="${kol}"><div class="skladPod"><b>Skład mieszanki:</b><br>${tresc}</div></td></tr>`;
  }
  return html;
}

function przesun(id, kierunek){
  const lista = listaSurowcow();
  const i = lista.findIndex(s=>s.id===id);
  const j = i + kierunek;
  if(i<0 || j<0 || j>=lista.length) return;
  const a = lista[i], b = lista[j];
  const ka = a.kolejnosc ?? i, kb = b.kolejnosc ?? j;
  DB.zapisz('surowce', a.id, {kolejnosc:kb});
  DB.zapisz('surowce', b.id, {kolejnosc:ka});
}

/* ===================== WERSJONOWANIE DAWEK ===============================
   Zmiana dawki może obowiązywać od dziś albo od wskazanej daty w przyszłości.
   Wersja = pełna migawka dawek i udziałów grup, ważna od `odData` w przód.
   Dzięki temu raport z dowolnego dnia pokazuje stan faktycznie wtedy obowiązujący.
   ========================================================================= */
let wersjaOd = null;        // data obowiązywania edycji w tej sesji
let wersjaPytano = false;   // czy w tej sesji zapytano "od kiedy"

function idWersji(data){ return 'w_'+data; }

function wersjeWgDaty(){
  return Object.values(store.wersjeDawek).sort((a,b)=>(a.odData||'').localeCompare(b.odData||''));
}
function wersjeZaplanowane(){
  return wersjeWgDaty().filter(w=>w.zaplanowana && w.odData>dzisiaj());
}

/* Dawki obowiązujące danego dnia — na potrzeby raportów historycznych */
function dawkiNaDzien(data){
  const pasujace = wersjeWgDaty().filter(w=>!w.zaplanowana && (w.odData||'')<=data);
  if(!pasujace.length) return store.dawki;
  return pasujace[pasujace.length-1].dawki || store.dawki;
}

/* Źródło danych dla macierzy Dawek: przy edycji wersji przyszłej pokazujemy JĄ,
   żeby użytkownik widział to, co faktycznie edytuje. */
function zrodloDawek(){
  if(wersjaOd && wersjaOd>dzisiaj()){
    const w = store.wersjeDawek[idWersji(wersjaOd)];
    if(w?.dawki) return w.dawki;
  }
  return store.dawki;
}

function klonDawek(){
  const k={}; for(const [id,d] of Object.entries(store.dawki)) k[id]={...d, skladniki:[...(d.skladniki||[])]};
  return k;
}
function klonGrup(){
  const k={}; for(const [id,g] of Object.entries(store.grupyTech)) k[id]={...g, dawki:[...(g.dawki||[])]};
  return k;
}

/* Zapis migawki obowiązującej od podanego dnia (dla zmian wchodzących od razu) */
async function zapiszWersje(odData){
  await DB.zapisz('wersjeDawek', idWersji(odData), {
    odData, ts:Date.now(), rola:ROLE[rolaAkt]?.nazwa||'?',
    zaplanowana:false, dawki:klonDawek(), grupy:klonGrup()
  });
}

/* Zmiana wchodząca w przyszłości — trafia do wersji zaplanowanej, nie rusza bieżących dawek */
async function zapiszDoZaplanowanej(odData, mutator){
  const id = idWersji(odData);
  const ist = store.wersjeDawek[id];
  const baza = (ist?.zaplanowana && ist.dawki) ? {dawki:{...ist.dawki}, grupy:{...(ist.grupy||klonGrup())}}
                                               : {dawki:klonDawek(), grupy:klonGrup()};
  mutator(baza);
  await DB.zapisz('wersjeDawek', id, {
    odData, ts:Date.now(), rola:ROLE[rolaAkt]?.nazwa||'?',
    zaplanowana:true, dawki:baza.dawki, grupy:baza.grupy
  });
}

/* Wejście w życie zaplanowanych zmian — wywoływane przy starcie aplikacji */
async function zastosujZaplanowane(){
  // Tylko na świeżych danych z serwera — stara pamięć urządzenia mogłaby ponownie
  // wprowadzić wersję zastosowaną już dawno temu na innym urządzeniu.
  if(!(await czekajNaSerwer(['wersjeDawek','dawki','grupyTech'], 15000))) return;
  const dzis = dzisiaj();
  const doZast = Object.values(store.wersjeDawek)
    .filter(w=>w.zaplanowana && (w.odData||'')<=dzis)
    .sort((a,b)=>(a.odData||'').localeCompare(b.odData||''));
  if(!doZast.length) return;
  for(const w of doZast){
    for(const [id,d] of Object.entries(w.dawki||{})){
      if(store.dawki[id]) await DB.zapisz('dawki', id, {skladniki:d.skladniki, nazwa:d.nazwa});
    }
    for(const [id,g] of Object.entries(w.grupy||{})){
      if(store.grupyTech[id]) await DB.zapisz('grupyTech', id, {dawki:g.dawki});
    }
    await DB.zapisz('wersjeDawek', w.id, {zaplanowana:false, zastosowanaTs:Date.now()});
    console.info('Zastosowano zaplanowaną zmianę dawek z', w.odData);
  }
  toast(`Weszły w życie zaplanowane zmiany dawek (${doZast.length}).`);
}

/* Pytanie "od kiedy" — raz na sesję edycji, żeby nie pytać przy każdej komórce */

  const jutro = dataPlus(dzisiaj(),1);
  const za3 = dataPlus(dzisiaj(),3);
  modal({
    tytul:'Od kiedy ma obowiązywać zmiana?',
    tresc:`
      <div class="podpis" style="margin-bottom:12px">
        Zmiany wprowadzane teraz zostaną zapisane z datą obowiązywania. Raporty za dni wcześniejsze
        pozostaną nietknięte — pokażą dawkę, która wtedy faktycznie obowiązywała.
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label class="wybor-data"><input type="radio" name="odk" value="${dzisiaj()}" checked>
          <span><b>Od dziś</b> — ${dataPL(dzisiaj())}<br><span class="podpis">Zmiana widoczna natychmiast w zakładkach lokalizacji</span></span></label>
        <label class="wybor-data"><input type="radio" name="odk" value="${jutro}">
          <span><b>Od jutra</b> — ${dataPL(jutro)}</span></label>
        <label class="wybor-data"><input type="radio" name="odk" value="${za3}">
          <span><b>Za 3 dni</b> — ${dataPL(za3)}</span></label>
        <label class="wybor-data"><input type="radio" name="odk" value="__data">

      </div>`,
    przyciski:[
      {tekst:'Anuluj', akcja:()=>{ poWyborze(null); }},
      {tekst:'Potwierdź', klasa:'', akcja:(n)=>{

        const d = wyb==='__data' ? n.querySelector('#okData').value : wyb;
        if(!d){ toast('Wybierz datę.',true); return false; }
        poWyborze(d);
      }}
    ]
  });
}

/* Upewnia się, że wiemy od kiedy obowiązuje zmiana; potem wykonuje akcję */
function zOdKiedy(akcja){
  if(wersjaPytano && wersjaOd){ akcja(wersjaOd); return; }
  pytajOdKiedy(d=>{
    if(!d) return;                 // anulowano — nie zapisujemy
    wersjaOd = d; wersjaPytano = true;
    akcja(d);
    render();
  });
}

/* ===================== ZAKŁADKA: DAWKI (macierz) ========================== */
let dRozwiniete = new Set();     // surowce z rozwiniętym składem mieszanki
let dRenderOdlozony = false;

function dawkiSorted(){
  return Object.values(zrodloDawek()).sort((a,b)=>(a.kolejnosc??99)-(b.kolejnosc??99));
}

function wierszeDawek(){
  // Zbierz unikalne surowiecId ze wszystkich dawek, zachowaj globalną kolejność
  const map = new Map();
  for(const d of dawkiSorted()){
    for(const sk of (d.skladniki||[])){
      if(!map.has(sk.surowiecId)){
        map.set(sk.surowiecId, map.size);
      }
    }
  }
  // Sortuj po pozycji dodania (w przyszłości config/ukladDawki nadpisze)
  const uklad = store.config.ukladDawki?.wiersze;
  if(uklad && uklad.length){
    const ids = uklad.filter(id=>map.has(id) || store.surowce[id]);
    // Dodaj te, których brakuje w uładzie
    for(const id of map.keys()) if(!ids.includes(id)) ids.push(id);
    return ids;
  }
  return [...map.keys()];
}

function kgWDawce(dawka, surowiecId){
  const sk = (dawka.skladniki||[]).find(s=>s.surowiecId===surowiecId);
  return sk ? sk.kg : 0;
}

function sumaDawki(dawka){
  return (dawka.skladniki||[]).reduce((s,sk)=>s+sk.kg, 0);
}

function kosztDawki(dawka){
  return (dawka.skladniki||[]).reduce((s,sk)=>{
    const sur = store.surowce[sk.surowiecId];
    const cenaKg = (sur?.cenaTona||0)/1000;
    return s + sk.kg * cenaKg;
  }, 0);
}

function zapiszKomorke(dawkaId, surowiecId, wartoscStr){
  const zrodlo = zrodloDawek();
  const dawka = zrodlo[dawkaId]; if(!dawka) return;
  const v = liczba(wartoscStr);
  const biezace = [...(dawka.skladniki||[])];
  const i = biezace.findIndex(s=>s.surowiecId===surowiecId);
  const stara = i>=0 ? biezace[i].kg : 0;
  if(Math.abs(stara - v) < 0.0001) return;          // nic się nie zmieniło

  zOdKiedy(async(odData)=>{
    const przyszla = odData > dzisiaj();
    if(przyszla){
      await zapiszDoZaplanowanej(odData, (baza)=>{
        const d = baza.dawki[dawkaId]; if(!d) return;
        const sk = [...(d.skladniki||[])];
        const j = sk.findIndex(s=>s.surowiecId===surowiecId);
        if(v>0){ if(j>=0) sk[j]={...sk[j],kg:v}; else sk.push({surowiecId,kg:v}); }
        else if(j>=0) sk.splice(j,1);
        baza.dawki[dawkaId] = {...d, skladniki:sk};
      });
    }else{
      const sk = [...(store.dawki[dawkaId]?.skladniki||[])];
      const j = sk.findIndex(s=>s.surowiecId===surowiecId);
      if(v>0){ if(j>=0) sk[j]={...sk[j],kg:v}; else sk.push({surowiecId,kg:v}); }
      else if(j>=0) sk.splice(j,1);
      await DB.zapisz('dawki', dawkaId, {skladniki:sk});
      await zapiszWersje(odData);
      zapiszSnapshotDnia();
    }
    zapiszZmiane(dawkaId, surowiecId, stara, v, odData, przyszla);
  });
}

/* Rejestr zmian dawek — kto (rola), kiedy, co, z czego na co */
function zapiszZmiane(dawkaId, surowiecId, stara, nowa, odData, zaplanowana){
  const ts = Date.now();
  DB.zapisz('zmianyDawek', 'zm_'+ts+'_'+Math.random().toString(36).slice(2,6), {
    ts, data: dzisiaj(),
    odData: odData || dzisiaj(),
    zaplanowana: !!zaplanowana,
    rola: ROLE[rolaAkt]?.nazwa || '?',
    dawkaId, dawkaNazwa: store.dawki[dawkaId]?.nazwa || '?',
    surowiecId, surowiecNazwa: store.surowce[surowiecId]?.nazwa || '?',
    stara: Math.round(stara*1000)/1000,
    nowa: Math.round(nowa*1000)/1000
  });
}

/* Snapshot: jeden dokument na dobę, nadpisywany przy każdej zmianie.
   Na koniec dnia w bazie leży stan końcowy — bez zależności od tego,
   czy ktoś ma otwartą aplikację o północy. */
function zapiszSnapshotDnia(){
  const d = dzisiaj();
  // pełny stan: dawki + grupy + surowce + mieszanki — żeby dało się odtworzyć wszystko
  DB.zapiszCaly('snapshoty', 'snap_'+d, {
    typ:'dawki', data:d, ts:Date.now(),
    autor: ROLE[rolaAkt]?.nazwa || '?',
    dane: klon(store.dawki), grupy: klon(store.grupyTech),
    surowce: klon(store.surowce), mieszanki: klon(store.mieszanki)
  });
}

function zapiszUkladWierszy(wiersze){
  DB.zapisz('config','ukladDawki',{wiersze});
}

function renderDawki(w){
  // Zapamiętaj scroll, żeby przy 20 kolumnach edycja nie cofała do początku
  const staraMacierz = w.querySelector('#macierzDawek');
  const scrollL = staraMacierz ? staraMacierz.scrollLeft : 0;
  const edycja = mozeEdytowac('dawki');
  const dawki = dawkiSorted();
  const wiersze = wierszeDawek();

  if(dawki.length===0){
    w.innerHTML = `<div class="panel">
      <div class="panel-tyt">Dawki <span style="flex:1"></span>${edycja?'<button class="btn maly" id="btnNowaDawka">+ Grupa żywieniowa</button>':''}</div>
      <div class="pusto">Brak grup żywieniowych. ${edycja?'Dodaj pierwszą przyciskiem powyżej.':''}</div>
    </div>`;
    if(edycja) w.querySelector('#btnNowaDawka').onclick=()=>oknoDawka();
    return;
  }

  // --- MACIERZ (desktop) ---
  let thKols = dawki.map((d,ci)=>`
    <th>
      <span class="nazwa-kol" title="${esc(d.nazwa)}">${esc(d.nazwa)}</span>
      ${d.suchyTMR?'<span style="font-size:9px;opacity:.7;display:block">(suchy TMR)</span>':''}
      ${(()=>{const lok=d.lokalizacja||'W';return `<div class="flagi-lok" onclick="event.stopPropagation()"><span class="flaga-lok ${lok==='N'?'akt':''}" data-flaga="${d.id}" data-lok="N" title="Tylko Nadarzyn">N</span><span class="flaga-lok ${lok==='B'?'akt':''}" data-flaga="${d.id}" data-lok="B" title="Tylko Boguszyny">B</span><span class="flaga-lok wsp ${lok==='W'?'akt':''}" data-flaga="${d.id}" data-lok="W" title="Wsp\u00f3lna \u2014 obie lokalizacje">W</span><span class="flaga-lok brak ${lok==='X'?'akt':''}" data-flaga="${d.id}" data-lok="X" title="Bez przypisania \u2014 dawka nie pojawi si\u0119 w Paszowozie">\u2014</span></div>`;})()}
      ${edycja?`<div class="kol-akcje">
        <button title="Edytuj grupę żywieniową" data-edkol="${d.id}">✎</button>
      </div>`:''}
    </th>`).join('');

  let tbWiersze = wiersze.map((sid, ri)=>{
    const sur = store.surowce[sid];
    if(!sur) return '';
    const mieszanka = sur.zMieszalni || sur.kategoria==='Mieszanka własna';
    const rozw = dRozwiniete.has(sid);
    let komorki = dawki.map(d=>{
      const v = kgWDawce(d, sid);
      if(!edycja) return `<td class="num">${v?fmt(v,2):'—'}</td>`;
      return `<td><input class="komorka ${v?'':'puste'}" data-d="${d.id}" data-s="${sid}"
        value="${v?fmt(v,2):''}" placeholder="—" inputmode="decimal"></td>`;
    }).join('');

    let html = `<tr class="${rozw?'rozwiniety':''}">
      <td class="lipka">
        ${edycja?`<span class="strzalki">
          <button data-wgora="${sid}" ${ri===0?'disabled':''}>▲</button>
          <button data-wdol="${sid}" ${ri===wiersze.length-1?'disabled':''}>▼</button>
        </span>`:''}
        <span class="nazwaS" title="${esc(sur.nazwa)}">${esc(sur.nazwa)}</span>
        ${mieszanka?`<span class="mix-badge" data-rozmix="${sid}" title="Pokaż skład mieszanki">⊕</span>`:''}
        ${edycja?`<button class="ikonka usun" data-usunwiersz="${sid}" title="Usuń wiersz" style="float:right;width:22px;height:22px;font-size:12px">✕</button>`:''}
      </td>
      ${komorki}
    </tr>`;

    // Rozwinięty skład mieszanki
    if(mieszanka && rozw){
      const m = store.mieszanki[sur.mieszankaId] || Object.values(store.mieszanki).find(x=>x.nazwa===sur.nazwa);
      const cols = dawki.length+1;
      let tresc='Brak receptury.';
      if(m && (m.skladniki||[]).length){
        tresc = (m.skladniki||[]).map(sk=>{
          const s2=store.surowce[sk.surowiecId];
          return `${esc(s2?.nazwa||'?')} ${fmt(sk.procent,1)}%`;
        }).join(' · ');
      }
      html += `<tr class="wiersz-rozw"><td colspan="${cols}">↳ Skład: ${tresc}</td></tr>`;
    }
    return html;
  }).join('');

  // Wiersz sumy
  let sumyKomorki = dawki.map(d=>`<td class="num">${fmt(sumaDawki(d),2)}</td>`).join('');
  // Wiersz kosztu
  let kosztyKomorki = dawki.map(d=>`<td class="num">${fmt(kosztDawki(d),2)} zł</td>`).join('');

  const zapl = wersjeZaplanowane();
  const trybPrzyszly = wersjaOd && wersjaOd>dzisiaj();
  w.innerHTML = banerPrzywracania() + `
  <div class="panel">
    <div class="panel-tyt">
      Dawki
      <span class="licznik">${dawki.length} grup żywieniowych · ${wiersze.length} surowców</span>
      <span style="flex:1"></span>
      ${przyciskEksportu('#macierzDawek','dawki','Dawki żywieniowe — kg/szt/dobę')}
      ${edycja?`<button class="btn maly szary" id="btnDodWiersz">+ Surowiec</button>
                <button class="btn maly" id="btnNowaDawka">+ Grupa żywieniowa</button>`
              :'<span class="podpis">tryb podglądu</span>'}
    </div>
    ${edycja && wersjaPytano ? `<div class="pasek-wersja ${trybPrzyszly?'przyszla':''}">
      ${trybPrzyszly
        ? `<b>✎ Edytujesz wersję obowiązującą od ${dataPL(wersjaOd)}</b>
           <span class="podpis">Poniższe wartości to stan zaplanowany, nie obecny.</span>`
        : `<b>✎ Zmiany obowiązują od dziś (${dataPL(wersjaOd)})</b>`}
      <span style="flex:1"></span>
      <button class="btn maly szary" id="btnZmienOd">Zmień datę</button>
      ${trybPrzyszly?'<button class="btn maly szary" id="btnWrocDzis">Wróć do wersji bieżącej</button>':''}
    </div>` : ''}
    ${zapl.length ? `<div class="pasek-wersja przyszla">
      <b>⏳ Zaplanowane zmiany dawek:</b>
      ${zapl.map(v=>`<button class="btn maly szary" data-podglad="${v.odData}">od ${dataPL(v.odData)}</button>`).join('')}
      <span class="podpis">kliknij, żeby podejrzeć lub edytować</span>
    </div>` : ''}
    <div class="macierz" id="macierzDawek">
      <table>
        <colgroup>
          <col style="width:220px">
          ${dawki.map(()=>'<col style="width:120px">').join('')}
        </colgroup>
        <thead><tr><th class="lipka">Surowiec</th>${thKols}</tr></thead>
        <tbody>
          ${tbWiersze || '<tr><td colspan="'+(dawki.length+1)+'"><div class="pusto">Dodaj surowce przyciskiem „+ Surowiec".</div></td></tr>'}
          <tr class="suma-wiersz"><td class="lipka">Całość kg/szt</td>${sumyKomorki}</tr>
          <tr class="koszt-wiersz"><td class="lipka">Koszt zł/szt/dobę</td>${kosztyKomorki}</tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="podpis" style="padding:4px 4px 10px">
    Wartości w <b>kg świeżej masy / sztukę / dobę</b>. Koszty wyliczane z cen w zakładce Surowce (zł/t → zł/kg).<br>
    ${edycja?'Pod nazwą kolumny cztery flagi: <b>N</b> tylko Nadarzyn, <b>B</b> tylko Boguszyny, <b>W</b> wspólna (obie), <b>—</b> bez przypisania (dawka nie pojawi się w Paszowozie). Kliknij ✎, żeby zmienić nazwę lub usunąć grupę.':''}
  </div>`;

  // --- PODPIĘCIA ---
  if(edycja){
    // Komórki
    w.querySelectorAll('.komorka').forEach(inp=>{
      inp.onfocus = ()=>{ const v=liczba(inp.value); inp.value = v||''; inp.classList.remove('puste'); };
      inp.onblur  = ()=>{
        const v=liczba(inp.value);
        inp.value = v ? fmt(v,2) : '';
        inp.classList.toggle('puste', !v);
        zapiszKomorke(inp.dataset.d, inp.dataset.s, inp.value);
        setTimeout(()=>{ if(!document.activeElement?.closest?.('#macierzDawek')) odswiezSumy(); }, 80);
      };
      inp.onkeydown = e=>{
        if(e.key==='Enter'){ inp.blur(); return; }
        if(e.key==='Tab'){
          // nawigacja Tab w macierzy
          e.preventDefault();
          const all = [...w.querySelectorAll('.komorka')];
          const idx = all.indexOf(inp);
          const next = e.shiftKey ? all[idx-1] : all[idx+1];
          if(next){ next.focus(); next.select(); }
        }
      };
    });
    // Strzałki wierszy
    w.querySelectorAll('[data-wgora]').forEach(b=> b.onclick=()=>przesunWiersz(b.dataset.wgora,-1));
    w.querySelectorAll('[data-wdol]').forEach(b=> b.onclick=()=>przesunWiersz(b.dataset.wdol,1));
    // Usuń wiersz
    w.querySelectorAll('[data-usunwiersz]').forEach(b=> b.onclick=()=>usunWiersz(b.dataset.usunwiersz));
    // Edytuj/usuń kolumnę
    w.querySelectorAll('[data-edkol]').forEach(b=> b.onclick=()=>oknoDawka(b.dataset.edkol));
    w.querySelectorAll('[data-flaga]').forEach(el=>{
      el.onclick=(e)=>{
        e.stopPropagation();
        const dId=el.dataset.flaga, lok=el.dataset.lok;
        // Klikni\u0119cie w aktualn\u0105 flag\u0119 = odzwolnienie (wraca na "W")
        const stara=store.dawki[dId]?.lokalizacja||'W';
        const nowa=(stara===lok?'W':lok);
        zOdKiedy(async(odData)=>{
          const przyszla=odData>dzisiaj();
          if(przyszla){
            await zapiszDoZaplanowanej(odData,(baza)=>{
              if(baza.dawki[dId]) baza.dawki[dId]={...baza.dawki[dId], lokalizacja:nowa};
            });
          }else{
            await DB.zapisz('dawki',dId,{lokalizacja:nowa});
            await zapiszWersje(odData);
          }
          toast('Przypisanie: '+({N:'Nadarzyn',B:'Boguszyny',W:'Wsp\u00f3lna',X:'brak (dawka pomini\u0119ta w Paszowozie)'}[nowa]));
        });
      };
    });
    // + Surowiec
    const btnDW = w.querySelector('#btnDodWiersz');
    if(btnDW) btnDW.onclick = oknoDodajWiersz;
    // + Grupa
    const btnND = w.querySelector('#btnNowaDawka');
    if(btnND) btnND.onclick = ()=>oknoDawka();
    // Pasek wersji
    const bz = w.querySelector('#btnZmienOd');
    if(bz) bz.onclick = ()=>pytajOdKiedy(d=>{ if(d){ wersjaOd=d; wersjaPytano=true; render(); } });
    const bw = w.querySelector('#btnWrocDzis');
    if(bw) bw.onclick = ()=>{ wersjaOd=dzisiaj(); render(); };
  }
  w.querySelectorAll('[data-podglad]').forEach(b=>{
    b.onclick=()=>{ wersjaOd=b.dataset.podglad; wersjaPytano=true; render(); };
  });
  // Przywróć pozycję scrolla
  const nowaMacierz = w.querySelector('#macierzDawek');
  if(nowaMacierz && scrollL) nowaMacierz.scrollLeft = scrollL;
  // Rozwiń skład mieszanki
  w.querySelectorAll('[data-rozmix]').forEach(b=>{
    b.onclick=()=>{ const id=b.dataset.rozmix; dRozwiniete.has(id)?dRozwiniete.delete(id):dRozwiniete.add(id); renderDawki(w); };
  });
}

function odswiezSumy(){
  // Lekki re-render sum i kosztów bez przebudowy całej macierzy
  const dawki = dawkiSorted();
  const sumTds = document.querySelectorAll('.suma-wiersz td:not(.lipka)');
  const kosTds = document.querySelectorAll('.koszt-wiersz td:not(.lipka)');
  dawki.forEach((d,i)=>{
    if(sumTds[i]) sumTds[i].textContent = fmt(sumaDawki(d),2);
    if(kosTds[i]) kosTds[i].textContent = fmt(kosztDawki(d),2)+' zł';
  });
}

function przesunWiersz(sid, kier){
  const w = wierszeDawek();
  const i = w.indexOf(sid);
  const j = i+kier;
  if(i<0 || j<0 || j>=w.length) return;
  [w[i], w[j]] = [w[j], w[i]];
  zapiszUkladWierszy(w);
}

function usunWiersz(sid){
  const sur = store.surowce[sid];
  potwierdz('Usunąć wiersz?', `Surowiec „${esc(sur?.nazwa||'?')}" zostanie usunięty ze wszystkich dawek.\nSam surowiec pozostanie w zakładce Surowce.`,
    async ()=>{
      // Usuń z wszystkich dawek
      for(const d of Object.values(store.dawki)){
        const sk = (d.skladniki||[]).filter(s=>s.surowiecId!==sid);
        if(sk.length !== (d.skladniki||[]).length) await DB.zapisz('dawki', d.id, {skladniki:sk});
      }
      // Usuń z układu
      const w = wierszeDawek().filter(id=>id!==sid);
      zapiszUkladWierszy(w);
      toast('Usunięto wiersz z macierzy.');
    }, 'Usuń');
}

function oknoDodajWiersz(){
  const juzW = new Set(wierszeDawek());
  const dostepne = Object.values(store.surowce).filter(s=>!juzW.has(s.id)).sort((a,b)=>(a.nazwa||'').localeCompare(b.nazwa||'','pl'));
  if(!dostepne.length){ toast('Wszystkie surowce są już w macierzy.'); return; }
  modal({
    tytul:'Dodaj surowiec do macierzy',
    tresc:`
      <div class="pole-grupa">
        <label>Surowiec</label>
        <select id="dwSur" size="${Math.min(dostepne.length,12)}" style="width:100%;padding:6px">
          ${dostepne.map(s=>`<option value="${s.id}">${esc(s.nazwa)} (${esc(s.kategoria||'')})</option>`).join('')}
        </select>
      </div>
      <div class="podpis">Surowiec pojawi się jako nowy wiersz we wszystkich kolumnach z wartością 0.</div>`,
    przyciski:[
      {tekst:'Anuluj'},
      {tekst:'Dodaj', klasa:'', akcja:(n)=>{
        const sel = n.querySelector('#dwSur');
        const ids = [...sel.selectedOptions].map(o=>o.value);
        if(!ids.length){ toast('Wybierz surowiec.', true); return false; }
        const w = wierszeDawek();
        ids.forEach(id=>{ if(!w.includes(id)) w.push(id); });
        zapiszUkladWierszy(w);
        toast(`Dodano ${ids.length} surowiec(ów) do macierzy.`);
      }}
    ]
  });
  // Wielokrotny wybór
  const sel = document.getElementById('dwSur');
  sel.multiple = true;
}

function oknoDawka(edId){
  const isEdit = !!edId;
  const d = isEdit ? store.dawki[edId] : null;
  const ileSk = isEdit ? (d.skladniki||[]).filter(s=>s.kg>0).length : 0;
  modal({
    tytul: isEdit ? 'Edytuj grupę żywieniową' : 'Nowa grupa żywieniowa',
    tresc:`
      <div class="pole-grupa">
        <label>Nazwa</label>
        <input id="dnNazwa" value="${esc(d?.nazwa||'')}" placeholder="np. Krowy laktacja" autocomplete="off">
      </div>
      ${isEdit?`<div class="podpis">Zawiera ${ileSk} surowców z wartościami.${d?.suchyTMR?' Oznaczona jako suchy TMR.':''}</div>
      <hr style="border:none;border-top:1px solid var(--linia);margin:14px 0">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn szary maly" id="dnEksport">\u2913 Eksport / druk tej dawki</button>
        <button class="btn czerw maly" id="dnUsun">\u2715 Usu\u0144 t\u0119 grup\u0119 \u017cywieniow\u0105</button>
      </div>
      <div class="podpis" style="margin-top:5px">Usunięcie kasuje całą kolumnę razem z wpisanymi wartościami.</div>`:''}`,
    przyciski:[
      {tekst:'Anuluj'},
      {tekst: isEdit?'Zapisz':'Dodaj', klasa:'', akcja:(n)=>{
        const nazwa = n.querySelector('#dnNazwa').value.trim();
        if(!nazwa){ toast('Podaj nazwę grupy.', true); return false; }
        if(!isEdit){
          const dubel = Object.values(store.dawki).find(x=>(x.nazwa||'').toLowerCase()===nazwa.toLowerCase());
          if(dubel){ toast('Grupa o tej nazwie już istnieje.', true); return false; }
        }
        if(isEdit){
          DB.zapisz('dawki', edId, {nazwa});     // flaga suchyTMR zostaje nietknięta
          toast('Zapisano.');
        }else{
          const maxK = Object.values(store.dawki).reduce((m,x)=>Math.max(m, x.kolejnosc??0), 0);
          DB.zapisz('dawki', null, {nazwa, suchyTMR:false, skladniki:[], kolejnosc:maxK+1});
          toast('Dodano grupę żywieniową.');
        }
      }}
    ]
  });
  const bu = document.getElementById('dnUsun');
  if(bu) bu.onclick = ()=>{ zamknijModal(); usunDawke(edId); };
  const be = document.getElementById('dnEksport');
  if(be) be.onclick = ()=>{
    const daw = store.dawki[edId]; if(!daw) return;
    const skl = (daw.skladniki||[]).filter(s=>s.kg>0).sort((a,b)=>b.kg-a.kg);
    const suma = skl.reduce((s,x)=>s+x.kg,0);
    const koszt = skl.reduce((s,x)=>{const sur=store.surowce[x.surowiecId]; return s+x.kg*((sur?.cenaTona||0)/1000);},0);
    const tmp = document.createElement('div');
    tmp.innerHTML = `<table><thead><tr><th>Surowiec</th><th>kg/szt/dob\u0119</th><th>Udzia\u0142 %</th><th>Koszt z\u0142/szt</th></tr></thead>
      <tbody>${skl.map(x=>{
        const sur=store.surowce[x.surowiecId];
        const kz=x.kg*((sur?.cenaTona||0)/1000);
        return `<tr><td>${esc(sur?.nazwa||'?')}</td><td>${fmt(x.kg,2)}</td><td>${fmt(suma>0?x.kg/suma*100:0,1)}%</td><td>${fmt(kz,4)}</td></tr>`;
      }).join('')}
      <tr style="font-weight:700"><td>RAZEM</td><td>${fmt(suma,2)}</td><td>100%</td><td>${fmt(koszt,2)}</td></tr>
      </tbody></table>`;
    document.body.appendChild(tmp);
    eksportDruk(tmp, 'Dawka: '+daw.nazwa);
    tmp.remove();
  };
  document.getElementById('dnNazwa').focus();
}

function usunDawke(id){
  const d = store.dawki[id]; if(!d) return;
  const ileSk = (d.skladniki||[]).filter(s=>s.kg>0).length;
  potwierdz('Usunąć grupę żywieniową?',
    `„${esc(d.nazwa)}"\n${ileSk?`Zawiera ${ileSk} surowców z wartościami — zostaną utracone.`:'Grupa jest pusta.'}`,
    ()=>{ DB.usun('dawki', id); toast('Usunięto grupę.'); }, 'Usuń');
}

/* ===================== UNIWERSALNY EKSPORT ===============================
   Jeden mechanizm dla wszystkich tabel. Czyta zawartość bezpośrednio z DOM,
   więc eksportuje dokładnie to, co użytkownik widzi — z filtrami, wpisanymi
   wartościami i aktualnym stanem rozwinięć.
   ========================================================================= */
function czytajTabele(tab){
  const wiersze=[];
  tab.querySelectorAll('tr').forEach(tr=>{
    const kom=[];
    tr.querySelectorAll('th,td').forEach(c=>{
      const inp=c.querySelector('input,select');
      let v;
      if(inp){
        v = inp.tagName==='SELECT' ? (inp.selectedOptions[0]?.textContent||'') : (inp.value||inp.placeholder||'');
      }else{
        v = (c.innerText ?? c.textContent ?? '').replace(/\s*\n\s*/g,' ').trim();
      }
      const span = parseInt(c.getAttribute('colspan')||'1');
      kom.push(v==='—'?'':v);
      for(let i=1;i<span;i++) kom.push('');
    });
    if(kom.some(x=>x!=='')) wiersze.push(kom);
  });
  return wiersze;
}

function eksportCSV(tab, nazwa){
  const w = czytajTabele(tab);
  if(!w.length){ toast('Nie ma czego eksportować.', true); return; }
  csvPobierz(nazwa, w);
}

/* Kopia elementu gotowa do druku: bez przycisków, pola formularzy zamienione na tekst,
   bez ukrycia i bez stałych szerokości kolumn z ekranu. Zwraca HTML. */
function htmlDoDruku(el){
  const kl = el.cloneNode(true);
  const oryg = el.querySelectorAll('input,select,textarea');
  kl.querySelectorAll('input,select,textarea').forEach((k,i)=>{
    const o = oryg[i]; let v = '';
    if(o){
      if(o.tagName==='SELECT') v = o.selectedOptions?.[0]?.textContent || '';
      else if(o.type==='checkbox' || o.type==='radio') v = o.checked ? '✓' : '';
      else v = o.value || o.placeholder || '';
    }
    if(/^—/.test(v.trim()) && v.trim().length>1) v = '';     // „— sektor —” itp.
    const s = document.createElement('span'); s.textContent = v; k.replaceWith(s);
  });
  kl.querySelectorAll('button,.btn-eksport,.noprint,script,colgroup').forEach(x=>x.remove());
  [kl, ...kl.querySelectorAll('[hidden],[style*="display:none"],[style*="display: none"]')].forEach(x=>{
    x.removeAttribute('hidden');

/* ===================== ANALIZA DNIA — JEDNO ŹRÓDŁO PRAWDY ==================
   Wszystkie zakładki (Nadarzyn/Boguszyny, Paszowóz, Raporty) liczą stan grupy
   tą samą funkcją, więc liczby nigdzie się nie rozjadą. Pojęcia:
   • Dawka wyliczona (plan) — kg/szt wg receptury grupy z zakładki Dawki,
   • Zadane — ile kg TMR trafiło na stół (świeży TMR + odzysk niedojadów),
   • Odzysk — część zadanego pochodząca z niedojadów innych grup
     (nie zużywa świeżych surowców i nie kosztuje drugi raz),
   • Niedojady — resztki zebrane NASTĘPNEGO dnia rano; obniżają pobranie TEGO dnia,
   • Pobranie realne = Zadane − Niedojady (to faktycznie zjadły zwierzęta).
   ========================================================================= */
function klon(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }
function zaokr(x, d=3){ const p=Math.pow(10,d); return Math.round((Number(x)||0)*p)/p; }
function nazwaLokalizacji(lok){ return lok==='nadarzyn' ? 'Nadarzyn' : 'Boguszyny'; }
function kolorProc(p){
  if(p==null || isNaN(p)) return 'var(--tekst-slaby)';
  const a = Math.abs(p-100);
  return a<=3 ? 'var(--zielony-ok)' : (a<=10 ? 'var(--zolty)' : 'var(--czerwony)');
}
function procTxt(p){ return (p==null || isNaN(p)) ? '—' : fmt(p,0)+'%'; }
function procKomorka(p){ return `<td class="num" style="color:${kolorProc(p)};font-weight:700">${procTxt(p)}</td>`; }

/* Operacje na mapach składu {surowiecId: kg} */
function sklDoMapy(lista, docelowoKg){
  const wynik = {};
  const baza = (lista||[]).reduce((s,x)=>s+(x.kg||0),0);
  if(baza<=0 || !(docelowoKg>0)) return wynik;
  (lista||[]).forEach(x=>{ if(x.kg>0) wynik[x.surowiecId]=(wynik[x.surowiecId]||0)+x.kg/baza*docelowoKg; });
  return wynik;
}
function mapaSkaluj(m, wsp){ const w={}; for(const k in m) w[k]=m[k]*wsp; return w; }
function mapaDodaj(a, b, wsp=1){ for(const k in b) a[k]=(a[k]||0)+b[k]*wsp; return a; }
function mapaSuma(m){ let s=0; for(const k in m) s+=m[k]; return s; }
function mapaNaListe(m, dzielnik){
  return Object.entries(m).filter(([,kg])=>kg>0.00001)
    .map(([surowiecId,kg])=>({surowiecId, kg:zaokr(kg/(dzielnik||1),4)}));
}
function kosztMapy(m){
  let s=0;
  for(const k in m){ const sur=store.surowce[k]; s+=m[k]*((sur?.cenaTona||0)/1000); }
  return s;
}

/* Skład 1 kg niedojadu zebranego rano dnia `data` z grupy `srcId`.
   To resztka tego, co grupa dostała DZIEŃ WCZEŚNIEJ — więc bierzemy faktycznie
   zadany wtedy skład (np. mieszankę z dwóch wozów), a gdy go brak — recepturę grupy. */
function frakcjeNiedojadu(lok, data, srcId){
  const z = dokDnia(lok, dataMinus(data,1))?.grupy?.[srcId];
  let lista = z?.skladniki;
  if(!lista || !lista.length){
    const gr = store.grupyTech[srcId];
    lista = gr ? obliczGrupe(gr).skladniki : [];
  }
  return sklDoMapy(lista, 1);
}

/* Czy znamy już niedojady za dany dzień? Zbiera się je następnego dnia rano w Paszowozie.
   "Brak niedojadów" też jest informacją — dlatego liczy się potwierdzenie w dokumencie. */
function czyNiedojadyZnane(lok, data, z){
  if(z && z.niedojadyKg!=null) return true;
  const nast = pzDok(lok, dataPlus(data,1));
  return !!(nast && (nast.niedojadyPotw || (nast.niedojady||[]).length));
}

/* Stan jednej grupy technologicznej w danym dniu */
function stanGrupy(lok, data, gr, z){
  z = z || {};
  const o = gr ? obliczGrupe(gr) : {skladniki:[], kgSzt:0, kosztSzt:0, sumaUdzialow:0};
  const sztuk = z.sztuk!=null ? z.sztuk : (gr?.sztuk||0);
  const wylicz = z.dawkaWyliczonaKgSzt!=null ? z.dawkaWyliczonaKgSzt : o.kgSzt;
  const planKg = wylicz*sztuk;
  const potw = z.zadaneKg!=null;
  const zPaszowozu = !!z.zPaszowozu;
  const zadaneKg = potw ? z.zadaneKg : planKg;
  const odzysk = Math.min(zadaneKg, z.niedojadyDodaneKg||0);
  const swiezy = Math.max(0, zadaneKg-odzysk);

  // Skład — całość na stole i część świeża (tylko ta zużywa surowce i kosztuje)
  const baza = (z.skladniki && z.skladniki.length) ? z.skladniki : o.skladniki;
  let sklTotal, sklSwieze;
  if(zPaszowozu && z.skladnikiSwieze){
    sklTotal  = sklDoMapy(baza, zadaneKg);
    sklSwieze = sklDoMapy(z.skladnikiSwieze, swiezy);
  }else if(odzysk>0 && (z.niedojadyZrodla||[]).length){
    // starsze wpisy (rozdzielnik w zakładce lokalizacji): świeże wg receptury + odzysk wg składu źródeł
    sklSwieze = sklDoMapy(baza, swiezy);
    sklTotal  = {...sklSwieze};
    const sumZr = z.niedojadyZrodla.reduce((s,x)=>s+(x.kg||0),0) || 1;
    z.niedojadyZrodla.forEach(zr=> mapaDodaj(sklTotal, frakcjeNiedojadu(lok,data,zr.grupaId), odzysk*(zr.kg||0)/sumZr));
  }else{
    sklTotal  = sklDoMapy(baza, zadaneKg);
    sklSwieze = mapaSkaluj(sklTotal, zadaneKg>0 ? swiezy/zadaneKg : 0);
  }
  const koszt = z.kosztKgTMR!=null ? swiezy*z.kosztKgTMR : kosztMapy(sklSwieze);

  const perSzt = sztuk>0 ? zadaneKg/sztuk : 0;
  const procZad = wylicz>0 && sztuk>0 ? perSzt/wylicz*100 : null;

  // Niedojady i realne pobranie
  const znane = czyNiedojadyZnane(lok, data, z);
  const niedojadyKg = znane ? (z.niedojadyKg||0) : null;
  const pobraneKg = znane ? Math.max(0, zadaneKg-niedojadyKg) : null;
  const pobranieSzt = (pobraneKg!=null && sztuk>0) ? pobraneKg/sztuk : null;
  const procPobr = (pobranieSzt!=null && wylicz>0) ? pobranieSzt/wylicz*100 : null;
  const procNied = (niedojadyKg!=null && zadaneKg>0) ? niedojadyKg/zadaneKg*100 : null;
  // Skład niedojadu przyjmujemy taki jak skład zadany (bez współczynnika sortowania)
  const sklPobrane = pobraneKg!=null ? mapaSkaluj(sklTotal, zadaneKg>0 ? pobraneKg/zadaneKg : 0) : null;

  // Opis dawek: przy Paszowozie faktyczne proporcje, inaczej przypisanie z Dawek
  let opis;
  if(zPaszowozu && (z.udzialyFakt||[]).length){
    const suma = z.udzialyFakt.reduce((s,x)=>s+(x.kg||0),0) + odzysk;
    opis = z.udzialyFakt.map(x=>`${store.dawki[x.dawkaId]?.nazwa||x.nazwa||'?'} ${fmt(suma>0?x.kg/suma*100:0,0)}%`).join(' + ')
         + (odzysk>0 ? ` + ♻ niedojady ${fmt(suma>0?odzysk/suma*100:0,0)}%` : '');
  }else if(zPaszowozu && (z.wklady||[]).length){
    const suma = z.wklady.reduce((s,w)=>s+(w.kg||0),0);
    opis = z.wklady.map(w=>`${w.dawkaNazwa} ${fmt(suma>0?w.kg/suma*100:0,0)}%`).join(' + ');
  }else{
    opis = ((gr?.dawki)||z.udzialy||[]).map(x=>`${store.dawki[x.dawkaId]?.nazwa||'?'} ${x.udzial}%`).join(' + ');
  }

  return {gid: gr?.id || z.id, gr, z, nazwa: gr?.nazwa || z.nazwaGrupy || '?',
    kolejnosc: gr?.kolejnosc ?? 99, parentId: gr?.parentId || null,
    sztuk, wylicz, planKg, potw, zPaszowozu, zadaneKg, odzysk, swiezy, perSzt, procZad,
    sklTotal, sklSwieze, sklPobrane, planSkl:o.skladniki, sumaUdzialow:o.sumaUdzialow,
    koszt, kosztSzt: sztuk>0 ? koszt/sztuk : 0,
    niedojadyZnane:znane, niedojadyKg, procNied, pobraneKg, pobranieSzt, procPobr,
    opis, wklady:z.wklady||[], niedojadyZrodla:z.niedojadyZrodla||[]};
}

/* Wszystkie grupy dnia. wszystkie=true → każda grupa lokalizacji (brak wpisu = plan);
   false → tylko grupy zapisane w dokumencie dnia (raporty historyczne). */
function analizaDnia(lok, data, wszystkie){
  const grupyDnia = dokDnia(lok,data)?.grupy || {};
  let lista;
  if(wszystkie){
    lista = grupyLok(lok).map(gr=>stanGrupy(lok, data, gr, grupyDnia[gr.id]));
    Object.entries(grupyDnia).forEach(([gid,z])=>{
      if(!store.grupyTech[gid] && z.zadaneKg!=null) lista.push(stanGrupy(lok, data, null, {...z, id:gid}));
    });
  }else{
    lista = Object.entries(grupyDnia).map(([gid,z])=>stanGrupy(lok, data, store.grupyTech[gid]||null, {...z, id:gid}))
      .filter(p=>p.sztuk>0 || p.zadaneKg>0);
  }
  return lista.sort((a,b)=>a.kolejnosc-b.kolejnosc);
}

function sumyDnia(poz){
  const s = {szt:0, plan:0, zad:0, odzysk:0, swiezy:0, nied:0, pobr:0, koszt:0, ileZnane:0, ilePotw:0};
  poz.forEach(p=>{
    s.szt+=p.sztuk; s.plan+=p.planKg; s.zad+=p.zadaneKg; s.odzysk+=p.odzysk; s.swiezy+=p.swiezy; s.koszt+=p.koszt;
    if(p.potw) s.ilePotw++;
    if(p.niedojadyKg!=null){ s.nied+=p.niedojadyKg; s.pobr+=p.pobraneKg; s.ileZnane++; }
  });
  return s;
}

/* Macierz: wiersze = surowce, kolumny = grupy, wartość = kg/szt/dobę.
   tryb 'zadany' — co trafiło na stół; 'pobrany' — co realnie zjadły zwierzęta. */
function macierzSkladu(pozycje, opcje){
  opcje = opcje || {};
  const pobr = opcje.tryb==='pobrany';
  const kolumny = pozycje.filter(p=>p.sztuk>0 && (pobr ? p.sklPobrane : p.zadaneKg>0));
  if(!kolumny.length) return `<div class="pusto">${pobr
    ? 'Brak danych o pobraniu — niedojady za ten dzień nie zostały jeszcze wpisane w Paszowozie.'
    : 'Brak grup z obsadą.'}</div>`;
  const skl = p => pobr ? p.sklPobrane : p.sklTotal;
  const uzyte = new Set();
  kolumny.forEach(p=>Object.entries(skl(p)).forEach(([s,kg])=>{ if(kg>0.0001) uzyte.add(s); }));
  const uklad = wierszeDawek();
  const wiersze = [...uklad.filter(id=>uzyte.has(id)), ...[...uzyte].filter(id=>!uklad.includes(id))];

  const naglowki = kolumny.map(p=>{
    const proc = pobr ? p.procPobr : p.procZad;
    const kg = pobr ? p.pobraneKg : p.zadaneKg;
    return `<th><span class="nazwa-kol" title="${esc(p.nazwa)}">${esc(p.nazwa)}</span>
      <span class="mac-pod">${p.sztuk} szt · ${fmt(kg/(p.sztuk||1),1)} kg/szt</span>

  const body = wiersze.map(sid=>{

        const rozne = !pobr && (plan>0 ? Math.abs(kgSzt-plan)/plan > 0.02 : true);   // w pobranym różnica od planu to po prostu niedojady
        return `<td class="num" ${rozne?'style="color:var(--czerwony);font-weight:600"':''}
          title="${fmt(kgTot,1)} kg na grupę${plan?' · plan '+fmt(plan,2)+' kg/szt':' · poza recepturą grupy'}">${fmt(kgSzt,2)}</td>`;
      }).join('')}</tr>`;
  }).join('');

  const sumaKol = p => mapaSuma(skl(p));
  return `<div class="macierz" style="max-height:none" ${opcje.id?`id="${opcje.id}"`:''}>
    <table>
      <colgroup><col style="width:220px">${kolumny.map(()=>'<col style="width:120px">').join('')}</colgroup>
      <thead><tr><th class="lipka">Surowiec</th>${naglowki}</tr></thead>
      <tbody>
        ${body}
        <tr class="suma-wiersz"><td class="lipka">Razem kg/szt/dobę</td>${kolumny.map(p=>`<td class="num">${fmt(sumaKol(p)/(p.sztuk||1),2)}</td>`).join('')}</tr>

      </tbody>

  <div class="podpis" style="padding:8px 14px">
    ${pobr
      ? 'Skład <b>realnie pobrany</b> = skład zadany pomniejszony o niedojady (przyjmujemy, że resztka ma skład dawki). Wiersz „Plan kg/szt” — do porównania.'
      : 'Skład <b>faktycznie zadany</b> — po zmianach ilości, mieszaniu receptur w wozach i domieszaniu niedojadów. Na <b style="color:var(--czerwony)">czerwono</b> pozycje odbiegające od planu grupy o więcej niż 2% lub spoza jej receptury.'}
  </div>`;
}
