/* ===================== REALNY SKŁAD DAWKI =================================
   Kilogram niedojadu ma skład dawki, z której pochodzi. Jeśli dokładamy paszę
   z grupy o innej recepturze, proporcje na stole się przesuwają — i to musi
   być widać. Liczymy udziałem masowym, nie kg/szt, bo dokładana masa nie ma
   nic wspólnego z liczbą sztuk grupy docelowej.
   ========================================================================= */
function skladRealnyGrupy(p, dokWczoraj){
  const wynik = {};
  // 1) część świeża — receptura własnej grupy przeskalowana do faktycznej masy
  const wsp = p.planKg>0 ? p.swiezy/p.planKg : 0;
  (p.skladniki||[]).forEach(sk=>{
    wynik[sk.surowiecId] = (wynik[sk.surowiecId]||0) + sk.kg*(p.sztuk||0)*wsp;
  });
  // 2) odzysk — każde źródło wnosi SWÓJ skład, wg udziału masowego
  (p.niedojadyZrodla||[]).forEach(zr=>{
    const zy = dokWczoraj?.grupy?.[zr.grupaId];
    let sklZr = zy?.skladniki;
    if(!sklZr || !sklZr.length){
      const grZr = store.grupyTech[zr.grupaId];
      sklZr = grZr ? obliczGrupe(grZr).skladniki : [];
    }
    const sumaZr = (sklZr||[]).reduce((s,x)=>s+x.kg,0);
    if(sumaZr<=0) return;
    sklZr.forEach(x=>{
      wynik[x.surowiecId] = (wynik[x.surowiecId]||0) + zr.kg*(x.kg/sumaZr);
    });
  });
  return wynik;
}

/* Pozycje dnia odczytane z zamrożonego dokumentu — na potrzeby raportów */
function pozycjeDnia(lok, data){
  const dok = dokDnia(lok,data);
  if(!dok) return [];
  return Object.entries(dok.grupy||{}).map(([gid,z])=>{
    const gr = store.grupyTech[gid];
    const sztuk = z.sztuk||0;
    const wylicz = z.dawkaWyliczonaKgSzt||0;
    const planKg = wylicz*sztuk;
    const potw = z.zadaneKg!=null;
    const zadaneKg = potw ? z.zadaneKg : planKg;
    const odzysk = z.niedojadyDodaneKg||0;
    const swiezy = Math.max(0, zadaneKg-odzysk);
    const perSzt = sztuk>0 ? zadaneKg/sztuk : 0;
    const proc = wylicz>0 ? (perSzt/wylicz)*100 : 0;
    const pobr = sztuk>0 ? (zadaneKg-(z.niedojadyKg||0))/sztuk : 0;
    return {gid, nazwa: gr?.nazwa||z.nazwaGrupy||'?', z, sztuk, wylicz, planKg,
            zadaneKg, odzysk, swiezy, perSzt, proc, pobr, potw,
            skladniki: z.skladniki||[], niedojadyZrodla: z.niedojadyZrodla||[],
            koszt: swiezy*(z.kosztKgTMR||0), kolejnosc: gr?.kolejnosc??99};
  }).filter(p=>p.sztuk>0 || p.zadaneKg>0).sort((a,b)=>a.kolejnosc-b.kolejnosc);
}

/* Macierz: wiersze = surowce, kolumny = grupy technologiczne, wartość = kg/szt/dobę */
function macierzSurowcowa(pozycje, dokWczoraj, opcje){
  opcje = opcje||{};
  const kolumny = pozycje.filter(p=>p.sztuk>0);
  if(!kolumny.length) return '<div class="pusto">Brak grup z obsadą.</div>';

  const sklady = {};                       // gid -> {surowiecId: kg total}
  const uzyte = new Set();
  kolumny.forEach(p=>{
    sklady[p.gid] = skladRealnyGrupy(p, dokWczoraj);
    Object.keys(sklady[p.gid]).forEach(s=>{ if(sklady[p.gid][s]>0.0001) uzyte.add(s); });
  });

  // Kolejność wierszy jak w macierzy Dawek, reszta na końcu
  const uklad = wierszeDawek();
  const wiersze = [...uklad.filter(id=>uzyte.has(id)), ...[...uzyte].filter(id=>!uklad.includes(id))];

  const naglowki = kolumny.map(p=>{
    const odch = p.wylicz>0 ? ((p.perSzt/p.wylicz)*100) : 100;
    const kol = Math.abs(odch-100)<=3 ? '' : (Math.abs(odch-100)<=10 ? 'color:#ffe08a' : 'color:#ffb3ad');
    return `<th><span class="nazwa-kol" title="${esc(p.nazwa)}">${esc(p.nazwa)}</span>
      <span style="font-size:9.5px;opacity:.85;display:block;font-weight:400">${p.sztuk} szt${p.odzysk?' · +'+fmt(p.odzysk,0)+' kg':''}</span>
      <span style="font-size:9.5px;display:block;${kol}">${fmt(odch,0)}%</span></th>`;
  }).join('');

  const body = wiersze.map(sid=>{
    const sur = store.surowce[sid];
    return `<tr>
      <td class="lipka"><span class="nazwaS" title="${esc(sur?.nazwa||'?')}">${esc(sur?.nazwa||'?')}</span></td>
      ${kolumny.map(p=>{
        const kgTot = sklady[p.gid][sid]||0;
        if(kgTot<=0.0001) return '<td class="num">—</td>';
        const kgSzt = kgTot/(p.sztuk||1);
        // odchylenie od receptury — pokazujemy na czerwono realne przesunięcie składu
        const wzor = (p.skladniki||[]).find(x=>x.surowiecId===sid);
        const plan = wzor ? wzor.kg : 0;
        const rozne = plan>0 ? Math.abs(kgSzt-plan)/plan > 0.02 : kgSzt>0;
        return `<td class="num" ${rozne?'style="color:var(--czerwony);font-weight:600"':''}
                    title="${fmt(kgTot,1)} kg na grupę${plan?' · wg receptury '+fmt(plan,2)+' kg/szt':''}">${fmt(kgSzt,2)}</td>`;
      }).join('')}
    </tr>`;
  }).join('');

  const sumy = kolumny.map(p=>{
    const s = Object.values(sklady[p.gid]).reduce((a,b)=>a+b,0);
    return `<td class="num">${fmt(s/(p.sztuk||1),2)}</td>`;
  }).join('');
  const sumyGrupa = kolumny.map(p=>{
    const s = Object.values(sklady[p.gid]).reduce((a,b)=>a+b,0);
    return `<td class="num">${fmt(s,0)}</td>`;
  }).join('');

  return `<div class="macierz" style="max-height:none" ${opcje.id?`id="${opcje.id}"`:''}>
    <table>
      <thead><tr><th class="lipka">Surowiec</th>${naglowki}</tr></thead>
      <tbody>
        ${body}
        <tr class="suma-wiersz"><td class="lipka">Razem kg/szt/dobę</td>${sumy}</tr>
        <tr class="koszt-wiersz"><td class="lipka">Razem kg na grupę</td>${sumyGrupa}</tr>
      </tbody>
    </table>
  </div>
  <div class="podpis" style="padding:8px 14px">
    Wartości to <b>faktycznie podane kg/szt/dobę</b> po uwzględnieniu zmienionych ilości i domieszanych niedojadów.
    Na <b style="color:var(--czerwony)">czerwono</b> pozycje odbiegające od receptury o więcej niż 2%.
    Najedź na komórkę, żeby zobaczyć kg na całą grupę.
  </div>`;
}

/* ===================== ZAKŁADKI: NADARZYN / BOGUSZYN ====================== */
let gtRozwiniete = new Set();

function grupyLok(lok){
  return Object.values(store.grupyTech).filter(g=>g.lokalizacja===lok)
    .sort((a,b)=>(a.kolejnosc??99)-(b.kolejnosc??99));
}

function obliczGrupe(gr){
  const surMap = {};
  for(const pd of (gr.dawki||[])){
    const daw = store.dawki[pd.dawkaId]; if(!daw) continue;
    const u = (pd.udzial||0)/100;
    for(const sk of (daw.skladniki||[])){
      surMap[sk.surowiecId] = (surMap[sk.surowiecId]||0) + u * sk.kg;
    }
  }
  const skladniki = Object.entries(surMap).map(([id,kg])=>({surowiecId:id,kg:Math.round(kg*10000)/10000})).filter(s=>s.kg>0.0001);
  skladniki.sort((a,b)=>b.kg-a.kg);
  const kgSzt = skladniki.reduce((s,x)=>s+x.kg,0);
  const kgGrupa = (gr.sztuk||0)*kgSzt;
  const koszt = skladniki.reduce((s,x)=>{
    const sur=store.surowce[x.surowiecId]; return s + x.kg*((sur?.cenaTona||0)/1000);
  },0);
  const sumaUdzialow = (gr.dawki||[]).reduce((s,d)=>s+(d.udzial||0),0);
  return {skladniki, kgSzt, kgGrupa, kosztSzt:koszt, kosztGrupa:koszt*(gr.sztuk||0), sumaUdzialow};
}

let lokData = {};   // wybrana data per lokalizacja

function renderLokalizacja(w, lok){
  const edycja = mozeEdytowac(lok);
  const mozeWpis = edycja || poziom(lok)==='wpis';
  const grupy = grupyLok(lok);
  const nazwaLok = lok==='nadarzyn'?'Nadarzyn':'Boguszyn';
  if(!lokData[lok]) lokData[lok] = dzisiaj();
  const data = lokData[lok];
  const wczoraj = dataMinus(data,1);
  const dok = dokDnia(lok,data);
  const dokWczoraj = dokDnia(lok,wczoraj);

  let sumaSzt=0, sumaPlan=0, sumaZadane=0, sumaKoszt=0, ileAuto=0, ilePotw=0;
  const zapotrzebowanie = {};

  const dane = grupy.map(gr=>{
    const o = obliczGrupe(gr);
    const z = dok?.grupy?.[gr.id] || {};
    const sztuk = z.sztuk!=null ? z.sztuk : (gr.sztuk||0);
    const wylicz = z.dawkaWyliczonaKgSzt!=null ? z.dawkaWyliczonaKgSzt : o.kgSzt;
    const planKg = wylicz*sztuk;
    const potw = z.zadaneKg!=null;                 // wpisane ręcznie = potwierdzone
    const zadaneKg = potw ? z.zadaneKg : planKg;   // brak wpisu = zakładamy plan
    const niedojadyDod = z.niedojadyDodaneKg || 0;  // kg niedojadów z wczoraj domieszanych do dzisiejszej dawki
    const niedojadyZrodla = z.niedojadyZrodla || [];
    const swiezyTmr = Math.max(0, zadaneKg - niedojadyDod);  // to faktycznie trzeba wymieszać ze świeżych surowców
    const perSzt = sztuk>0 ? zadaneKg/sztuk : 0;    // zwierzę zjada całość — świeże + domieszane niedojady
    const proc = wylicz>0 ? (perSzt/wylicz)*100 : 0;
    const wsp = planKg>0 ? swiezyTmr/planKg : 1;    // surowce i koszt liczymy tylko od świeżej porcji
    sumaSzt+=sztuk; sumaPlan+=planKg; sumaZadane+=zadaneKg;
    sumaKoszt+=o.kosztSzt*sztuk*wsp;
    potw?ilePotw++:ileAuto++;
    o.skladniki.forEach(sk=>{ zapotrzebowanie[sk.surowiecId]=(zapotrzebowanie[sk.surowiecId]||0)+sk.kg*sztuk*wsp; });
    return {gr,...o,sztuk,wylicz,planKg,zadaneKg,niedojadyDod,niedojadyZrodla,swiezyTmr,perSzt,proc,wsp,potw,realKg:zadaneKg,kgSzt:wylicz,dataDnia:data,zPaszowozu:z.zPaszowozu,wklady:z.wklady};
  });

  const kolProc = p => Math.abs(p-100)<=3 ? 'var(--zielony-ok)' : (Math.abs(p-100)<=10 ? 'var(--zolty)' : 'var(--czerwony)');

  w.innerHTML = `
  <div class="panel">
    <div class="panel-tyt">
      ${esc(nazwaLok)} \u2014 dzie\u0144 \u017cywienia
      <span class="licznik">${grupy.length} grup \u00b7 ${sumaSzt} szt</span>
      <span style="flex:1"></span>
      <div class="pole-grupa" style="margin:0"><input type="date" id="lkData" value="${data}" max="${dzisiaj()}" style="padding:7px 10px"></div>
      ${przyciskEksportu('#tabelaGT','dzien_'+lok+'_'+data, esc(nazwaLok)+' — dzień żywienia '+dataPL(data))}
      ${edycja?'<button class="btn maly" id="btnNowaGrupa">+ Grupa</button>':''}
    </div>
    <div class="pasek">
      <button class="btn szary maly" id="lkPrev">\u2039 Poprzedni dzie\u0144</button>
      <button class="btn szary maly" id="lkDzis">Dzi\u015b</button>
      <span style="flex:1"></span>
      <span class="podpis">${ilePotw} potwierdzonych \u00b7 ${ileAuto} wg planu</span>
    </div>
    <div class="przewijak">
      <table class="gt-tabela" id="tabelaGT">
        <thead><tr>
          <th>Grupa</th>
          <th class="num">Sztuk</th>
          <th>Dawki (udzia\u0142y %)</th>
          <th class="num">Dawka wyliczona<br>kg/szt</th>
          <th class="num">Plan<br>kg/grup\u0119</th>
          <th class="num">+ Niedojady<br>kg</th>
          <th class="num">Zadane<br>kg na grup\u0119</th>
          <th class="num">\u015awie\u017cy TMR<br>kg</th>
          <th class="num">Per sztuk\u0119<br>kg</th>
          <th class="num">% realiz.</th>
          <th class="num">z\u0142/szt</th>
          ${edycja?'<th class="akcje"></th>':''}
        </tr></thead>
        <tbody>
          ${dane.map(d=>{
            const gr=d.gr;
            const pod = !!gr.parentId;
            const parent = pod ? store.grupyTech[gr.parentId] : null;
            // Jeśli grupa pochodzi z Paszowozu — pokazujemy FAKTYCZNE proporcje wozów,
            // a nie planowe przypisanie z Dawek. To odzwierciedla to, co rzeczywiście
            // trafiło do zwierząt (np. 2 wozy różnych receptur w proporcji 88:12).
            let opis;
            if(d.zPaszowozu && d.wklady?.length){
              const suma = d.wklady.reduce((s,w)=>s+(w.kg||0),0);
              opis = d.wklady.map(w=>{
                const proc = suma>0 ? Math.round(w.kg/suma*100) : 0;
                return `${w.dawkaNazwa} ${proc}%`;
              }).join(' + ') + ' 🚛';
            }else{
              opis = (gr.dawki||[]).map(x=>{
                const daw=store.dawki[x.dawkaId]; return `${daw?.nazwa||'?'} ${x.udzial}%`;
              }).join(' + ');
            }
            const bladU = !d.zPaszowozu && d.sumaUdzialow!==100 && (gr.dawki||[]).length>0;
            const rozw = gtRozwiniete.has(gr.id);
            return `
            <tr class="${pod?'podgrupa':''} ${rozw?'rozwiniety':''} ${d.potw?'':'wgplanu'}" data-rozgt="${gr.id}">
              <td><b>${esc(gr.nazwa)}</b>${pod?' <span class="podpis">('+esc(parent?.nazwa||'')+')</span>':''}
                  ${d.potw?'':'<span class="plakietka auto">wg planu</span>'}</td>
              <td class="num">${mozeWpis?`<input class="pole num" data-szt="${gr.id}" value="${d.sztuk}" style="width:56px" inputmode="numeric">`:d.sztuk}</td>
              <td>${esc(opis)}${bladU?` <span class="blad-udzial">\u26a0 ${d.sumaUdzialow}%</span>`:''}</td>
              <td class="num">${fmt(d.wylicz,2)}</td>
              <td class="num">${fmt(d.planKg,0)}</td>
              <td class="num">${mozeWpis
                  ? `<button class="btn-nied ${d.niedojadyDod?'ma':''}" data-nied="${gr.id}" title="Rozpisz sk\u0105d pochodz\u0105 niedojady">${d.niedojadyDod?fmt(d.niedojadyDod,0):'+'}</button>`
                  : (d.niedojadyDod?fmt(d.niedojadyDod,0):'\u2014')}</td>
              <td class="num">${mozeWpis?`<input class="pole num ${d.potw?'potw':''}" data-zad="${gr.id}" value="${d.potw?fmt(d.zadaneKg,0):''}" placeholder="${fmt(d.planKg,0)}" style="width:82px" inputmode="decimal">`:fmt(d.zadaneKg,0)}</td>
              <td class="num" style="color:var(--zielen);font-weight:600">${fmt(d.swiezyTmr,0)}</td>
              <td class="num"><b>${fmt(d.perSzt,2)}</b></td>
              <td class="num" style="color:${kolProc(d.proc)};font-weight:700">${fmt(d.proc,0)}%</td>
              <td class="num">${fmt(d.kosztSzt*d.wsp,2)}</td>
              ${edycja?`<td class="akcje"><button class="ikonka" data-edgt="${gr.id}" title="Edytuj grup\u0119">\u270e</button></td>`:''}
            </tr>
            ${rozw?'<tr><td colspan="'+(edycja?11:10)+'">'+renderGTDet(gr, d)+'</td></tr>':''}`;
          }).join('')}
          <tr class="suma">
            <td>SUMA ${esc(nazwaLok)}</td><td class="num">${sumaSzt}</td><td></td><td class="num"></td>
            <td class="num">${fmt(sumaPlan,0)}</td><td class="num"></td><td class="num">${fmt(sumaZadane,0)}</td>
            <td class="num"></td><td class="num"></td><td class="num"></td><td class="num">${fmt(sumaKoszt,0)} z\u0142</td>
            ${edycja?'<td></td>':''}
          </tr>
        </tbody>
      </table>
    </div>
    <div class="podpis" style="padding:8px 14px">
      <b>+ Niedojady</b> \u2014 kg niedojad\u00f3w z poprzedniego dnia domieszanych do dzisiejszej dawki (nie wymagaj\u0105 \u015bwie\u017cych surowc\u00f3w).
      <b>\u015awie\u017cy TMR</b> = Zadane \u2212 Niedojady \u2014 tyle faktycznie miesza si\u0119 ze \u015bwie\u017cych sk\u0142adnik\u00f3w (widoczne w karcie za\u0142adunku).
      Puste pole <b>Zadane</b> = przyj\u0119to plan. Kliknij wiersz, \u017ceby rozwin\u0105\u0107 kart\u0119 za\u0142adunku.
    </div>
  </div>

  <div class="panel">
    <div class="panel-tyt">Niedojady z ${dataPL(data)} \u2192 korekta pobrania za ${dataPL(wczoraj)}</div>
    ${!dokWczoraj ? `<div class="pusto">Brak wpisu \u017cywienia za ${dataPL(wczoraj)} \u2014 nie ma czego korygowa\u0107.</div>` : `
    <div class="przewijak"><table class="gt-tabela">
      <thead><tr><th>Grupa</th><th class="num">Zadano ${dataPL(wczoraj)}<br>kg</th>
      <th class="num">Niedojady<br>kg</th><th class="num">Niedojady<br>%</th>
      <th class="num">Pobranie rzeczywiste<br>kg/szt</th></tr></thead>
      <tbody>${grupy.map(gr=>{
        const zy=dokWczoraj.grupy?.[gr.id]; if(!zy) return '';
        const zad = zy.zadaneKg!=null ? zy.zadaneKg : (zy.dawkaWyliczonaKgSzt||0)*(zy.sztuk||0);
        if(!zad) return '';
        const nd=zy.niedojadyKg;
        const proc=(nd!=null&&zad>0)?(nd/zad)*100:null;
        const pobr=(zy.sztuk>0)?(zad-(nd||0))/zy.sztuk:null;
        return `<tr><td><b>${esc(gr.nazwa)}</b></td><td class="num">${fmt(zad,0)}</td>
          <td class="num">${mozeWpis?`<input class="pole num" data-nd="${gr.id}" value="${nd!=null?fmt(nd,0):''}" placeholder="0" style="width:76px" inputmode="decimal">`:(nd!=null?fmt(nd,0):'\u2014')}</td>
          <td class="num">${proc!=null?fmt(proc,1)+'%':'\u2014'}</td>
          <td class="num"><b>${pobr!=null?fmt(pobr,1):'\u2014'}</b></td></tr>`;
      }).join('')}</tbody>
    </table></div>`}
  </div>

  <div class="panel">
    <div class="panel-tyt">Realny sk\u0142ad dawek \u2014 ${esc(nazwaLok)}, ${dataPL(data)}
      <span class="licznik">kg surowca / sztuk\u0119 / dob\u0119</span>
      <span style="flex:1"></span>
      ${przyciskEksportu('#macierzLok','sklad_'+lok+'_'+data, 'Realny sk\u0142ad dawek — '+esc(nazwaLok)+' '+dataPL(data))}
    </div>
    ${macierzSurowcowa(dane.map(d=>({
        gid:d.gr.id, nazwa:d.gr.nazwa, sztuk:d.sztuk, wylicz:d.wylicz, planKg:d.planKg,
        zadaneKg:d.zadaneKg, odzysk:d.niedojadyDod, swiezy:d.swiezyTmr, perSzt:d.perSzt,
        skladniki:d.skladniki, niedojadyZrodla:d.niedojadyZrodla
      })), dokWczoraj, {id:'macierzLok'})}
  </div>`;

  // --- PODPIĘCIA ---
  w.querySelector('#lkData').onchange=e=>{lokData[lok]=e.target.value; renderLokalizacja(w,lok);};
  w.querySelector('#lkPrev').onclick=()=>{lokData[lok]=dataMinus(data,1); renderLokalizacja(w,lok);};
  w.querySelector('#lkDzis').onclick=()=>{lokData[lok]=dzisiaj(); renderLokalizacja(w,lok);};
  w.querySelectorAll('[data-rozgt]').forEach(tr=>{
    tr.onclick=e=>{
      if(e.target.closest('input,button,.ikonka')) return;
      const id=tr.dataset.rozgt;
      gtRozwiniete.has(id)?gtRozwiniete.delete(id):gtRozwiniete.add(id);
      renderLokalizacja(w,lok);
    };
  });
  if(mozeWpis){
    w.querySelectorAll('[data-szt]').forEach(i=>{
      i.onclick=e=>e.stopPropagation();
      i.onchange=async()=>{
        const v=Math.max(0,parseInt(i.value)||0);
        await DB.zapisz('grupyTech', i.dataset.szt, {sztuk:v});
        await zapiszDzien(lok, data, i.dataset.szt, {sztuk:v});
      };
    });
    w.querySelectorAll('[data-zad]').forEach(i=>{
      i.onclick=e=>e.stopPropagation();
      i.onchange=()=>{
        const v=i.value.trim();
        zapiszDzien(lok, data, i.dataset.zad, {zadaneKg: v===''?null:Math.max(0,liczba(v))});
      };
    });
    w.querySelectorAll('[data-nied]').forEach(b=>{
      b.onclick=e=>{ e.stopPropagation(); oknoNiedojady(lok, data, b.dataset.nied); };
    });
    w.querySelectorAll('[data-nd]').forEach(i=>{
      i.onclick=e=>e.stopPropagation();
      i.onchange=()=>{
        const v=i.value.trim();
        zapiszDzien(lok, wczoraj, i.dataset.nd, {niedojadyKg: v===''?null:Math.max(0,liczba(v))});
      };
    });
  }
  if(edycja){
    w.querySelectorAll('[data-edgt]').forEach(b=>{
      b.onclick=e=>{e.stopPropagation();oknoEdGrupa(lok,b.dataset.edgt);};
    });
    const btn=w.querySelector('#btnNowaGrupa');
    if(btn) btn.onclick=()=>oknoEdGrupa(lok);
  }
}

function renderGTDet(gr, d){
  if(!d) return '';
  const wsp = d.wsp!=null ? d.wsp : 1;
  let wWozie = 0;
  const zrodlaOpis = (d.niedojadyZrodla||[]).map(zr=>{
    const g = store.grupyTech[zr.grupaId];
    return esc(g?.nazwa||'?')+' '+fmt(zr.kg,0)+' kg';
  }).join(' + ');
  const wierszNiedojadow = d.niedojadyDod>0 ? (()=>{
    wWozie += d.niedojadyDod;
    return `<tr style="background:#fff8e1"><td><b>\u267b Niedojady z ${dataPL(dataMinus(d.dataDnia||dzisiaj(),1))}</b>${zrodlaOpis?'<br><span class="podpis">z: '+zrodlaOpis+'</span>':''}</td><td class="num">\u2014</td><td class="num">${fmt(d.niedojadyDod/(d.sztuk||1),2)}</td><td class="num">${fmt(d.niedojadyDod,1)}</td><td class="num wwozie">${fmt(wWozie,1)}</td></tr>`;
  })() : '';
  const wiersze = d.skladniki.map(sk=>{
    const sur = store.surowce[sk.surowiecId];
    const kgSztReal = sk.kg*wsp;
    const kgGr = kgSztReal*(d.sztuk||0);
    wWozie += kgGr;
    return `<tr><td>${esc(sur?.nazwa||'?')}</td><td class="num">${fmt(sk.kg,2)}</td><td class="num">${fmt(kgSztReal,2)}</td><td class="num">${fmt(kgGr,1)}</td><td class="num wwozie">${fmt(wWozie,1)}</td></tr>`;
  }).join('');
  return `<div class="gt-det">
    <h4>Karta za\u0142adunku \u2014 ${esc(gr.nazwa)} (${d.sztuk||0} szt \u00b7 ${fmt(d.zadaneKg,0)} kg razem${d.niedojadyDod>0?', w tym '+fmt(d.swiezyTmr,0)+' kg \u015bwie\u017cych':''})${d.potw?'':' \u2014 wg planu'}</h4>
    <div class="gt-dawki-lista">${(gr.dawki||[]).map(x=>{
      const daw=store.dawki[x.dawkaId];
      return `<span class="chip"><b>${x.udzial}%</b> ${esc(daw?.nazwa||'?')}</span>`;
    }).join('')}</div>
    <table>
      <thead><tr><th>Surowiec</th><th class="num">Plan kg/szt</th><th class="num">Realnie kg/szt</th><th class="num">kg na grup\u0119</th><th class="num">W wozie</th></tr></thead>
      <tbody>${wierszNiedojadow}${wiersze}
        <tr style="font-weight:700;border-top:2px solid var(--zielen)"><td>RAZEM</td><td class="num">${fmt(d.wylicz,2)}</td><td class="num">${fmt(d.perSzt,2)}</td><td class="num">${fmt(d.zadaneKg,1)}</td><td></td></tr>
      </tbody>
    </table>
    <div class="podpis">Koszt: ${fmt(d.kosztSzt*wsp,2)} z\u0142/szt/dob\u0119 (liczony tylko od \u015bwie\u017cej porcji) \u00b7 ${fmt(d.kosztSzt*wsp*(d.sztuk||0),0)} z\u0142/grup\u0119/dob\u0119 \u00b7 realizacja ${fmt(d.proc,0)}%</div>
  </div>`;
}

function oknoEdGrupa(lok, edId){
  const isEdit = !!edId;
  const g = isEdit ? store.grupyTech[edId] : null;
  const dawkiList = dawkiSorted();
  const grupy = grupyLok(lok).filter(x=>x.id!==edId);
  let dawkiGrupy = isEdit ? [...(g.dawki||[])] : [];
  if(dawkiGrupy.length===0) dawkiGrupy.push({dawkaId:dawkiList[0]?.id||'', udzial:100});

  function renderDawkiEdycja(){
    return dawkiGrupy.map((d,i)=>`
      <div class="wiersz2" style="margin-bottom:6px;align-items:end">
        <div class="pole-grupa" style="margin:0;flex:2">
          ${i===0?'<label>Dawka</label>':''}
          <select data-di="${i}" data-pole="dawkaId">
            ${dawkiList.map(dl=>`<option value="${dl.id}" ${dl.id===d.dawkaId?'selected':''}>${esc(dl.nazwa)}</option>`).join('')}
          </select>
        </div>
        <div class="pole-grupa" style="margin:0;flex:1">
          ${i===0?'<label>Udzia\u0142 %</label>':''}
          <input data-di="${i}" data-pole="udzial" type="number" value="${d.udzial||0}" min="0" max="100" style="width:80px">
        </div>
        <button class="ikonka usun" data-usundaw="${i}" title="Usu\u0144">\u2715</button>
      </div>`).join('');
  }

  modal({
    tytul: isEdit?`Edytuj: ${g.nazwa}`:'Nowa grupa technologiczna',
    tresc:`
      <div class="wiersz2">
        <div class="pole-grupa"><label>Nazwa</label><input id="gnNazwa" value="${esc(g?.nazwa||'')}" autocomplete="off"></div>
        <div class="pole-grupa"><label>Liczba sztuk</label><input id="gnSztuk" type="number" value="${g?.sztuk||0}" min="0"></div>
      </div>
      <div class="pole-grupa">
        <label>Podgrupa (opcjonalnie)</label>
        <select id="gnParent">
          <option value="">\u2014 brak (grupa g\u0142\u00f3wna) \u2014</option>
          ${grupy.filter(x=>!x.parentId).map(x=>`<option value="${x.id}" ${g?.parentId===x.id?'selected':''}>${esc(x.nazwa)}</option>`).join('')}
        </select>
      </div>
      <hr style="border:none;border-top:1px solid var(--linia);margin:12px 0">
      <div style="font-weight:600;margin-bottom:8px">Przypisane dawki</div>
      <div id="gnDawki">${renderDawkiEdycja()}</div>
      <button class="btn maly szary" id="gnDodDaw" style="margin-top:4px">+ Dawka</button>
      <div class="podpis" style="margin-top:6px" id="gnSumaInfo">Suma udzia\u0142\u00f3w: ${dawkiGrupy.reduce((s,d)=>s+(d.udzial||0),0)}%</div>
      ${isEdit?`<hr style="border:none;border-top:1px solid var(--linia);margin:14px 0">
        <button class="btn czerw maly" id="gnUsun">\u2715 Usu\u0144 t\u0119 grup\u0119 technologiczn\u0105</button>
        <div class="podpis" style="margin-top:5px">Usuni\u0119cie kasuje grup\u0119 razem z przypisanymi dawkami i histori\u0105 wpis\u00f3w.</div>`:''}`,
    przyciski:[
      {tekst:'Anuluj'},
      {tekst:isEdit?'Zapisz':'Dodaj', klasa:'', akcja:async(n)=>{
        const nazwa=n.querySelector('#gnNazwa').value.trim();
        if(!nazwa){toast('Podaj nazw\u0119.',true);return false;}
        const sztuk=Math.max(0,parseInt(n.querySelector('#gnSztuk').value)||0);
        const parentId=n.querySelector('#gnParent').value||null;
        const sels=n.querySelectorAll('[data-pole="dawkaId"]');
        const inps=n.querySelectorAll('[data-pole="udzial"]');
        const daw=[];
        sels.forEach((sel,i)=>{
          const u=parseInt(inps[i]?.value)||0;
          if(sel.value && u>0) daw.push({dawkaId:sel.value, udzial:u});
        });
        const dane={nazwa,sztuk,parentId,dawki:daw,lokalizacja:lok};
        if(isEdit){
          // Czy udziały dawek faktycznie się zmieniły? Jeśli tak — pytamy od kiedy obowiązują.
          const stareU = JSON.stringify((g.dawki||[]).map(x=>[x.dawkaId,x.udzial]));
          const noweU  = JSON.stringify(daw.map(x=>[x.dawkaId,x.udzial]));
          if(stareU!==noweU){
            zamknijModal();
            pytajOdKiedy(async(odData)=>{
              if(!odData) return;
              if(odData>dzisiaj()){
                await DB.zapisz('grupyTech',edId,{nazwa,sztuk,parentId});
                await zapiszDoZaplanowanej(odData,(baza)=>{
                  if(baza.grupy[edId]) baza.grupy[edId]={...baza.grupy[edId], dawki:daw};
                });
                toast(`Zmiana udzia\u0142\u00f3w zaplanowana od ${dataPL(odData)}.`);
              }else{
                await DB.zapisz('grupyTech',edId,dane);
                await zapiszWersje(odData);
                toast('Zapisano \u2014 obowi\u0105zuje od dzi\u015b.');
              }
              render();
            });
            return false;
          }
          await DB.zapisz('grupyTech',edId,dane);toast('Zapisano.');
        }
        else{dane.kolejnosc=grupyLok(lok).reduce((m,x)=>Math.max(m,x.kolejnosc??0),0)+1;await DB.zapisz('grupyTech',null,dane);toast('Dodano grup\u0119.');}
      }}
    ]
  });

  function odswiez(){
    const k=document.getElementById('gnDawki'); if(k) k.innerHTML=renderDawkiEdycja(); podepnijDawki();
    const info=document.getElementById('gnSumaInfo'); if(info) info.textContent='Suma udzia\u0142\u00f3w: '+dawkiGrupy.reduce((s,d)=>s+(d.udzial||0),0)+'%';
  }
  function podepnijDawki(){
    const n=document.getElementById('nakladka');
    n.querySelectorAll('[data-pole="dawkaId"]').forEach(sel=>{sel.onchange=()=>{dawkiGrupy[+sel.dataset.di].dawkaId=sel.value;};});
    n.querySelectorAll('[data-pole="udzial"]').forEach(inp=>{inp.onchange=()=>{dawkiGrupy[+inp.dataset.di].udzial=parseInt(inp.value)||0;odswiez();};});
    n.querySelectorAll('[data-usundaw]').forEach(b=>{b.onclick=()=>{dawkiGrupy.splice(+b.dataset.usundaw,1);odswiez();};});
  }
  podepnijDawki();
  document.getElementById('gnDodDaw').onclick=()=>{dawkiGrupy.push({dawkaId:dawkiList[0]?.id||'',udzial:0});odswiez();};
  const buU = document.getElementById('gnUsun');
  if(buU) buU.onclick = ()=>{
    zamknijModal();
    potwierdz('Usun\u0105\u0107 grup\u0119?', `\u201e${esc(g?.nazwa)}\u201d \u2014 dane zostan\u0105 utracone.`,
      ()=>{ DB.usun('grupyTech', edId); toast('Usuni\u0119to grup\u0119.'); }, 'Usu\u0144');
  };
}

/* Rozdzielnik niedojadów: skąd fizycznie pochodzą kilogramy domieszane do tej grupy.
   Pilnuje, żeby nie rozdysponować więcej, niż faktycznie zebrano z grupy źródłowej. */
function oknoNiedojady(lok, data, grupaId){
  const gr = store.grupyTech[grupaId];
  const wczoraj = dataMinus(data,1);
  const dokWczoraj = dokDnia(lok,wczoraj);
  const dok = dokDnia(lok,data);
  const z = dok?.grupy?.[grupaId] || {};
  let zrodla = [...(z.niedojadyZrodla || [])];
  const grupy = grupyLok(lok);

  // Ile niedojadów zebrano wczoraj z każdej grupy
  const zebrane = {};
  grupy.forEach(g=>{
    const zy = dokWczoraj?.grupy?.[g.id];
    if(zy?.niedojadyKg > 0) zebrane[g.id] = zy.niedojadyKg;
  });
  // Ile już rozdysponowano dziś do INNYCH grup
  const rozdane = {};
  Object.entries(dok?.grupy||{}).forEach(([gid,gz])=>{
    if(gid===grupaId) return;
    (gz.niedojadyZrodla||[]).forEach(zr=>{ rozdane[zr.grupaId]=(rozdane[zr.grupaId]||0)+(zr.kg||0); });
  });

  const dostepne = Object.keys(zebrane);

  function rysujWiersze(){
    if(!zrodla.length) return '<div class="podpis" style="padding:8px 0">Brak przypisanych źródeł. Dodaj poniżej.</div>';
    return zrodla.map((zr,i)=>{
      const maxZ = (zebrane[zr.grupaId]||0) - (rozdane[zr.grupaId]||0);
      const zaDuzo = zr.kg > maxZ + 0.01;
      return `
      <div class="wiersz2" style="margin-bottom:6px;align-items:end">
        <div class="pole-grupa" style="margin:0;flex:2">
          ${i===0?'<label>Grupa źródłowa (niedojady z '+dataPL(wczoraj)+')</label>':''}
          <select data-zi="${i}" data-pole="grupaId">
            ${grupy.map(g=>`<option value="${g.id}" ${g.id===zr.grupaId?'selected':''}>${esc(g.nazwa)}${zebrane[g.id]?' — zebrano '+fmt(zebrane[g.id],0)+' kg':' — brak'}</option>`).join('')}
          </select>
        </div>
        <div class="pole-grupa" style="margin:0;flex:1">
          ${i===0?'<label>kg</label>':''}
          <input data-zi="${i}" data-pole="kg" type="number" value="${zr.kg||0}" min="0" step="1"
                 style="width:90px${zaDuzo?';border-color:var(--czerwony)':''}" inputmode="decimal">
          ${zaDuzo?`<div class="hint" style="color:var(--czerwony)">max ${fmt(maxZ,0)} kg</div>`:''}
        </div>
        <button class="ikonka usun" data-usunzr="${i}" title="Usuń">✕</button>
      </div>`;
    }).join('');
  }

  function suma(){ return zrodla.reduce((s,x)=>s+(Number(x.kg)||0),0); }

  modal({
    tytul:`Niedojady domieszane — ${gr?.nazwa||''}`,
    szer:'620px',
    tresc:`
      <div class="podpis" style="margin-bottom:12px">
        Niedojady to pasza TMR pozostawiona przez zwierzęta poprzedniego dnia. Wskaż, z których grup
        pochodzą kilogramy domieszane dziś do tej grupy — dzięki temu zużycie świeżych surowców
        i koszt liczą się poprawnie, a pobranie grupy źródłowej zostaje pomniejszone.
      </div>
      ${dostepne.length ? `<div class="nd-bilans ok">Wczoraj (${dataPL(wczoraj)}) zebrano niedojady z ${dostepne.length} grup:
        ${dostepne.map(g=>esc(store.grupyTech[g]?.nazwa||'?')+' '+fmt(zebrane[g],0)+' kg').join(' · ')}</div>`
      : `<div class="nd-bilans zle">Za ${dataPL(wczoraj)} nie zarejestrowano jeszcze niedojadów u żadnej grupy.
         Wpisane tutaj kilogramy zostaną automatycznie zapisane jako niedojady grup źródłowych za ${dataPL(wczoraj)} —
         dzięki temu ich pobranie rzeczywiste zostanie poprawnie pomniejszone.</div>`}
      <div id="ndLista">${rysujWiersze()}</div>
      <button class="btn maly szary" id="ndDodaj" style="margin-top:4px">+ Źródło</button>
      <hr style="border:none;border-top:1px solid var(--linia);margin:14px 0">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>Razem domieszane</b><b id="ndSuma" style="font-size:17px">${fmt(suma(),0)} kg</b>
      </div>`,
    przyciski:[
      {tekst:'Anuluj'},
      {tekst:'Zapisz', klasa:'', akcja:async(n)=>{
        const sels=n.querySelectorAll('[data-pole="grupaId"]');
        const inps=n.querySelectorAll('[data-pole="kg"]');
        const lista=[];
        sels.forEach((s,i)=>{
          const kg=liczba(inps[i]?.value);
          if(s.value && kg>0) lista.push({grupaId:s.value, kg});
        });
        // Kilogramy nie biorą się znikąd: sumujemy per grupa źródłowa i sprawdzamy,
        // czy da się je pokryć tym, co ta grupa faktycznie zostawiła.
        const perZrodlo={};
        lista.forEach(x=>{ perZrodlo[x.grupaId]=(perZrodlo[x.grupaId]||0)+x.kg; });
        const bledy=[];
        for(const [gid,kg] of Object.entries(perZrodlo)){
          const limit = (zebrane[gid]||0) - (rozdane[gid]||0);
          const zebranoWcale = zebrane[gid]!=null;
          if(zebranoWcale && kg > limit + 0.01){
            bledy.push(`${store.grupyTech[gid]?.nazwa||'?'}: chcesz ${fmt(kg,0)} kg, dostępne ${fmt(Math.max(0,limit),0)} kg`);
          }
        }
        if(bledy.length){
          toast('Nie da się rozdysponować więcej, niż zebrano. '+bledy.join(' · '), true);
          return false;
        }
        const razem=lista.reduce((s,x)=>s+x.kg,0);
        await zapiszDzien(lok, data, grupaId, {
          niedojadyZrodla: lista,
          niedojadyDodaneKg: razem>0 ? razem : null
        });
        // DRUGA STRONA OPERACJI: jeśli grupa źródłowa nie ma zarejestrowanych niedojadów
        // za dzień poprzedni, rejestrujemy je teraz — inaczej jej pobranie byłoby zawyżone.
        let dopisane=0;
        for(const [gid,kg] of Object.entries(perZrodlo)){
          if(zebrane[gid]==null){
            await zapiszDzien(lok, wczoraj, gid, {niedojadyKg: kg});
            dopisane++;
          }
        }
        toast(razem>0
          ? `Domieszano ${fmt(razem,0)} kg.` + (dopisane?` Zarejestrowano niedojady u ${dopisane} grup za ${dataPL(wczoraj)}.`:'')
          : 'Usunięto niedojady.');
      }}
    ]
  });

  function odsw(){
    const k=document.getElementById('ndLista'); if(k) k.innerHTML=rysujWiersze();
    const s=document.getElementById('ndSuma'); if(s) s.textContent=fmt(suma(),0)+' kg';
    podepnij();
  }
  function podepnij(){
    const n=document.getElementById('nakladka');
    n.querySelectorAll('[data-pole="grupaId"]').forEach(s=>{s.onchange=()=>{zrodla[+s.dataset.zi].grupaId=s.value;odsw();};});
    n.querySelectorAll('[data-pole="kg"]').forEach(i=>{i.onchange=()=>{zrodla[+i.dataset.zi].kg=liczba(i.value);odsw();};});
    n.querySelectorAll('[data-usunzr]').forEach(b=>{b.onclick=()=>{zrodla.splice(+b.dataset.usunzr,1);odsw();};});
  }
  podepnij();
  document.getElementById('ndDodaj').onclick=()=>{
    const pierwsza = dostepne[0] || grupy[0]?.id;
    const max = pierwsza ? (zebrane[pierwsza]||0)-(rozdane[pierwsza]||0) : 0;
    zrodla.push({grupaId:pierwsza, kg: Math.max(0, Math.round(max))});
    odsw();
  };
}

/* ===================== ZAKŁADKA: PASZOWÓZ =================================
   Model: jeden dokument na dzień × lokalizację. Każdy wóz to receptura +
   waga faktyczna + rozdzielenie na sektory. Realny skład sektora liczy się
   automatycznie z proporcji wozów, które do niego zjechały.
   ========================================================================= */
let pzData = {};   // wybrana data per lokalizacja
let pzRozwiniete = new Set();

function idPz(lok,data){ return lok+'_'+data; }
function pzDok(lok,data){ return store.paszowozy[idPz(lok,data)] || null; }

/* Dawki dostępne dla lokalizacji: W (wspólne) + N (Nadarzyn) lub W + B (Boguszyn) */
function dawkiDlaLok(lok){
  const flaga = lok==='nadarzyn' ? 'N' : 'B';
  return dawkiSorted().filter(d=>{
    const l = d.lokalizacja || 'W';
    // 'X' = brak przypisania — dawka istnieje w Dawkach, ale nie wchodzi do Paszowozu
    return l==='W' || l===flaga;
  });
}

/* Nowy wóz — inicjuje puste rozdzielenie */
function nowyWoz(nr){
  return {id:'w'+Date.now()+'_'+Math.random().toString(36).slice(2,5),
          nazwa:'Wóz '+nr, dawkaId:'', wagaFaktyczna:0, rozdzielenie:[]};
}

async function zapiszPaszowoz(lok, data, wozy){
  await DB.zapisz('paszowozy', idPz(lok,data), {lokalizacja:lok, data, wozy,
    autor:ROLE[rolaAkt]?.nazwa||'?', ts:Date.now()});
  await synchronizujZywienieZPaszowozu(lok, data, wozy);
}

/* Po zmianie wozów przelicza zywienie sektorów — bo raporty czytają stamtąd */
async function synchronizujZywienieZPaszowozu(lok, data, wozy){
  const grupy = grupyLok(lok);
  const perGrupa = {};   // gid -> {kg, wklad:[{dawkaId,kg,skladniki,udzialy,koszt}]}
  wozy.forEach(w=>{
    const daw = store.dawki[w.dawkaId]; if(!daw) return;
    const receptura = daw.skladniki||[];
    const sumaR = receptura.reduce((s,x)=>s+x.kg,0);
    const kosztKgReceptury = sumaR>0
      ? receptura.reduce((s,x)=>{const sur=store.surowce[x.surowiecId]; return s+x.kg*((sur?.cenaTona||0)/1000);},0) / sumaR
      : 0;
    (w.rozdzielenie||[]).forEach(rz=>{
      if(!rz.grupaId || !(rz.kg>0)) return;
      const a = perGrupa[rz.grupaId] || (perGrupa[rz.grupaId]={kg:0, wklad:[]});
      a.kg += rz.kg;
      // wkład proporcjonalny — kilogram wozu wnosi swój udział masowy każdego surowca
      const skl = sumaR>0 ? receptura.map(x=>({surowiecId:x.surowiecId, kg: rz.kg*(x.kg/sumaR)})) : [];
      a.wklad.push({dawkaId:w.dawkaId, dawkaNazwa:daw.nazwa, kg:rz.kg, skladniki:skl, kosztKgReceptury});
    });
  });
  // zapisujemy do dokumentu dnia — pole "zPaszowozu" mówi że dane pochodzą stąd
  const id = idDnia(lok,data);
  const stary = store.zywienie[id] || {lokalizacja:lok, data, grupy:{}};
  const grupyNowe = {...(stary.grupy||{})};
  for(const gr of grupy){
    const a = perGrupa[gr.id];
    if(a){
      // scal składniki po surowcach
      const sum = {};
      a.wklad.forEach(w=>w.skladniki.forEach(s=>{ sum[s.surowiecId]=(sum[s.surowiecId]||0)+s.kg; }));
      const skladniki = Object.entries(sum).map(([surowiecId,kg])=>({surowiecId, kg: kg/(gr.sztuk||1)}));
      // koszt średnioważony (kg × koszt receptury) / suma kg
      const kosztKgTMR = a.kg>0 ? a.wklad.reduce((s,w)=>s+w.kg*w.kosztKgReceptury,0)/a.kg : 0;
      // WAŻNE: dawkaWyliczonaKgSzt to PLAN wg receptury grupy, nie faktyczne zadanie —
      // dzięki temu % realizacji porównuje realne z planem, a nie z samym sobą.
      const wyliczonaZReceptury = obliczGrupe(gr).kgSzt;
      grupyNowe[gr.id] = {
        ...(grupyNowe[gr.id]||{}),
        sztuk: gr.sztuk, zadaneKg: a.kg,
        skladniki, kosztKgTMR,
        dawkaWyliczonaKgSzt: wyliczonaZReceptury,
        nazwaGrupy: gr.nazwa,
        zPaszowozu: true,
        wklady: a.wklad.map(w=>({dawkaNazwa:w.dawkaNazwa, kg:w.kg})),
        autor: ROLE[rolaAkt]?.nazwa||'?', ts:Date.now()
      };
    }
  }
  // Defensywne czyszczenie sierot: iterujemy po wszystkich wpisach żywienia,
  // nie tylko po aktualnych grupach. Kasujemy każdy, który nosi ślad paszowozu
  // (flaga zPaszowozu albo pole wklady), ale nie ma odpowiednika w bieżących wozach.
  for(const gid of Object.keys(grupyNowe)){
    if(perGrupa[gid]) continue;
    const g = grupyNowe[gid];
    if(g?.zPaszowozu || g?.wklady){
      const {zadaneKg, wklady, zPaszowozu, ...reszta} = g;
      grupyNowe[gid] = reszta;
    }
  }
  await DB.zapisz('zywienie', id, {lokalizacja:lok, data, grupy:grupyNowe});
}

      <thead><tr>
        <th>Sektor</th><th class="num">Sztuk</th>
        <th class="num">Plan wg<br>receptury<br>kg/szt</th>
        <th class="num">Plan<br>kg/grupę</th>
        <th class="num">Podane<br>kg</th>
        <th class="num">Per sztukę<br>kg</th>
        <th class="num">% realiz.</th>
        <th class="num">Z ilu<br>wozów</th>
        <th>Z wozów</th>
      </tr></thead>
      <tbody>
        ${grupy.map(gr=>{
          const kg = sektorKg[gr.id]||0;
          if(!kg && !edycja) return '';
          const wkl = sektorWklady[gr.id]||[];
          const opis = wkl.map(w=>{
            const wz = wozy.find(x=>x.id===w.wozId);
            return `${esc(wz?.nazwa||'?')}: ${fmt(w.kg,0)} kg`;
          }).join(' · ');
          // plan liczony z aktualnej receptury grupy (miksuje udziały jak w Dawkach)
          const planKgSzt = obliczGrupe(gr).kgSzt;
          const planKgGrupa = planKgSzt * (gr.sztuk||0);
          const perSzt = gr.sztuk>0 ? kg/gr.sztuk : 0;
          const proc = planKgSzt>0 ? (perSzt/planKgSzt)*100 : 0;
          const kolProc = p => Math.abs(p-100)<=3 ? 'var(--zielony-ok)' : (Math.abs(p-100)<=10 ? 'var(--zolty)' : 'var(--czerwony)');
          return `<tr class="${!kg?'wgplanu':''}">
            <td><b>${esc(gr.nazwa)}</b></td>
            <td class="num">${gr.sztuk||0}</td>
            <td class="num">${planKgSzt>0?fmt(planKgSzt,2):'—'}</td>
            <td class="num">${planKgGrupa>0?fmt(planKgGrupa,0):'—'}</td>
            <td class="num"><b>${kg?fmt(kg,0):'—'}</b></td>
            <td class="num"><b>${kg&&gr.sztuk>0?fmt(perSzt,2):'—'}</b></td>
            <td class="num" style="${kg&&planKgSzt>0?'color:'+kolProc(proc)+';font-weight:700':'color:var(--tekst-slaby)'}">${kg&&planKgSzt>0?fmt(proc,0)+'%':'—'}</td>
            <td class="num">${wkl.length||'—'}</td>
            <td class="podpis">${opis||'—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
    <div class="podpis" style="padding:8px 14px">
      <b>Plan</b> to ilość TMR wg receptury grupy × liczba sztuk. <b>% realizacji</b> = podane per sztukę ÷ plan per sztukę.
      Kolory: zielony ±3%, żółty ±10%, czerwony powyżej. Uwaga: 100% masy nie znaczy że skład był zgodny —
      to widać niżej w macierzy realnego składu.
    </div>

    <div class="panel-tyt" style="margin-top:24px;border-top:1px solid var(--linia)">
      Realny skład dawek per sektor <span class="licznik">kg surowca / sztukę / dobę</span>
    </div>
    ${(()=>{
      const dokWczoraj = dokDnia(lok, dataMinus(data,1));
      const pozycje = grupy.map(gr=>{
        const kg = sektorKg[gr.id]||0;
        const skl = {};
        (sektorWklady[gr.id]||[]).forEach(w=>{
          const daw = store.dawki[w.dawka]; if(!daw) return;
          const sumaR = (daw.skladniki||[]).reduce((s,x)=>s+x.kg,0);
          if(sumaR<=0) return;
          daw.skladniki.forEach(x=>{ skl[x.surowiecId] = (skl[x.surowiecId]||0) + w.kg*(x.kg/sumaR); });
        });
        return {gid:gr.id, gr, sztuk:gr.sztuk||0, kg, skl};
      }).filter(p=>p.kg>0);
      if(!pozycje.length) return '<div class="pusto">Brak wozów przypisanych do sektorów.</div>';
      return macierzZWozow(pozycje, {id:'pzRealny'});
    })()}
    ` : `<div class="pusto" style="padding:40px 20px;text-align:center">
      <div style="font-size:44px;margin-bottom:14px">🚛</div>
      <div style="font-size:15px;font-weight:600;color:var(--tekst);margin-bottom:6px">Brak wozów na ten dzień</div>
      <div class="podpis" style="max-width:440px;margin:0 auto">Kliknij <b>+ Wóz</b> żeby dodać pierwszy, albo <b>⎘ Duplikuj z wczoraj</b> jeśli układ jest podobny.</div>
    </div>`}
    </div>
  </div>`;

  // ===== PODPIĘCIA =====
  w.querySelector('#pzData').onchange = e=>{ pzData[lok]=e.target.value; renderPaszowoz(w,lok); };
  w.querySelector('#pzPrev').onclick = ()=>{ pzData[lok]=dataMinus(data,1); renderPaszowoz(w,lok); };
  w.querySelector('#pzDzis').onclick = ()=>{ pzData[lok]=dzisiaj(); renderPaszowoz(w,lok); };

  if(!edycja) return;

  w.querySelector('#pzDodaj').onclick = async ()=>{
    wozy.push(nowyWoz(wozy.length+1));
    await zapiszPaszowoz(lok, data, wozy);
  };
  w.querySelector('#pzDuplikuj').onclick = async ()=>{
    if(wozy.length){ if(!confirm('Zastąpić bieżące wozy tymi z poprzedniego dnia?')) return; }
    const wczoraj = dataMinus(data,1);
    const src = pzDok(lok, wczoraj);
    if(!src?.wozy?.length){ toast('Brak wozów za '+dataPL(wczoraj), true); return; }
    const kopia = src.wozy.map((w,i)=>({...w, id:'w'+Date.now()+'_'+i}));
    await zapiszPaszowoz(lok, data, kopia);
    toast(`Skopiowano ${kopia.length} wozów z ${dataPL(wczoraj)}.`);
  };

  w.querySelectorAll('[data-woz-nazwa]').forEach(i=>{
    i.onchange = async ()=>{
      const woz = wozy.find(x=>x.id===i.dataset.wozNazwa); if(woz){ woz.nazwa=i.value.trim()||woz.nazwa; await zapiszPaszowoz(lok,data,wozy); }
    };
  });
  w.querySelectorAll('[data-woz-dawka]').forEach(s=>{
    s.onchange = async ()=>{
      const woz = wozy.find(x=>x.id===s.dataset.wozDawka); if(woz){ woz.dawkaId=s.value; await zapiszPaszowoz(lok,data,wozy); }
    };
  });
  w.querySelectorAll('[data-woz-waga]').forEach(i=>{
    i.onchange = async ()=>{
      const woz = wozy.find(x=>x.id===i.dataset.wozWaga); if(woz){ woz.wagaFaktyczna=Math.max(0,liczba(i.value)); await zapiszPaszowoz(lok,data,wozy); }
    };
  });
  w.querySelectorAll('[data-woz-usun]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Usunąć ten wóz?')) return;
      wozy = wozy.filter(x=>x.id!==b.dataset.wozUsun);
      await zapiszPaszowoz(lok,data,wozy);
    };
  });
  w.querySelectorAll('[data-woz-dodaj]').forEach(b=>{
    b.onclick = async ()=>{
      const woz = wozy.find(x=>x.id===b.dataset.wozDodaj); if(!woz) return;
      woz.rozdzielenie = woz.rozdzielenie||[];
      // domyślnie dopełnij brakującą wagą do pierwszego sektora bez wpisu
      const sumaRozdz = woz.rozdzielenie.reduce((s,r)=>s+(r.kg||0),0);
      const brakuje = Math.max(0, (woz.wagaFaktyczna||0) - sumaRozdz);
      woz.rozdzielenie.push({grupaId:'', kg: brakuje>0 ? Math.round(brakuje) : 0});
      await zapiszPaszowoz(lok,data,wozy);
    };
  });
  w.querySelectorAll('[data-rz-grupa]').forEach(s=>{
    s.onchange = async ()=>{
      const [wid,i] = s.dataset.rzGrupa.split('|');
      const woz = wozy.find(x=>x.id===wid); if(woz){ woz.rozdzielenie[+i].grupaId=s.value; await zapiszPaszowoz(lok,data,wozy); }
    };
  });
  w.querySelectorAll('[data-rz-kg]').forEach(i=>{
    i.onchange = async ()=>{
      const [wid,idx] = i.dataset.rzKg.split('|');
      const woz = wozy.find(x=>x.id===wid); if(woz){ woz.rozdzielenie[+idx].kg=Math.max(0,liczba(i.value)); await zapiszPaszowoz(lok,data,wozy); }
    };
  });
  w.querySelectorAll('[data-rz-usun]').forEach(b=>{
    b.onclick = async ()=>{
      const [wid,idx] = b.dataset.rzUsun.split('|');
      const woz = wozy.find(x=>x.id===wid); if(woz){ woz.rozdzielenie.splice(+idx,1); await zapiszPaszowoz(lok,data,wozy); }
    };
  });
}

/* Macierz surowce × sektory dla widoku Paszowóz — na podstawie realnych wozów */
function macierzZWozow(pozycje, opcje){
  opcje = opcje||{};
  const uzyte = new Set();
  pozycje.forEach(p=>Object.entries(p.skl).forEach(([sid,kg])=>{ if(kg>0.001) uzyte.add(sid); }));
  const uklad = wierszeDawek();
  const wiersze = [...uklad.filter(id=>uzyte.has(id)), ...[...uzyte].filter(id=>!uklad.includes(id))];
  const naglowki = pozycje.map(p=>{
    const perSzt = p.sztuk>0 ? p.kg/p.sztuk : 0;
    return `<th><span class="nazwa-kol" title="${esc(p.gr.nazwa)}">${esc(p.gr.nazwa)}</span>
      <span style="font-size:9.5px;opacity:.85;display:block;font-weight:400">${p.sztuk} szt · ${fmt(perSzt,1)} kg/szt</span></th>`;
  }).join('');
  const body = wiersze.map(sid=>{
    const sur = store.surowce[sid];
    return `<tr>
      <td class="lipka"><span class="nazwaS" title="${esc(sur?.nazwa||'?')}">${esc(sur?.nazwa||'?')}</span></td>
      ${pozycje.map(p=>{
        const kgTot = p.skl[sid]||0;
        if(kgTot<=0.001) return '<td class="num">—</td>';
        const kgSzt = kgTot/(p.sztuk||1);
        return `<td class="num" title="${fmt(kgTot,1)} kg na sektor">${fmt(kgSzt,2)}</td>`;
      }).join('')}
    </tr>`;
  }).join('');
  const sumy = pozycje.map(p=>`<td class="num">${fmt(p.sztuk>0?p.kg/p.sztuk:0,2)}</td>`).join('');
  return `<div class="macierz" style="max-height:none" ${opcje.id?`id="${opcje.id}"`:''}>
    <table>
      <thead><tr><th class="lipka">Surowiec</th>${naglowki}</tr></thead>
      <tbody>${body}
        <tr class="suma-wiersz"><td class="lipka">Razem kg/szt</td>${sumy}</tr>
      </tbody>
    </table>
  </div>`;
}

/* ===================== ZAKŁADKA: MIESZALNIA =============================== */
let mixRozwiniete = new Set();
let mixZakladka = 'receptury';

function kosztMieszanki(m){
  return (m.skladniki||[]).reduce((s,sk)=>{
    const sur=store.surowce[sk.surowiecId];
    return s + (sk.procent/100)*((sur?.cenaTona||0)/1000);
  },0);
}

function renderMieszalnia(w){
  const edycja = mozeEdytowac('mieszalnia');
  const mieszanki = Object.values(store.mieszanki).sort((a,b)=>(a.nazwa||'').localeCompare(b.nazwa||'','pl'));
  const produkcje = Object.values(store.produkcja).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  w.innerHTML = `
  <div class="panel">
    <div class="panel-tyt">Mieszalnia <span class="licznik">${mieszanki.length} receptur</span><span style="flex:1"></span>
      ${mixZakladka==='receptury'?przyciskEksportu('#tabReceptury','receptury_mieszanek','Receptury mieszanek'):''}
      ${edycja?'<button class="btn maly" id="btnNowaMix">+ Receptura</button>':''}
    </div>
    <div class="pasek">
      <button class="btn ${mixZakladka==='receptury'?'':'szary'} maly" data-mz="receptury">Receptury</button>
      <button class="btn ${mixZakladka==='produkcja'?'':'szary'} maly" data-mz="produkcja">Produkuj parti\u0119</button>
      <button class="btn ${mixZakladka==='historia'?'':'szary'} maly" data-mz="historia">Historia (${produkcje.length})</button>
    </div>
    <div id="mixTresc"></div>
  </div>`;
  w.querySelectorAll('[data-mz]').forEach(b=>b.onclick=()=>{mixZakladka=b.dataset.mz;renderMieszalnia(w);});
  if(edycja){const b=w.querySelector('#btnNowaMix');if(b)b.onclick=()=>oknoMix();}
  const tresc=w.querySelector('#mixTresc');
  if(mixZakladka==='receptury') renderMixReceptury(tresc,mieszanki,edycja);
  else if(mixZakladka==='produkcja') renderMixProdukcja(tresc,mieszanki);
  else renderMixHistoria(tresc,produkcje);
}

    const rozw=mixRozwiniete.has(m.id);
    const koszt=kosztMieszanki(m);

      <div class="mix-karta-tyt" data-rozmix2="${m.id}">
        <span>${rozw?'\u25be':'\u25b8'}</span><b>${esc(m.nazwa)}</b>
        <span class="koszt">${fmt(koszt*1000,2)} z\u0142/t \u00b7 ${fmt(koszt,4)} z\u0142/kg</span>
        ${edycja?`<button class="ikonka" data-edmix="${m.id}" title="Edytuj">\u270e</button><button class="ikonka usun" data-usunmix="${m.id}" title="Usu\u0144">\u2715</button>`:''}
      </div>
      ${rozw?`<div class="mix-tresc"><table>
        <thead><tr><th>Sk\u0142adnik</th><th class="num">%</th><th class="num">kg/t</th><th class="num">z\u0142/t sk\u0142adnika</th></tr></thead>
        <tbody>${(m.skladniki||[]).map(sk=>{
          const sur=store.surowce[sk.surowiecId];
          return `<tr><td>${esc(sur?.nazwa||'?')}</td><td class="num">${fmt(sk.procent,1)}</td><td class="num">${fmt(sk.procent*10,1)}</td><td class="num">${fmt((sk.procent/100)*(sur?.cenaTona||0),2)}</td></tr>`;
        }).join('')}
        <tr style="font-weight:700"><td>SUMA</td><td class="num">${fmt((m.skladniki||[]).reduce((s,x)=>s+x.procent,0),1)}</td><td class="num">${fmt((m.skladniki||[]).reduce((s,x)=>s+x.procent*10,0),0)}</td><td class="num">${fmt(koszt*1000,2)}</td></tr>
        </tbody></table></div>`:''}
    </div>`;
  }).join('')||'<div class="pusto">Brak receptur.</div>';

  // Zbiorcza tabela wszystkich receptur — źródło dla eksportu i wydruku
  if(mieszanki.length){
    const uzyte=new Set();
    mieszanki.forEach(m=>(m.skladniki||[]).forEach(s=>uzyte.add(s.surowiecId)));
    const surList=[...uzyte].map(id=>store.surowce[id]).filter(Boolean)
      .sort((a,b)=>(a.nazwa||'').localeCompare(b.nazwa||'','pl'));
    el.innerHTML += `
    <div class="panel-tyt" style="border-top:8px solid var(--tlo)">Zestawienie receptur <span class="licznik">udzia\u0142y %</span></div>
    <div class="macierz" style="max-height:none" id="tabReceptury"><table>
      <thead><tr><th class="lipka">Sk\u0142adnik</th>
        ${mieszanki.map(m=>`<th><span class="nazwa-kol" title="${esc(m.nazwa)}">${esc(m.nazwa)}</span></th>`).join('')}
      </tr></thead>
      <tbody>
        ${surList.map(s=>`<tr><td class="lipka"><span class="nazwaS">${esc(s.nazwa)}</span></td>
          ${mieszanki.map(m=>{
            const sk=(m.skladniki||[]).find(x=>x.surowiecId===s.id);
            return `<td class="num">${sk?fmt(sk.procent,1):'\u2014'}</td>`;
          }).join('')}</tr>`).join('')}
        <tr class="suma-wiersz"><td class="lipka">Suma %</td>
          ${mieszanki.map(m=>{
            const suma=(m.skladniki||[]).reduce((a,x)=>a+x.procent,0);
            return `<td class="num" ${Math.abs(suma-100)>0.5?'style="color:var(--czerwony)"':''}>${fmt(suma,1)}</td>`;
          }).join('')}</tr>
        <tr class="koszt-wiersz"><td class="lipka">Koszt z\u0142/t</td>
          ${mieszanki.map(m=>`<td class="num">${fmt(kosztMieszanki(m)*1000,2)}</td>`).join('')}</tr>
      </tbody>
    </table></div>`;
  }

  el.querySelectorAll('[data-rozmix2]').forEach(b=>{b.onclick=e=>{if(e.target.closest('[data-edmix],[data-usunmix]'))return;const id=b.dataset.rozmix2;mixRozwiniete.has(id)?mixRozwiniete.delete(id):mixRozwiniete.add(id);renderMieszalnia(document.getElementById('widok'));};});
  el.querySelectorAll('[data-edmix]').forEach(b=>b.onclick=e=>{e.stopPropagation();oknoMix(b.dataset.edmix);});
  el.querySelectorAll('[data-usunmix]').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=store.mieszanki[b.dataset.usunmix];potwierdz('Usun\u0105\u0107 receptur\u0119?',`\u201e${esc(m?.nazwa)}\u201d`,()=>{DB.usun('mieszanki',b.dataset.usunmix);toast('Usuni\u0119to.');},'Usu\u0144');});

    <div class="pole-grupa"><label>Lokalizacja przeznaczenia</label>
      <select id="mpLok"><option value="obie">Obie lokalizacje</option><option value="nadarzyn">Nadarzyn</option><option value="boguszyn">Boguszyn</option></select>
    </div>

function renderMixHistoria(el,produkcje){
  if(!produkcje.length){el.innerHTML='<div class="pusto">Brak historii produkcji.</div>';return;}

}

/* ===================== ZAKŁADKA: RAPORTY ================================= */
let rapZakladka = 'kalendarz';
let rapLok = null;
let rapData = null;
let rapMiesiac = null;
let rapOdDo = null;

/* Dawki, mieszalnia i snapshoty są wspólne dla gospodarstwa — selektor lokalizacji
   w tych podzakładkach sugerowałby nieprawdę. */
function zalezyOdLokalizacji(pz){
  return ['kalendarz','historia','miesiac','zuzycie'].includes(pz);
}
function lokDostepne(){
  return (ROLE[rolaAkt]?.lokalizacje||[]).filter(l=>l==='nadarzyn'||l==='boguszyn');
}
function mozeWpisDnia(lok){
  return (ROLE[rolaAkt]?.lokalizacje||[]).includes(lok) && rolaAkt!=='mieszalnia';
}
function idDnia(lok,data){ return lok+'_'+data; }
function dokDnia(lok,data){ return store.zywienie[idDnia(lok,data)] || null; }
function dataPlus(iso,dni){ return dataMinus(iso,-dni); }
function dataMinus(iso,dni){
  const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()-dni);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function biezacyMiesiac(){ return dzisiaj().slice(0,7); }

/* Zapis pojedynczej pozycji dnia. Koszt zamrażamy w chwili wpisu. */
async function zapiszDzien(lok, data, grupaId, pola){
  const id = idDnia(lok,data);
  const stary = store.zywienie[id] || {lokalizacja:lok, data, grupy:{}};
  const gr = store.grupyTech[grupaId];
  const grupy = {...(stary.grupy||{})};
  const poprz = grupy[grupaId] || {};
  // Dzień POTWIERDZONY (wpisano kg) ma dane zamrożone. Niepotwierdzony przelicza się
  // z aktualnie obowiązującej wersji dawek — zgodnie z ustaleniem "od dziś" działa dziś.
  const potwierdzony = poprz.zadaneKg!=null || pola.zadaneKg!=null;
  let baza = {};
  if(gr && (!potwierdzony || poprz.dawkaWyliczonaKgSzt==null)){
    const o = obliczGrupe(gr);
    baza = {
      dawkaWyliczonaKgSzt: Math.round(o.kgSzt*1000)/1000,
      kosztKgTMR: o.kgSzt>0 ? Math.round((o.kosztSzt/o.kgSzt)*10000)/10000 : 0,
      nazwaGrupy: gr.nazwa,
      skladniki: o.skladniki,
      udzialy: (gr.dawki||[]).map(d=>({dawkaId:d.dawkaId, udzial:d.udzial}))  // zamrożone udziały
    };
  }
  // Liczba sztuk MUSI być zapisana — bez niej raporty liczą zadane = dawka × 0 i wiersz znika
  if(gr && poprz.sztuk==null && pola.sztuk==null) baza.sztuk = gr.sztuk||0;
  grupy[grupaId] = {...poprz, ...baza, ...pola, autor:ROLE[rolaAkt]?.nazwa||'?', ts:Date.now()};
  await DB.zapisz('zywienie', id, {lokalizacja:lok, data, grupy});
}

function odchylenieKolor(proc){
  const a=Math.abs(proc);
  if(a<=3) return 'var(--zielony-ok)';
  if(a<=10) return 'var(--zolty)';
  return 'var(--czerwony)';
}

function csvPobierz(nazwa, wiersze){
  const tresc = wiersze.map(r=>r.map(k=>{
    const s=String(k??'').replace(/"/g,'""');
    return /[;\n"]/.test(s) ? '"'+s+'"' : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\ufeff'+tresc], {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=nazwa+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Pobrano '+nazwa+'.csv');
}

function renderRaporty(w){
  const loki = lokDostepne();
  if(!rapLok || !loki.includes(rapLok)) rapLok = loki[0]||'nadarzyn';
  if(!rapData) rapData = dzisiaj();
  if(!rapMiesiac) rapMiesiac = biezacyMiesiac();
  if(!rapOdDo) rapOdDo = {od:dataMinus(dzisiaj(),30), do:dzisiaj()};

  const podz = [
    {id:'kalendarz',txt:'\ud83d\udcc5 Kalendarz'},
    {id:'zmiany',   txt:'Zmiany dawek'},
    {id:'historia', txt:'Historia \u017cywienia'},
    {id:'miesiac',  txt:'Zestawienie miesi\u0119czne'},
    {id:'zuzycie',  txt:'Zu\u017cycie surowc\u00f3w'},
    {id:'produkcja',txt:'Produkcja mieszalni'}
  ];

  w.innerHTML = `
  <div class="panel">
    <div class="panel-tyt">Raporty<span style="flex:1"></span>
      ${!zalezyOdLokalizacji(rapZakladka) ? '<span class="podpis">dane wsp\u00f3lne dla obu lokalizacji</span>'
        : (loki.length>1?`<select id="rapLokSel" style="padding:6px 10px;border:1.5px solid var(--linia);border-radius:8px">
        ${loki.map(l=>`<option value="${l}" ${l===rapLok?'selected':''}>${l==='nadarzyn'?'Nadarzyn':'Boguszyn'}</option>`).join('')}
      </select>`:`<span class="plakietka">${rapLok==='nadarzyn'?'Nadarzyn':'Boguszyn'}</span>`)}
    </div>
    <div class="pasek">
      ${podz.map(p=>`<button class="btn ${rapZakladka===p.id?'':'szary'} maly" data-rz="${p.id}">${p.txt}</button>`).join('')}
    </div>
    <div id="rapTresc"></div>
  </div>`;

  const sel=w.querySelector('#rapLokSel');
  if(sel) sel.onchange=()=>{rapLok=sel.value; renderRaporty(w);};
  w.querySelectorAll('[data-rz]').forEach(b=>b.onclick=()=>{rapZakladka=b.dataset.rz; renderRaporty(w);});

  const t=w.querySelector('#rapTresc');
  if(rapZakladka==='kalendarz') rapKalendarz(t);
  else if(rapZakladka==='zmiany') rapZmiany(t);
  else if(rapZakladka==='historia') rapHistoria(t);
  else if(rapZakladka==='miesiac') rapMiesiacWidok(t);
  else if(rapZakladka==='zuzycie') rapZuzycie(t);
  else rapProdukcja(t);
}

/* ---------- Kalendarz: cofnij się do dowolnego dnia ---------- */
let kalMiesiac = null;
let kalWybranyDzien = null;

function rapKalendarz(el){
  if(!kalMiesiac) kalMiesiac = biezacyMiesiac();
  const [rok,mies] = kalMiesiac.split('-').map(Number);
  const pierwszy = new Date(rok, mies-1, 1);
  const ostatni  = new Date(rok, mies, 0).getDate();
  let dzienTyg = pierwszy.getDay(); dzienTyg = dzienTyg===0 ? 6 : dzienTyg-1;   // pon=0

  // Które dni mają dane
  const maDane = {};
  Object.values(store.zywienie).filter(d=>d.lokalizacja===rapLok).forEach(d=>{
    if(!(d.data||'').startsWith(kalMiesiac)) return;
    const grupy = Object.values(d.grupy||{});
    const potw = grupy.filter(g=>g.zadaneKg!=null).length;
    maDane[d.data] = {ile:grupy.length, potw};
  });
  const maSnap = {};
  Object.values(store.snapshoty).forEach(s=>{ if((s.data||'').startsWith(kalMiesiac)) maSnap[s.data]=true; });

  let komorki = '';
  for(let i=0;i<dzienTyg;i++) komorki += '<div class="kal-pusta"></div>';
  for(let d=1; d<=ostatni; d++){
    const iso = `${rok}-${String(mies).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const info = maDane[iso];
    const dzis = iso===dzisiaj();
    const wybr = iso===kalWybranyDzien;
    const przyszly = iso>dzisiaj();
    komorki += `<div class="kal-dzien ${info?'ma':''} ${dzis?'dzis':''} ${wybr?'wybr':''} ${przyszly?'przyszly':''}" ${przyszly?'':`data-kal="${iso}"`}>
      <span class="kal-nr">${d}</span>
      ${info?`<span class="kal-kropki">${info.potw?'<b title="dni potwierdzone">●</b>':''}${info.ile>info.potw?'<i title="wg planu">○</i>':''}</span>`:''}
      ${maSnap[iso]?'<span class="kal-snap" title="Zapisano wersję dawek">✎</span>':''}
    </div>`;
  }

  el.innerHTML = `
  <div style="padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--linia)">
    <button class="btn szary maly" id="kalPrev">‹</button>
    <b style="min-width:150px;text-align:center">${['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'][mies-1]} ${rok}</b>
    <button class="btn szary maly" id="kalNext">›</button>
    <span style="flex:1"></span>
    <span class="podpis">● potwierdzone · ○ wg planu · ✎ zmiana dawek</span>
  </div>
  <div class="kal-siatka">
    ${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(x=>`<div class="kal-nag">${x}</div>`).join('')}
    ${komorki}
  </div>
  <div id="kalSzczegoly"></div>`;

  el.querySelector('#kalPrev').onclick=()=>{
    const d=new Date(rok,mies-2,1); kalMiesiac=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    kalWybranyDzien=null; renderRaporty(document.getElementById('widok'));
  };
  el.querySelector('#kalNext').onclick=()=>{
    const d=new Date(rok,mies,1); kalMiesiac=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    kalWybranyDzien=null; renderRaporty(document.getElementById('widok'));
  };
  el.querySelectorAll('[data-kal]').forEach(c=>{
    c.onclick=()=>{ kalWybranyDzien = (kalWybranyDzien===c.dataset.kal) ? null : c.dataset.kal;
      renderRaporty(document.getElementById('widok')); };
  });

  if(kalWybranyDzien) rysujDzienSzczegoly(el.querySelector('#kalSzczegoly'), kalWybranyDzien);
}

/* Pełny raport wybranego dnia — dane zamrożone z tamtego dnia, nie przeliczane na dziś */
function rysujDzienSzczegoly(el, dataISO){
  const dok = dokDnia(rapLok, dataISO);
  const snap = store.snapshoty['snap_'+dataISO];
  if(!dok){
    el.innerHTML = `<div class="pusto">Brak zapisu żywienia za ${dataPL(dataISO)} w lokalizacji ${rapLok==='nadarzyn'?'Nadarzyn':'Boguszyn'}.</div>`;
    return;
  }
  const poz = Object.entries(dok.grupy||{}).map(([gid,z])=>{
    const gr = store.grupyTech[gid];
    const potw = z.zadaneKg!=null;
    const wylicz = z.dawkaWyliczonaKgSzt||0;
    const planKg = wylicz*(z.sztuk||0);
    const zadEff = potw ? z.zadaneKg : planKg;
    const odzysk = z.niedojadyDodaneKg||0;
    const swiezy = Math.max(0, zadEff-odzysk);
    const pobr = (z.sztuk>0) ? (zadEff-(z.niedojadyKg||0))/z.sztuk : 0;
    const koszt = swiezy*(z.kosztKgTMR||0);
    return {gid, nazwa: gr?.nazwa||z.nazwaGrupy||'?', z, potw, wylicz, planKg, zadEff, odzysk, swiezy, pobr, koszt};
  }).filter(p=>p.zadEff>0);

  // Zużycie surowców tego dnia
  const zuz = {};
  poz.forEach(p=>{
    const skl = p.z.skladniki || [];
    const wsp = p.planKg>0 ? p.swiezy/p.planKg : 0;
    skl.forEach(sk=>{ zuz[sk.surowiecId]=(zuz[sk.surowiecId]||0)+sk.kg*(p.z.sztuk||0)*wsp; });
  });
  const sumKoszt = poz.reduce((s,p)=>s+p.koszt,0);
  const sumSzt = poz.reduce((s,p)=>s+(p.z.sztuk||0),0);

  el.innerHTML = `
  <div style="border-top:8px solid var(--tlo)">
    <div class="panel-tyt">Raport dnia ${dataPL(dataISO)} — ${rapLok==='nadarzyn'?'Nadarzyn':'Boguszyn'}
      <span class="licznik">${poz.length} grup · ${sumSzt} szt · ${fmt(sumKoszt,0)} zł</span>
      <span style="flex:1"></span>
      ${przyciskEksportu('#tabDzienKal','raport_dnia_'+rapLok+'_'+dataISO,'Raport dnia '+dataPL(dataISO)+' — '+(rapLok==='nadarzyn'?'Nadarzyn':'Boguszyn'))}
    </div>
    <div class="przewijak"><table class="gt-tabela" id="tabDzienKal">
      <thead><tr><th>Grupa</th><th class="num">Sztuk</th><th class="num">Dawka wylicz.<br>kg/szt</th>
      <th class="num">Odzysk<br>kg</th><th class="num">Świeży TMR<br>kg</th><th class="num">Podane<br>kg</th>
      <th class="num">Niedojady<br>kg</th><th class="num">Pobranie<br>kg/szt</th><th class="num">Koszt<br>zł</th></tr></thead>
      <tbody>
        ${poz.map(p=>`<tr>
          <td><b>${esc(p.nazwa)}</b>${p.potw?'':' <span class="plakietka auto">plan</span>'}</td>
          <td class="num">${p.z.sztuk||0}</td>
          <td class="num">${fmt(p.wylicz,1)}</td>
          <td class="num">${p.odzysk?'<span style="color:#7a5c00;font-weight:600">'+fmt(p.odzysk,0)+'</span>':'—'}</td>
          <td class="num">${fmt(p.swiezy,0)}</td>
          <td class="num">${fmt(p.zadEff,0)}</td>
          <td class="num">${p.z.niedojadyKg!=null?fmt(p.z.niedojadyKg,0):'—'}</td>
          <td class="num"><b>${fmt(p.pobr,1)}</b></td>
          <td class="num">${fmt(p.koszt,0)}</td>
        </tr>`).join('')}
        <tr class="suma"><td>SUMA</td><td class="num">${sumSzt}</td><td class="num"></td>
          <td class="num">${fmt(poz.reduce((s,p)=>s+p.odzysk,0),0)}</td>
          <td class="num">${fmt(poz.reduce((s,p)=>s+p.swiezy,0),0)}</td>
          <td class="num">${fmt(poz.reduce((s,p)=>s+p.zadEff,0),0)}</td>
          <td class="num">${fmt(poz.reduce((s,p)=>s+(p.z.niedojadyKg||0),0),0)}</td>
          <td class="num"></td><td class="num">${fmt(sumKoszt,0)} zł</td></tr>
      </tbody>
    </table></div>

    <div class="panel-tyt" style="border-top:1px solid var(--linia)">Zużycie surowców ${dataPL(dataISO)}</div>
    <div style="padding:10px 14px"><table class="gt-tabela" style="max-width:560px">
      <thead><tr><th>Surowiec</th><th class="num">kg</th><th class="num">t</th></tr></thead>
      <tbody>${Object.entries(zuz).sort((a,b)=>b[1]-a[1]).map(([sid,kg])=>{
        const sur=store.surowce[sid];
        return `<tr><td>${esc(sur?.nazwa||'?')}</td><td class="num">${fmt(kg,2)}</td><td class="num">${fmt(kg/1000,3)}</td></tr>`;
      }).join('')}</tbody>
    </table></div>

    ${snap ? `<div class="panel-tyt" style="border-top:1px solid var(--linia)">Dawki obowiązujące ${dataPL(dataISO)}
        <span class="licznik">stan zapisany tego dnia</span></div>
      <div class="przewijak"><table class="gt-tabela">
        <thead><tr><th>Grupa żywieniowa</th><th class="num">Całość kg/szt</th><th>Skład</th></tr></thead>
        <tbody>${Object.values(snap.dane||{}).sort((a,b)=>(a.kolejnosc??99)-(b.kolejnosc??99)).map(dw=>{
          const suma=(dw.skladniki||[]).reduce((s,x)=>s+x.kg,0);
          const skl=(dw.skladniki||[]).filter(x=>x.kg>0).sort((a,b)=>b.kg-a.kg)
            .map(x=>esc(store.surowce[x.surowiecId]?.nazwa||'?')+' '+fmt(x.kg,2)).join(' · ');
          return `<tr><td><b>${esc(dw.nazwa)}</b></td><td class="num">${fmt(suma,2)}</td><td class="podpis">${skl||'—'}</td></tr>`;
        }).join('')}</tbody>
      </table></div>`
    : '<div class="podpis" style="padding:12px 14px">Brak zapisanej wersji dawek z tego dnia — dawek wtedy nie zmieniano.</div>'}
  </div>`;

}

/* ---------- Zmiany dawek: stan aktualny + rejestr z historycznymi tabelami ---------- */
let zmianyRozwiniete = new Set();

/* Macierz dawek z dowolnego zestawu danych — używana i dla stanu bieżącego, i dla historii */
function macierzDawekHTML(dawkiObj, opcje){
  opcje = opcje||{};
  const dawki = Object.values(dawkiObj).sort((a,b)=>(a.kolejnosc??99)-(b.kolejnosc??99));
  if(!dawki.length) return '<div class="pusto">Brak danych.</div>';
  const uzyte = new Set();
  dawki.forEach(d=>(d.skladniki||[]).forEach(s=>{ if(s.kg>0) uzyte.add(s.surowiecId); }));
  const uklad = wierszeDawek();
  const wiersze = [...uklad.filter(id=>uzyte.has(id)), ...[...uzyte].filter(id=>!uklad.includes(id))];
  const kg = (d,sid)=>{ const s=(d.skladniki||[]).find(x=>x.surowiecId===sid); return s?s.kg:0; };
  const suma = d=>(d.skladniki||[]).reduce((s,x)=>s+x.kg,0);
  const koszt = d=>(d.skladniki||[]).reduce((s,x)=>{
    const sur=store.surowce[x.surowiecId]; return s+x.kg*((sur?.cenaTona||0)/1000);
  },0);

  return `<div class="macierz" style="max-height:none" ${opcje.id?`id="${opcje.id}"`:''}>
    <table>
      <thead><tr><th class="lipka">Surowiec</th>
        ${dawki.map(d=>`<th><span class="nazwa-kol" title="${esc(d.nazwa)}">${esc(d.nazwa)}</span>
          ${d.suchyTMR?'<span style="font-size:9px;opacity:.7;display:block">(suchy TMR)</span>':''}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${wiersze.map(sid=>{
          const sur=store.surowce[sid];
          return `<tr><td class="lipka"><span class="nazwaS" title="${esc(sur?.nazwa||'?')}">${esc(sur?.nazwa||'?')}</span></td>
          ${dawki.map(d=>{
            const v=kg(d,sid);
            const pod = opcje.podswietl && opcje.podswietl[d.id+'|'+sid];
            const tyt = pod ? `${pod.rola} \u00b7 ${dataPL(pod.data)} ${new Date(pod.ts).toTimeString().slice(0,5)} \u00b7 ${fmt(pod.stara,2)} \u2192 ${fmt(pod.nowa,2)} kg` : '';
            return `<td class="num" ${tyt?`title="${esc(tyt)}"`:''} ${pod?'style="color:var(--czerwony);font-weight:700"':''}>${v?fmt(v,2):'\u2014'}</td>`;
          }).join('')}</tr>`;
        }).join('')}
        <tr class="suma-wiersz"><td class="lipka">Ca\u0142o\u015b\u0107 kg/szt</td>
          ${dawki.map(d=>`<td class="num">${fmt(suma(d),2)}</td>`).join('')}</tr>
        <tr class="koszt-wiersz"><td class="lipka">Koszt z\u0142/szt/dob\u0119</td>
          ${dawki.map(d=>`<td class="num">${fmt(koszt(d),2)} z\u0142</td>`).join('')}</tr>
      </tbody>
    </table>
  </div>`;
}

function rapZmiany(el){
  const zmiany = Object.values(store.zmianyDawek).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const najnowszaData = zmiany.length ? zmiany[0].data : null;
  const ostatnia = {};
  zmiany.forEach(z=>{ const k=z.dawkaId+'|'+z.surowiecId; if(!ostatnia[k]) ostatnia[k]=z; });
  const podswietl = {};
  Object.entries(ostatnia).forEach(([k,z])=>{ if(najnowszaData && z.data===najnowszaData) podswietl[k]=z; });

  // Grupowanie rejestru po dniach
  const dni = {};
  zmiany.forEach(z=>{ (dni[z.data] ||= []).push(z); });
  const listaDni = Object.keys(dni).sort((a,b)=>b.localeCompare(a));
  const zapl = wersjeZaplanowane();

  el.innerHTML = `
  <div style="padding:12px 14px;border-bottom:1px solid var(--linia);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="podpis">Na <b style="color:var(--czerwony)">czerwono</b> warto\u015bci zmienione ostatniego dnia edycji${najnowszaData?' ('+dataPL(najnowszaData)+')':''}.</span>
    <span style="flex:1"></span>
    ${przyciskEksportu('#macierzZmiany','dawki_stan_'+dzisiaj(),'Dawki \u2014 stan na '+dataPL(dzisiaj()))}
    ${zmiany.length?przyciskEksportu('#tabRejestr','rejestr_zmian_dawek','Rejestr zmian dawek'):''}
  </div>
  ${zapl.length?`<div class="pasek-wersja przyszla">
    <b>\u23f3 Zaplanowane zmiany:</b> ${zapl.map(v=>dataPL(v.odData)).join(', ')}
    <span class="podpis">wejd\u0105 w \u017cycie automatycznie</span></div>`:''}

  ${macierzDawekHTML(store.dawki, {id:'macierzZmiany', podswietl})}

  <div class="panel-tyt" style="border-top:8px solid var(--tlo)">
    Rejestr edycji <span class="licznik">${zmiany.length} zmian w ${listaDni.length} dniach</span>
    <span style="flex:1"></span>
    <span class="podpis">kliknij dzie\u0144, \u017ceby zobaczy\u0107 pe\u0142n\u0105 tabel\u0119 dawek z tamtego dnia</span>
  </div>
  <table id="tabRejestr" style="display:none"><tbody>
    <tr><th>Data</th><th>Godzina</th><th>Rola</th><th>Grupa \u017cywieniowa</th><th>Surowiec</th><th>By\u0142o kg</th><th>Jest kg</th><th>Obowi\u0105zuje od</th></tr>
    ${zmiany.map(z=>{const g=new Date(z.ts);
      return `<tr><td>${dataPL(z.data)}</td><td>${String(g.getHours()).padStart(2,'0')}:${String(g.getMinutes()).padStart(2,'0')}</td>
      <td>${esc(z.rola)}</td><td>${esc(z.dawkaNazwa)}</td><td>${esc(z.surowiecNazwa)}</td>
      <td>${fmt(z.stara,2)}</td><td>${fmt(z.nowa,2)}</td><td>${dataPL(z.odData||z.data)}</td></tr>`;}).join('')}
  </tbody></table>
  <div id="rejestrDni">
  ${listaDni.length ? listaDni.map(d=>{
    const lista = dni[d];
    const rozw = zmianyRozwiniete.has(d);
    const role = [...new Set(lista.map(z=>z.rola))].join(', ');
    const dawkiZm = [...new Set(lista.map(z=>z.dawkaNazwa))];
    return `
    <div class="dzien-blok">
      <div class="dzien-nag ${rozw?'otwarty':''}" data-dzien="${d}">
        <span style="width:14px">${rozw?'\u25be':'\u25b8'}</span>
        <b class="data">${dataPL(d)}</b>
        <span class="plakietka">${esc(role)}</span>
        <span>${lista.length} ${lista.length===1?'zmiana':lista.length<5?'zmiany':'zmian'}</span>
        <span class="podpis">${esc(dawkiZm.slice(0,3).join(', '))}${dawkiZm.length>3?' +'+(dawkiZm.length-3):''}</span>
      </div>
      ${rozw?`<div class="dzien-tresc">
        ${lista.map(z=>{
          const g=new Date(z.ts);
          const kier = z.nowa>z.stara?'\u2191':'\u2193';
          const kol = z.nowa>z.stara?'var(--zielony-ok)':'var(--czerwony)';
          return `<div class="hist-row">
            <span class="podpis">${String(g.getHours()).padStart(2,'0')}:${String(g.getMinutes()).padStart(2,'0')}</span>
            <span class="plakietka">${esc(z.rola)}</span>
            <b>${esc(z.dawkaNazwa)}</b><span>${esc(z.surowiecNazwa)}</span>
            <span style="color:${kol};font-weight:700">${fmt(z.stara,2)} ${kier} ${fmt(z.nowa,2)} kg</span>
            ${z.odData && z.odData!==z.data ? `<span class="plakietka auto">obowi\u0105zuje od ${dataPL(z.odData)}</span>`:''}
          </div>`;
        }).join('')}
        <div class="panel-tyt" style="background:#fafcfa">Tabela dawek \u2014 stan na koniec ${dataPL(d)}
          <span style="flex:1"></span>
          ${przyciskEksportu('#macDzien'+d.replace(/-/g,''),'dawki_'+d,'Dawki \u2014 stan na '+dataPL(d))}
        </div>
        ${macierzDawekHTML(dawkiZDnia(d), {id:'macDzien'+d.replace(/-/g,'')})}
      </div>`:''}
    </div>`;
  }).join('') : '<div class="pusto">Brak zarejestrowanych zmian.</div>'}
  </div>`;

  el.querySelectorAll('[data-dzien]').forEach(b=>{
    b.onclick=()=>{
      const d=b.dataset.dzien;
      zmianyRozwiniete.has(d)?zmianyRozwiniete.delete(d):zmianyRozwiniete.add(d);
      renderRaporty(document.getElementById('widok'));
    };
  });
}

/* Dawki w stanie z końca danego dnia — wersja, snapshot albo stan bieżący */
function dawkiZDnia(data){
  const w = wersjeWgDaty().filter(x=>!x.zaplanowana && (x.odData||'')<=data);
  if(w.length && w[w.length-1].dawki) return w[w.length-1].dawki;
  const s = store.snapshoty['snap_'+data];
  if(s?.dane) return s.dane;
  return store.dawki;
}

/* ---------- Historia żywienia: macierz realnego składu z wybranego dnia ---------- */
