<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OHZ Lubiana — Żywienie</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14532d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Żywienie">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-64.png">
<style>
:root{
  --zielen:#14532d;
  --zielen-jasna:#1b6b3a;
  --zielen-bardzo-jasna:#e8f3ec;
  --akcent:#14532d;
  --nadarzyn:#0e6f8e;
  --boguszyn:#a8560c;
  --tlo:#f4f6f4;
  --karta:#ffffff;
  --tekst:#1c2420;
  --tekst-slaby:#55645b;
  --linia:#dde5df;
  --czerwony:#b3261e;
  --zolty:#a06a00;
  --zielony-ok:#1e7a3c;
  --cien:0 1px 3px rgba(0,0,0,.10), 0 4px 14px rgba(0,0,0,.05);
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--tlo);color:var(--tekst);font-size:15px;line-height:1.45;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
[hidden]{display:none !important}

/* ---------- SPLASH ---------- */
#splash{
  position:fixed;inset:0;z-index:100;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
}
#splash img{width:150px;height:150px;object-fit:contain}
#splash h1{margin:0;font-size:21px;letter-spacing:.02em;color:var(--zielen);text-align:center}
#splashStan{color:var(--tekst-slaby);font-size:13px;min-height:20px;text-align:center;max-width:460px}
.spinner{width:26px;height:26px;border:3px solid var(--zielen-bardzo-jasna);border-top-color:var(--zielen);border-radius:50%;animation:obrot .8s linear infinite}
@keyframes obrot{to{transform:rotate(360deg)}}
#splashBlad{color:var(--czerwony);font-size:13px;max-width:520px;text-align:left;background:#fdecea;border:1px solid #f5c6c2;border-radius:var(--r);padding:12px 14px;white-space:pre-wrap}

/* ---------- LOGOWANIE ---------- */
#logowanie{
  position:fixed;inset:0;z-index:90;background:var(--tlo);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.karta-log{
  background:#fff;border-radius:14px;box-shadow:var(--cien);padding:28px 24px;width:100%;max-width:390px;text-align:center;
}
.karta-log img{width:104px;height:104px;object-fit:contain;margin-bottom:6px}
.karta-log h2{margin:0 0 2px;font-size:19px;color:var(--zielen)}
.karta-log p.pod{margin:0 0 20px;color:var(--tekst-slaby);font-size:13px}
.karta-log input{
  width:100%;padding:13px 14px;border:1.5px solid var(--linia);border-radius:var(--r);
  font-size:17px;text-align:center;letter-spacing:.06em;background:#fff;
}
.karta-log input:focus{outline:none;border-color:var(--zielen-jasna)}
.karta-log button{
  width:100%;margin-top:12px;padding:13px;background:var(--zielen);color:#fff;
  border-radius:var(--r);font-size:16px;font-weight:600;
}
.karta-log button:active{background:var(--zielen-jasna)}
#blad-log{color:var(--czerwony);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- NAGŁÓWEK ---------- */
header{
  background:var(--akcent);color:#fff;padding:8px 12px;
  padding-top:calc(8px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;
  transition:background .18s;
}
header .tytul{display:flex;flex-direction:column;min-width:0;flex:1}
header .tytul b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tytul span{font-size:11.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ikony{display:flex;align-items:center;gap:2px}
header .ikony button{
  color:#fff;width:36px;height:36px;border-radius:8px;font-size:17px;
  display:flex;align-items:center;justify-content:center;
}
header .ikony button:active{background:rgba(255,255,255,.18)}
#sync{font-size:17px;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
#sync.zapis{animation:puls 1s ease-in-out infinite}
@keyframes puls{50%{opacity:.35}}
.baner{background:#fff4d6;color:#6b4c00;border-bottom:1px solid #f0dca6;padding:7px 12px;font-size:12.5px;text-align:center}

/* ---------- ZAKŁADKI ---------- */
nav{
  background:#fff;border-bottom:1px solid var(--linia);display:flex;overflow-x:auto;
  position:sticky;top:0;z-index:35;scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:12px 16px;font-size:14px;font-weight:600;color:var(--tekst-slaby);
  border-bottom:3px solid transparent;white-space:nowrap;flex:0 0 auto;
}
nav button.akt{color:var(--akcent);border-bottom-color:var(--akcent)}

main{padding:12px;padding-bottom:calc(28px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto}

/* ---------- ELEMENTY ---------- */
.panel{background:var(--karta);border-radius:var(--r);box-shadow:var(--cien);overflow:hidden;margin-bottom:12px}
.panel-tyt{padding:11px 14px;border-bottom:1px solid var(--linia);font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-tyt .licznik{color:var(--tekst-slaby);font-weight:400;font-size:12.5px}
.pasek{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--linia);background:#fbfcfb}
.pasek input[type=search],.pasek select{
  padding:9px 11px;border:1.5px solid var(--linia);border-radius:8px;background:#fff;min-width:0;
}
.pasek input[type=search]{flex:1 1 190px}
.pasek select{flex:0 1 210px}
.btn{
  padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;
  background:var(--akcent);color:#fff;display:inline-flex;align-items:center;gap:6px;
}
.btn:active{opacity:.85}
.btn.szary{background:#eceeed;color:var(--tekst)}
.btn.czerw{background:var(--czerwony);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.maly{padding:6px 10px;font-size:13px}

table{border-collapse:collapse;width:100%;font-size:14px}
.przewijak{overflow-x:auto;-webkit-overflow-scrolling:touch}
thead th{
  background:var(--zielen);color:#fff;font-weight:600;font-size:12.5px;text-align:left;
  padding:9px 10px;white-space:nowrap;position:sticky;top:0;z-index:2;
}
thead th.klik{cursor:pointer;user-select:none}
thead th.klik:hover{background:var(--zielen-jasna)}
tbody td{padding:5px 10px;border-bottom:1px solid var(--linia);vertical-align:middle}
tbody tr:nth-child(even) td{background:#fafcfa}
tbody tr.rozwiniety td{background:var(--zielen-bardzo-jasna)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.akcje{white-space:nowrap;text-align:right;width:1%}
.lipka{position:sticky;left:0;background:inherit;z-index:1}
thead th.lipka{background:var(--zielen);z-index:3}
tbody tr:nth-child(even) td.lipka{background:#fafcfa}
tbody tr:nth-child(odd) td.lipka{background:#fff}
tbody tr.rozwiniety td.lipka{background:var(--zielen-bardzo-jasna)}

input.pole{
  width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;
}
input.pole:hover{border-color:var(--linia);background:#fff}
input.pole:focus{outline:none;border-color:var(--zielen-jasna);background:#fff;box-shadow:0 0 0 2px rgba(27,107,58,.12)}
input.pole.num{text-align:right;font-variant-numeric:tabular-nums}
select.pole{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent}
select.pole:hover{border-color:var(--linia);background:#fff}
select.pole:focus{outline:none;border-color:var(--zielen-jasna);background:#fff}
.ikonka{width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--tekst-slaby)}
.ikonka:hover{background:#eef1ef}
.ikonka.usun:hover{background:#fdecea;color:var(--czerwony)}
.plakietka{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--zielen-bardzo-jasna);color:var(--zielen);white-space:nowrap}
.plakietka.mieszanka{background:#fff1d9;color:#8a5300}
.pusto{padding:36px 16px;text-align:center;color:var(--tekst-slaby);font-size:14px}
.podpis{color:var(--tekst-slaby);font-size:12px}
.skladPod{font-size:12.5px;color:var(--tekst-slaby);padding:2px 10px 8px 34px}
.skladPod table{width:auto;min-width:280px;font-size:12.5px}
.skladPod td{padding:2px 10px 2px 0;border:none;background:none !important}

/* ---------- MODAL ---------- */
#nakladka{position:fixed;inset:0;background:rgba(15,25,20,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column}
.modal h3{margin:0;padding:15px 18px;border-bottom:1px solid var(--linia);font-size:16px}
.modal .tresc{padding:16px 18px;overflow:auto}
.modal .stopka{padding:12px 18px;border-top:1px solid var(--linia);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pole-grupa{margin-bottom:14px}
.pole-grupa label{display:block;font-size:12.5px;font-weight:600;color:var(--tekst-slaby);margin-bottom:5px}
.pole-grupa input,.pole-grupa select{width:100%;padding:10px 12px;border:1.5px solid var(--linia);border-radius:8px;background:#fff}
.pole-grupa input:focus,.pole-grupa select:focus{outline:none;border-color:var(--zielen-jasna)}
.pole-grupa .hint{font-size:12px;color:var(--tekst-slaby);margin-top:4px}
.wiersz2{display:flex;gap:10px;flex-wrap:wrap}
.wiersz2>*{flex:1 1 160px}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:120;
  background:#22302a;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;box-shadow:var(--cien);
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
#toast.pokaz{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.blad{background:var(--czerwony)}

@media(max-width:640px){
  main{padding:8px}
  .pasek select{flex:1 1 100%}
  thead th,tbody td{padding-left:8px;padding-right:8px}
}

/* ---------- MACIERZ DAWEK ---------- */
.macierz{overflow:auto;max-height:calc(100vh - 220px);-webkit-overflow-scrolling:touch;position:relative}
.macierz table{min-width:800px}
.macierz thead th{position:sticky;top:0;z-index:4;padding:6px 4px;font-size:11.5px;text-align:center;min-width:90px;vertical-align:bottom}
.macierz thead th.lipka{z-index:6;min-width:180px;text-align:left;padding-left:10px}
.macierz thead th .nazwa-kol{writing-mode:horizontal-tb;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin:0 auto}
.macierz thead th .kol-akcje{display:flex;gap:2px;justify-content:center;margin-top:3px}
.macierz thead th .kol-akcje button{color:rgba(255,255,255,.7);font-size:11px;width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.macierz thead th .kol-akcje button:hover{color:#fff;background:rgba(255,255,255,.2)}
.macierz tbody td{padding:2px 3px}
.macierz tbody td.lipka{padding-left:6px;font-size:13px;white-space:nowrap}
.macierz tbody td.lipka .nazwaS{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.macierz input.komorka{
  width:80px;padding:4px 6px;border:1px solid transparent;border-radius:5px;
  background:transparent;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;
}
.macierz input.komorka:hover{border-color:var(--linia);background:#fff}
.macierz input.komorka:focus{outline:none;border-color:var(--zielen-jasna);background:#fff;box-shadow:0 0 0 2px rgba(27,107,58,.12)}
.macierz input.komorka.puste{color:var(--tekst-slaby)}
.macierz .suma-wiersz td{background:#d4edda !important;font-weight:700;font-size:13px;border-top:2px solid var(--zielen)}
.macierz .koszt-wiersz td{background:#f0faf3 !important;font-size:12px;color:var(--zielen);font-weight:600}
.macierz .strzalki{display:inline-flex;flex-direction:column;gap:0;vertical-align:middle;margin-right:3px}
.macierz .strzalki button{width:16px;height:13px;font-size:9px;line-height:1;color:var(--tekst-slaby);padding:0;display:flex;align-items:center;justify-content:center;border-radius:3px}
.macierz .strzalki button:hover{background:var(--zielen-bardzo-jasna);color:var(--zielen)}
.macierz .strzalki button:disabled{opacity:.2}
.macierz .mix-badge{font-size:10px;color:var(--zolty);cursor:pointer;margin-left:2px;vertical-align:middle}
.macierz .wiersz-rozw td{background:#fffdf0 !important;padding:2px 6px 6px 36px;font-size:12px;color:var(--tekst-slaby)}
.dawki-kart{display:none}
/* Na telefonie macierz zostaje — przewijana poziomo, tak jak na komputerze */
@media(max-width:720px){
  .macierz{max-height:calc(100vh - 190px)}
  .macierz thead th.lipka{min-width:130px}
  .macierz tbody td.lipka .nazwaS{max-width:100px;font-size:12px}
  .macierz input.komorka{width:64px;font-size:12px;padding:4px}
  .macierz thead th{min-width:74px;font-size:10.5px}
}

/* ---------- LOKALIZACJE (grupy technologiczne) ---------- */
.gt-tabela{width:100%;font-size:13.5px}
.gt-tabela th{text-align:left;padding:8px 10px;font-size:12px;color:#fff;background:var(--zielen)}
.gt-tabela th.num{text-align:right}          /* nagłówek NAD kolumną liczb, nie obok */
.gt-tabela td{padding:6px 10px;border-bottom:1px solid var(--linia);cursor:pointer;color:var(--tekst)}
.gt-tabela tr:hover td{background:var(--zielen-bardzo-jasna)}
.gt-tabela tr.podgrupa td{padding-left:30px}
.gt-tabela tr.podgrupa td:first-child::before{content:'↳ ';color:var(--tekst-slaby)}
.gt-tabela tr.suma td{background:#c3e6cb !important;font-weight:700;border-top:2px solid var(--zielen);cursor:default;color:#0f3d1f}
.gt-tabela .blad-udzial{color:var(--czerwony);font-size:11px;font-weight:700}
.gt-det{background:#fff;border:1px solid var(--zielen-jasna);border-radius:var(--r);margin:8px 0;padding:12px 14px}
.gt-det h4{margin:0 0 8px;font-size:13.5px;color:var(--zielen);font-weight:700}
.gt-det table{width:100%;font-size:12.5px;margin-bottom:10px}
/* Kontrast: jasne tło wymaga ciemnej czcionki — inaczej dziedziczy białą z globalnego thead */
.gt-det table th{text-align:left;padding:5px 8px;font-size:11.5px;background:#c3e6cb;color:#0f3d1f;font-weight:700;position:static}
.gt-det table th.num{text-align:right}
.gt-det table td{padding:3px 8px;border-bottom:1px solid var(--linia);color:var(--tekst)}
.gt-det table td.num{text-align:right;font-variant-numeric:tabular-nums}
.gt-det .wwozie{font-weight:700;color:#0f3d1f;background:#eaf6ee}
.gt-dawki-lista{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.gt-dawki-lista .chip{background:var(--zielen-bardzo-jasna);padding:3px 10px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:4px}
.gt-dawki-lista .chip b{color:var(--zielen)}
.zapot-panel{margin-top:12px}
.zapot-panel table{width:100%;max-width:500px;font-size:13px}
.zapot-panel th{text-align:left;padding:6px 8px;font-size:11.5px;color:#fff;background:var(--zielen)}
.zapot-panel th.num{text-align:right}
.zapot-panel td{padding:4px 8px;border-bottom:1px solid var(--linia)}

/* ---------- MIESZALNIA ---------- */
.mix-karta{background:var(--karta);border-radius:var(--r);box-shadow:var(--cien);margin-bottom:10px;overflow:hidden}
.mix-karta-tyt{padding:10px 14px;border-bottom:1px solid var(--linia);display:flex;align-items:center;gap:10px;cursor:pointer}
.mix-karta-tyt:hover{background:#fafcfa}
.mix-karta-tyt b{flex:1}
.mix-karta-tyt .koszt{font-size:13px;color:var(--zielen);font-weight:600}
.mix-tresc{padding:12px 14px;border-top:1px solid var(--linia)}
.mix-tresc table{width:100%;max-width:500px;font-size:13px}
.mix-tresc th{text-align:left;padding:5px 8px;font-size:11.5px;background:#c3e6cb;color:#0f3d1f;font-weight:700;position:static}
.mix-tresc th.num{text-align:right}
.mix-tresc td{padding:3px 8px;border-bottom:1px solid var(--linia)}
.hist-row{padding:8px 14px;border-bottom:1px solid var(--linia);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hist-row:nth-child(even){background:#fafcfa}
.hist-row .data{font-weight:600;min-width:80px}
</style>
</head>
<body>

<!-- ================= SPLASH ================= -->
<div id="splash">
  <img src="ikona-512.png" alt="OHZ Lubiana">
  <h1>OHZ Lubiana — Żywienie</h1>
  <div class="spinner" id="splashSpin"></div>
  <div id="splashStan">Uruchamianie…</div>
  <div id="splashBlad" hidden></div>
</div>

<!-- ================= LOGOWANIE ================= -->
<div id="logowanie" hidden>
  <div class="karta-log">
    <img src="ikona-512.png" alt="">
    <h2>OHZ Lubiana</h2>
    <p class="pod">Zarządzanie żywieniem — Nadarzyn i Boguszyn</p>
    <input type="password" id="haslo" placeholder="Hasło" autocomplete="current-password" inputmode="text">
    <button id="btnZaloguj">Zaloguj</button>
    <div id="blad-log"></div>
  </div>
</div>

<!-- ================= APLIKACJA ================= -->
<div id="app" hidden>
  <header>
    <div class="tytul">
      <b id="hNazwa">OHZ Lubiana</b>
      <span id="hRola">—</span>
    </div>
    <div class="ikony">
      <div id="sync" title="Stan synchronizacji">☁</div>
      <button id="btnInstaluj" title="Zainstaluj aplikację" hidden>📲</button>
      <button id="btnOdswiez" title="Odśwież">⟳</button>
      <button id="btnUstawienia" title="Ustawienia">⚙</button>
      <button id="btnBackup" title="Kopia zapasowa">⬇</button>
      <button id="btnInfo" title="Informacje">ⓘ</button>
      <button id="btnWyloguj" title="Wyloguj" style="width:auto;padding:0 10px;font-size:13px;font-weight:600">Wyloguj</button>
    </div>
  </header>
  <div class="baner" id="banerLokalny" hidden>TRYB LOKALNY — brak konfiguracji Firebase. Dane zapisują się tylko w tej przeglądarce.</div>
  <nav id="taby"></nav>
  <main id="widok"></main>
</div>

<div id="nakladka" hidden></div>
<div id="toast"></div>

<script type="module">
/* ==========================================================================

   Moduł 1: szkielet (PWA, Firebase, splash z preloadem haseł, logowanie, role)
   Moduł 2: Surowce

/* ############################################################

   ############################################################ */
const firebaseConfig = {
  apiKey:            "AIzaSyBCv1LW6i3tY2iHy-qbBFUku2ySSvE_KMo",
  authDomain:        "ohz-lubiana-po-app.firebaseapp.com",
  projectId:         "ohz-lubiana-po-app",
  storageBucket:     "ohz-lubiana-po-app.firebasestorage.app",
  messagingSenderId: "917831681958",
  appId:             "1:917831681958:web:2917b5917aa86fae217167"
};
/* ###############  KONIEC KONFIGURACJI  ##################### */

const WERSJA_APP = '1.0.0 (moduł 1–2)';
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

/* ===================== SHA-256 (czysty JS, bez zależności) ================= */
const SHA_K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
function sha256(txt){
  const dane=new TextEncoder().encode(txt);
  const bity=dane.length*8;
  const buf=new Uint8Array(((((dane.length+8)>>6)+1)<<6));
  buf.set(dane); buf[dane.length]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(buf.length-8, Math.floor(bity/4294967296), false);
  dv.setUint32(buf.length-4, bity>>>0, false);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w=new Uint32Array(64);
  for(let i=0;i<buf.length;i+=64){
    for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4,false);
    for(let t=16;t<64;t++){
      const s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^((~e)&g);
      const t1=(h+S1+ch+SHA_K[t]+w[t])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H=[(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

/* ===================== WARSTWA DANYCH ===================================== */
/* Jedno API dla dwóch trybów: Firestore (źródło prawdy) albo localStorage (tryb lokalny). */
const KOLEKCJE = ['config','surowce','dawki','mieszanki','produkcja','snapshoty','grupyTech','zywienie'];
const store = {config:{},surowce:{},dawki:{},mieszanki:{},produkcja:{},snapshoty:{},grupyTech:{},zywienie:{}};
const sluchacze = {};
const pierwszySnapshot = {}; // kol -> true po pierwszym snapshocie z Firestore
let FS = null;               // {db, funkcje...}
let trybLokalny = false;

const CACHE_KEY = k => 'ohz_cache_'+k;
const LOKAL_KEY = k => 'ohz_lokal_'+k;

function nasluchuj(kolekcja, cb){ (sluchacze[kolekcja] ||= []).push(cb); }
function powiadom(kolekcja){ (sluchacze[kolekcja]||[]).forEach(cb=>{try{cb()}catch(e){console.error(e)}}); }

function nowyId(){
  return (Date.now().toString(36) + Math.random().toString(36).slice(2,8));
}

const DB = {
  async zapisz(kolekcja, id, dane){
    id = id || nowyId();
    store[kolekcja][id] = {...(store[kolekcja][id]||{}), ...dane, id};
    powiadom(kolekcja);
    zapiszCache(kolekcja);
    if(trybLokalny){ zapiszLokal(kolekcja); return id; }
    stanSync('zapis');
    try{
      await FS.setDoc(FS.doc(FS.db, kolekcja, id), dane, {merge:true});
      stanSync('ok');
    }catch(e){ console.error(e); stanSync('blad'); toast('Błąd zapisu: '+e.message, true); }
    return id;
  },
  async usun(kolekcja, id){
    delete store[kolekcja][id];
    powiadom(kolekcja);
    zapiszCache(kolekcja);
    if(trybLokalny){ zapiszLokal(kolekcja); return; }
    stanSync('zapis');
    try{ await FS.deleteDoc(FS.doc(FS.db, kolekcja, id)); stanSync('ok'); }
    catch(e){ console.error(e); stanSync('blad'); toast('Błąd usuwania: '+e.message, true); }
  }
};

function zapiszCache(kolekcja){
  try{ localStorage.setItem(CACHE_KEY(kolekcja), JSON.stringify(store[kolekcja])); }catch(e){}
}
function czytajCache(kolekcja){
  try{ const s=localStorage.getItem(CACHE_KEY(kolekcja)); if(s) store[kolekcja]=JSON.parse(s); }catch(e){}
}
function zapiszLokal(kolekcja){
  try{ localStorage.setItem(LOKAL_KEY(kolekcja), JSON.stringify(store[kolekcja])); }catch(e){}
}
function czytajLokal(kolekcja){
  try{ const s=localStorage.getItem(LOKAL_KEY(kolekcja)); if(s) store[kolekcja]=JSON.parse(s); }catch(e){}
}

/* ===================== WSKAŹNIK SYNCHRONIZACJI ============================ */
let stanBiezacy='ok';
function stanSync(stan){
  stanBiezacy = stan;
  const el = document.getElementById('sync');
  if(!el) return;
  el.classList.remove('zapis');
  if(trybLokalny){ el.textContent='▤'; el.title='Tryb lokalny — dane tylko w tej przeglądarce'; return; }
  if(!navigator.onLine){ el.textContent='☁✕'; el.title='Offline — zmiany zapiszą się po odzyskaniu połączenia'; return; }
  if(stan==='zapis'){ el.textContent='☁↑'; el.title='Zapisywanie…'; el.classList.add('zapis'); return; }
  if(stan==='blad'){ el.textContent='☁!'; el.title='Błąd synchronizacji'; return; }
  if(stan==='cache'){ el.textContent='☁~'; el.title='Dane z pamięci podręcznej'; return; }
  el.textContent='☁✓'; el.title='Zsynchronizowano';
}
addEventListener('online', ()=>stanSync('ok'));
addEventListener('offline', ()=>stanSync('ok'));

function toast(txt, blad=false){
  const t=document.getElementById('toast');
  t.textContent=txt; t.classList.toggle('blad',blad); t.classList.add('pokaz');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('pokaz'), 2800);
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function liczba(v){ if(v===''||v==null) return 0; const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isNaN(n)?0:n; }
function fmt(n, dec=2){ return (Number(n)||0).toLocaleString('pl-PL',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function dzisiaj(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dataPL(iso){ if(!iso) return '—'; const [r,m,d]=iso.split('-'); return `${d}.${m}.${r}`; }

function modal({tytul, tresc, przyciski=[], szer}){
  const n=document.getElementById('nakladka');
  n.innerHTML = `<div class="modal" ${szer?`style="max-width:${szer}"`:''}>
      <h3>${esc(tytul)}</h3>
      <div class="tresc">${tresc}</div>
      <div class="stopka">${przyciski.map((p,i)=>`<button class="btn ${p.klasa||'szary'}" data-i="${i}">${esc(p.tekst)}</button>`).join('')}</div>
    </div>`;
  n.hidden=false;
  n.querySelectorAll('.stopka button').forEach(b=>{
    b.onclick=async()=>{ const p=przyciski[+b.dataset.i]; if(!p.akcja || (await p.akcja(n))!==false) zamknijModal(); };
  });
  n.onclick=e=>{ if(e.target===n) zamknijModal(); };
  return n;
}
function zamknijModal(){ const n=document.getElementById('nakladka'); n.hidden=true; n.innerHTML=''; }
function potwierdz(tytul, tekst, naTak, tekstTak='Usuń'){
  modal({tytul, tresc:`<div style="white-space:pre-wrap">${tekst}</div>`,
    przyciski:[{tekst:'Anuluj'},{tekst:tekstTak, klasa:'czerw', akcja:naTak}]});
}

/* ---------- Firebase ---------- */
async function polaczFirebase(){
  const [appM, fsM, authM] = await Promise.all([
    import(SDK+'firebase-app.js'),
    import(SDK+'firebase-firestore.js'),
    import(SDK+'firebase-auth.js')
  ]);
  const app = appM.initializeApp(firebaseConfig);

  let db;
  try{
    db = fsM.initializeFirestore(app, {
      localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})
    });
  }catch(e){ db = fsM.getFirestore(app); }

  FS = {db, ...fsM};

  // Logowanie anonimowe — reguły Firestore mogą wymagać request.auth != null
  const auth = authM.getAuth(app);
  try{ await authM.signInAnonymously(auth); }
  catch(e){ console.warn('Anonimowe logowanie nieudane:', e.message); }

  // Nasłuch na wszystkie kolekcje
  KOLEKCJE.forEach(kol=>{
    FS.onSnapshot(FS.collection(FS.db, kol),
      snap=>{
        const nowe={};
        snap.forEach(d=> nowe[d.id]={...d.data(), id:d.id});
        store[kol]=nowe;                 // Firestore nadpisuje cache — jest źródłem prawdy
        zapiszCache(kol);
        pierwszySnapshot[kol]=true;
        powiadom(kol);
        stanSync(snap.metadata.fromCache ? 'cache' : 'ok');
      },
      err=>{ console.error('onSnapshot '+kol, err); pierwszySnapshot[kol]=true; stanSync('blad'); }
    );
  });
}

/* Preload konfiguracji (hasła!) zanim pokaże się formularz logowania.
   To był błąd poprzedniej aplikacji: hasła ładowały się dopiero po zalogowaniu,
   więc zmiana hasła nie propagowała się na inne urządzenia. */
async function preloadConfig(){
  const start = Date.now();
  while(!pierwszySnapshot.config && Date.now()-start < 8000){
    await new Promise(r=>setTimeout(r,80));
  }
  if(!pierwszySnapshot.config) console.warn('Konfiguracja nie dotarła w 8 s — działam na pamięci podręcznej.');
}

/* ===================== LOGOWANIE ========================================== */
const inpHaslo = document.getElementById('haslo');
const bladLog  = document.getElementById('blad-log');
document.getElementById('btnZaloguj').onclick = probujZalogowac;
inpHaslo.onkeydown = e=>{ if(e.key==='Enter') probujZalogowac(); };

function probujZalogowac(){
  const h = inpHaslo.value.trim();
  if(!h){ bladLog.textContent='Podaj hasło.'; return; }
  const hasla = store.config.passwords?.hasla || {};
  const hash = sha256(h);
  const rola = Object.keys(hasla).find(r => hasla[r]===hash);
  if(!rola || !ROLE[rola]){ bladLog.textContent='Nieprawidłowe hasło.'; inpHaslo.value=''; return; }
  bladLog.textContent=''; inpHaslo.value='';
  zaloguj(rola);
}

function zapiszSesje(rola){
  try{ localStorage.setItem('ohz_sesja', JSON.stringify({rola, ts:Date.now()})); }catch(e){}
}
function wczytajSesje(){
  try{
    const s=JSON.parse(localStorage.getItem('ohz_sesja')||'null');
    if(!s || !ROLE[s.rola]) return null;
    if(Date.now()-s.ts > 30*24*3600*1000) return null;   // sesja ważna 30 dni
    return s.rola;
  }catch(e){ return null; }
}

function zaloguj(rola){
  rolaAkt = rola;
  zapiszSesje(rola);
  document.getElementById('logowanie').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('hNazwa').textContent = store.config.settings?.nazwaGospodarstwa || 'OHZ Lubiana';
  document.getElementById('hRola').textContent  = ROLE[rola].nazwa;
  zbudujTaby();
  stanSync(stanBiezacy);
}

function wyloguj(){
  try{ localStorage.removeItem('ohz_sesja'); }catch(e){}
  rolaAkt=null; zakladkaAkt=null;
  document.getElementById('app').hidden = true;
  document.getElementById('logowanie').hidden = false;
  inpHaslo.value=''; bladLog.textContent='';
}

/* ===================== NAWIGACJA ========================================== */
function poziom(zakl){ return ROLE[rolaAkt]?.zakl[zakl] || null; }
function mozeEdytowac(zakl){ return poziom(zakl)==='pelny'; }

function zbudujTaby(){
  const nav = document.getElementById('taby');
  const dostepne = ZAKLADKI.filter(z => poziom(z.id));
  nav.innerHTML = dostepne.map(z=>`<button data-z="${z.id}">${esc(z.etykieta)}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=> b.onclick=()=>przejdz(b.dataset.z));
  if(!dostepne.length){
    document.getElementById('widok').innerHTML='<div class="panel"><div class="pusto">Ta rola nie ma dostępu do żadnej zakładki.</div></div>';
    return;
  }
  przejdz(dostepne.some(z=>z.id===zakladkaAkt) ? zakladkaAkt : dostepne[0].id);
}

function przejdz(id){
  zakladkaAkt = id;
  document.querySelectorAll('#taby button').forEach(b=> b.classList.toggle('akt', b.dataset.z===id));
  const akcent = id==='nadarzyn' ? 'var(--nadarzyn)' : id==='boguszyn' ? 'var(--boguszyn)' : 'var(--zielen)';
  document.documentElement.style.setProperty('--akcent', akcent);
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.content = id==='nadarzyn' ? '#0e6f8e' : id==='boguszyn' ? '#a8560c' : '#14532d';
  document.getElementById('widok').scrollTop=0; window.scrollTo(0,0);
  render();
}

function render(){
  const w = document.getElementById('widok');
  if(zakladkaAkt==='surowce'){ renderSurowce(w); return; }
  if(zakladkaAkt==='dawki'){ renderDawki(w); return; }
  if(zakladkaAkt==='nadarzyn'){ renderLokalizacja(w,'nadarzyn'); return; }
  if(zakladkaAkt==='boguszyn'){ renderLokalizacja(w,'boguszyn'); return; }
  if(zakladkaAkt==='mieszalnia'){ renderMieszalnia(w); return; }
  if(zakladkaAkt==='raporty'){ renderRaporty(w); return; }
  w.innerHTML = `<div class="panel">
      <div class="panel-tyt">${esc(ZAKLADKI.find(z=>z.id===zakladkaAkt)?.etykieta||'')}</div>
      <div class="pusto">Moduł w przygotowaniu — zbudujemy go w kolejnym kroku.</div>
    </div>`;
}

let sSort = {pole:'kolejnosc', kier:1};
let sSzukaj = '';
let sKategoria = '';
let sRozwiniete = new Set();
let renderOdlozony = false;

function kategorie(){ return store.config.settings?.kategorie || KATEGORIE_START; }

function listaSurowcow(){
  let arr = Object.values(store.surowce);
  if(sSzukaj){
    const q = sSzukaj.toLowerCase();
    arr = arr.filter(s => (s.nazwa||'').toLowerCase().includes(q));
  }
  if(sKategoria) arr = arr.filter(s => s.kategoria===sKategoria);
  const p = sSort.pole, k = sSort.kier;
  arr.sort((a,b)=>{
    let x,y;
    if(p==='kolejnosc'){ x=a.kolejnosc??9999; y=b.kolejnosc??9999; }
    else if(p==='cena'){ x=a.cenaTona??0; y=b.cenaTona??0; }
    else { x=(a[p]||'').toString().toLowerCase(); y=(b[p]||'').toString().toLowerCase(); }
    if(x<y) return -1*k; if(x>y) return 1*k;
    return (a.nazwa||'').localeCompare(b.nazwa||'','pl');
  });
  return arr;
}

function uzycieSurowca(id){
  const wDawkach = Object.values(store.dawki).filter(d => (d.skladniki||[]).some(s=>s.surowiecId===id)).map(d=>d.nazwa||'dawka');
  const wMieszankach = Object.values(store.mieszanki).filter(m => (m.skladniki||[]).some(s=>s.surowiecId===id)).map(m=>m.nazwa||'mieszanka');
  return {wDawkach, wMieszankach, ile:wDawkach.length+wMieszankach.length};
}

    Mieszanki z Mieszalni pojawiają się tu automatycznie jako pojedynczy surowiec — strzałką ▸ rozwiniesz ich skład.
  </div>`;

  // filtry
  const inpSz = w.querySelector('#sSzukaj');
  inpSz.oninput = e=>{ sSzukaj=e.target.value; const poz=e.target.selectionStart; renderSurowce(w);
    const n=document.getElementById('sSzukaj'); n.focus(); n.setSelectionRange(poz,poz); };
  w.querySelector('#sKat').onchange = e=>{ sKategoria=e.target.value; renderSurowce(w); };
  w.querySelector('#btnSortWlasny').onclick = ()=>{ sSort={pole:'kolejnosc',kier:1}; renderSurowce(w); };
  w.querySelectorAll('th.klik').forEach(th=>{
    th.onclick = ()=>{
      const p=th.dataset.sort;
      sSort = (sSort.pole===p) ? {pole:p, kier:-sSort.kier} : {pole:p, kier:1};
      renderSurowce(w);
    };
  });
  const btnDod = w.querySelector('#btnDodajSur');
  if(btnDod) btnDod.onclick = oknoNowySurowiec;

  // wiersze
  w.querySelectorAll('[data-rozwin]').forEach(b=>{
    b.onclick=()=>{ const id=b.dataset.rozwin;
      sRozwiniete.has(id)?sRozwiniete.delete(id):sRozwiniete.add(id); renderSurowce(w); };
  });
  w.querySelectorAll('[data-pole]').forEach(el=>{
    el.onchange = ()=>{
      const {id, pole} = el.dataset;
      const s = store.surowce[id]; if(!s) return;
      if(pole==='nazwa'){
        const nowa = el.value.trim();
        if(!nowa){ el.value=s.nazwa; return; }
        const dubel = Object.values(store.surowce).find(x=>x.id!==id && (x.nazwa||'').toLowerCase()===nowa.toLowerCase());
        if(dubel){ toast('Surowiec o tej nazwie już istnieje.', true); el.value=s.nazwa; return; }
        DB.zapisz('surowce', id, {nazwa:nowa});
      }else if(pole==='kategoria'){
        DB.zapisz('surowce', id, {kategoria:el.value});
      }else if(pole==='cena'){
        const v = liczba(el.value);
        if(v<0){ toast('Cena nie może być ujemna.', true); el.value=fmt(s.cenaTona,2); return; }
        DB.zapisz('surowce', id, {cenaTona:v, dataCeny:dzisiaj()});
      }
    };
    el.onfocus = ()=>{ if(el.dataset.pole==='cena') el.value = el.dataset.raw||''; };
    el.onblur  = ()=>{ if(el.dataset.pole==='cena' && !renderOdlozony) el.value = fmt(liczba(el.value),2); };
  });
  w.querySelectorAll('[data-usun]').forEach(b=> b.onclick=()=>usunSurowiec(b.dataset.usun));
  w.querySelectorAll('[data-gora]').forEach(b=> b.onclick=()=>przesun(b.dataset.gora,-1));
  w.querySelectorAll('[data-dol]').forEach(b=> b.onclick=()=>przesun(b.dataset.dol,1));
}

function wierszSurowca(s, i, lista, edycja){
  const mieszanka = s.zMieszalni || s.kategoria==='Mieszanka własna';
  const rozw = sRozwiniete.has(s.id);
  const wlasna = sSort.pole==='kolejnosc';
  const zlKg = (s.cenaTona||0)/1000;
  let html = `
  <tr class="${rozw?'rozwiniety':''}">
    <td>${mieszanka?`<button class="ikonka" data-rozwin="${s.id}" title="Pokaż skład">${rozw?'▾':'▸'}</button>`:''}</td>
    <td class="lipka">
      ${edycja
        ? `<input class="pole" data-id="${s.id}" data-pole="nazwa" value="${esc(s.nazwa)}">`
        : esc(s.nazwa)}
    </td>
    <td>
      ${edycja
        ? `<select class="pole" data-id="${s.id}" data-pole="kategoria">
             ${kategorie().map(k=>`<option ${k===s.kategoria?'selected':''}>${esc(k)}</option>`).join('')}
           </select>`
        : `<span class="plakietka ${mieszanka?'mieszanka':''}">${esc(s.kategoria||'—')}</span>`}
    </td>
    <td class="num">
      ${edycja && !s.zMieszalni
        ? `<input class="pole num" data-id="${s.id}" data-pole="cena" data-raw="${s.cenaTona??''}" value="${fmt(s.cenaTona,2)}" inputmode="decimal">`
        : fmt(s.cenaTona,2)}
    </td>
    <td class="num">${fmt(zlKg,4)}</td>
    <td>${dataPL(s.dataCeny)}</td>
    ${edycja?`<td class="akcje">
        ${wlasna?`<button class="ikonka" data-gora="${s.id}" ${i===0?'disabled style="opacity:.25"':''} title="W górę">↑</button>
                  <button class="ikonka" data-dol="${s.id}" ${i===lista.length-1?'disabled style="opacity:.25"':''} title="W dół">↓</button>`:''}
        <button class="ikonka usun" data-usun="${s.id}" title="Usuń">✕</button>
      </td>`:''}
  </tr>`;

  if(mieszanka && rozw){
    const m = store.mieszanki[s.mieszankaId] || Object.values(store.mieszanki).find(x=>x.nazwa===s.nazwa);
    const kol = edycja?7:6;
    let tresc;
    if(m && (m.skladniki||[]).length){
      tresc = `<table>${(m.skladniki||[]).map(sk=>{
        const sur = store.surowce[sk.surowiecId];
        return `<tr><td>${esc(sur?.nazwa||'—')}</td><td class="num">${fmt(sk.procent ?? sk.udzial ?? 0,2)} %</td></tr>`;
      }).join('')}</table>`;
    }else{
      tresc = 'Skład pojawi się po zdefiniowaniu receptury w zakładce Mieszalnia.';
    }
    html += `<tr class="rozwiniety"><td colspan="${kol}"><div class="skladPod"><b>Skład mieszanki:</b><br>${tresc}</div></td></tr>`;
  }
  return html;
}

function przesun(id, kierunek){
  const lista = listaSurowcow();
  const i = lista.findIndex(s=>s.id===id);
  const j = i + kierunek;
  if(i<0 || j<0 || j>=lista.length) return;
  const a = lista[i], b = lista[j];
  const ka = a.kolejnosc ?? i, kb = b.kolejnosc ?? j;
  DB.zapisz('surowce', a.id, {kolejnosc:kb});
  DB.zapisz('surowce', b.id, {kolejnosc:ka});
}

function usunSurowiec(id){
  const s = store.surowce[id]; if(!s) return;
  const u = uzycieSurowca(id);
  let ostrz = '';
  if(u.ile){
    ostrz = `\n\n⚠ UWAGA — surowiec jest używany:\n`
      + (u.wDawkach.length?`• w dawkach: ${u.wDawkach.join(', ')}\n`:'')
      + (u.wMieszankach.length?`• w recepturach mieszanek: ${u.wMieszankach.join(', ')}\n`:'')
      + `\nPo usunięciu te pozycje stracą składnik i wyliczenia będą niepełne.`;
  }
  if(s.zMieszalni){
    ostrz += `\n\nTo mieszanka własna wygenerowana przez Mieszalnię. Usunięcie tutaj nie kasuje receptury — surowiec wróci po kolejnej produkcji.`;

  potwierdz('Usunąć surowiec?', `„${esc(s.nazwa)}”${ostrz}`, ()=>{ DB.usun('surowce', id); toast('Usunięto surowiec.'); });

/* ===================== ZAKŁADKA: DAWKI (macierz) ========================== */
let dRozwiniete = new Set();     // surowce z rozwiniętym składem mieszanki
let dRenderOdlozony = false;

function dawkiSorted(){
  return Object.values(store.dawki).sort((a,b)=>(a.kolejnosc??99)-(b.kolejnosc??99));
}

function wierszeDawek(){
  // Zbierz unikalne surowiecId ze wszystkich dawek, zachowaj globalną kolejność
  const map = new Map();
  for(const d of dawkiSorted()){
    for(const sk of (d.skladniki||[])){
      if(!map.has(sk.surowiecId)){
        map.set(sk.surowiecId, map.size);
      }
    }
  }
  // Sortuj po pozycji dodania (w przyszłości config/ukladDawki nadpisze)
  const uklad = store.config.ukladDawki?.wiersze;
  if(uklad && uklad.length){
    const ids = uklad.filter(id=>map.has(id) || store.surowce[id]);
    // Dodaj te, których brakuje w uładzie
    for(const id of map.keys()) if(!ids.includes(id)) ids.push(id);
    return ids;
  }
  return [...map.keys()];
}

function kgWDawce(dawka, surowiecId){
  const sk = (dawka.skladniki||[]).find(s=>s.surowiecId===surowiecId);
  return sk ? sk.kg : 0;
}

function sumaDawki(dawka){
  return (dawka.skladniki||[]).reduce((s,sk)=>s+sk.kg, 0);
}

function kosztDawki(dawka){
  return (dawka.skladniki||[]).reduce((s,sk)=>{
    const sur = store.surowce[sk.surowiecId];
    const cenaKg = (sur?.cenaTona||0)/1000;
    return s + sk.kg * cenaKg;
  }, 0);
}

function zapiszKomorke(dawkaId, surowiecId, wartoscStr){
  const dawka = store.dawki[dawkaId]; if(!dawka) return;
  const v = liczba(wartoscStr);
  let skladniki = [...(dawka.skladniki||[])];
  const i = skladniki.findIndex(s=>s.surowiecId===surowiecId);
  if(v > 0){
    if(i>=0) skladniki[i] = {...skladniki[i], kg:v};
    else skladniki.push({surowiecId, kg:v});
  } else {
    if(i>=0) skladniki.splice(i,1);
  }
  DB.zapisz('dawki', dawkaId, {skladniki});
  zaplanujSnapshot();
}

function zapiszUkladWierszy(wiersze){
  DB.zapisz('config','ukladDawki',{wiersze});
}

function renderDawki(w){
  const edycja = mozeEdytowac('dawki');

  const wiersze = wierszeDawek();

  if(dawki.length===0){
    w.innerHTML = `<div class="panel">

    </div>`;
    if(edycja) w.querySelector('#btnNowaDawka').onclick=()=>oknoDawka();
    return;
  }

  // --- MACIERZ (desktop) ---
  let thKols = dawki.map((d,ci)=>`
    <th>
      <span class="nazwa-kol" title="${esc(d.nazwa)}">${esc(d.nazwa)}</span>
      ${d.suchyTMR?'<span style="font-size:9px;opacity:.7;display:block">(suchy TMR)</span>':''}
      ${edycja?`<div class="kol-akcje">
        <button title="Edytuj" data-edkol="${d.id}">✎</button>
        <button title="Usuń" data-usunkol="${d.id}">✕</button>
      </div>`:''}
    </th>`).join('');

  let tbWiersze = wiersze.map((sid, ri)=>{
    const sur = store.surowce[sid];
    if(!sur) return '';
    const mieszanka = sur.zMieszalni || sur.kategoria==='Mieszanka własna';
    const rozw = dRozwiniete.has(sid);
    let komorki = dawki.map(d=>{
      const v = kgWDawce(d, sid);
      if(!edycja) return `<td class="num">${v?fmt(v,1):'—'}</td>`;
      return `<td><input class="komorka ${v?'':'puste'}" data-d="${d.id}" data-s="${sid}"
        value="${v?fmt(v,1):''}" placeholder="—" inputmode="decimal"></td>`;
    }).join('');

    let html = `<tr class="${rozw?'rozwiniety':''}">
      <td class="lipka">
        ${edycja?`<span class="strzalki">
          <button data-wgora="${sid}" ${ri===0?'disabled':''}>▲</button>
          <button data-wdol="${sid}" ${ri===wiersze.length-1?'disabled':''}>▼</button>
        </span>`:''}
        <span class="nazwaS" title="${esc(sur.nazwa)}">${esc(sur.nazwa)}</span>
        ${mieszanka?`<span class="mix-badge" data-rozmix="${sid}" title="Pokaż skład mieszanki">⊕</span>`:''}
        ${edycja?`<button class="ikonka usun" data-usunwiersz="${sid}" title="Usuń wiersz" style="float:right;width:22px;height:22px;font-size:12px">✕</button>`:''}
      </td>
      ${komorki}
    </tr>`;

    // Rozwinięty skład mieszanki
    if(mieszanka && rozw){
      const m = store.mieszanki[sur.mieszankaId] || Object.values(store.mieszanki).find(x=>x.nazwa===sur.nazwa);
      const cols = dawki.length+1;
      let tresc='Brak receptury.';
      if(m && (m.skladniki||[]).length){
        tresc = (m.skladniki||[]).map(sk=>{
          const s2=store.surowce[sk.surowiecId];
          return `${esc(s2?.nazwa||'?')} ${fmt(sk.procent,1)}%`;
        }).join(' · ');
      }
      html += `<tr class="wiersz-rozw"><td colspan="${cols}">↳ Skład: ${tresc}</td></tr>`;
    }
    return html;
  }).join('');

  // Wiersz sumy
  let sumyKomorki = dawki.map(d=>`<td class="num">${fmt(sumaDawki(d),1)}</td>`).join('');
  // Wiersz kosztu
  let kosztyKomorki = dawki.map(d=>`<td class="num">${fmt(kosztDawki(d),2)} zł</td>`).join('');

  w.innerHTML = `
  <div class="panel">
    <div class="panel-tyt">
      Dawki
      <span class="licznik">${dawki.length} grup żywieniowych · ${wiersze.length} surowców</span>
      <span style="flex:1"></span>
      ${edycja?`<button class="btn maly szary" id="btnDodWiersz">+ Surowiec</button>
                <button class="btn maly" id="btnNowaDawka">+ Grupa żywieniowa</button>`
              :'<span class="podpis">tryb podglądu</span>'}
    </div>
    <div class="macierz" id="macierzDawek">
      <table>
        <thead><tr><th class="lipka">Surowiec</th>${thKols}</tr></thead>
        <tbody>
          ${tbWiersze || '<tr><td colspan="'+(dawki.length+1)+'"><div class="pusto">Dodaj surowce przyciskiem „+ Surowiec".</div></td></tr>'}
          <tr class="suma-wiersz"><td class="lipka">Całość kg/szt</td>${sumyKomorki}</tr>
          <tr class="koszt-wiersz"><td class="lipka">Koszt zł/szt/dobę</td>${kosztyKomorki}</tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="podpis" style="padding:4px 4px 10px">
    Wartości w <b>kg świeżej masy / sztukę / dobę</b>. Koszty wyliczane z cen w zakładce Surowce (zł/t → zł/kg).
    ${edycja?'Kliknij ✎ w nagłówku kolumny, żeby zmienić nazwę grupy lub ✕ żeby ją usunąć.':''}
  </div>`;

  // --- PODPIĘCIA ---
  if(edycja){
    // Komórki
    w.querySelectorAll('.komorka').forEach(inp=>{
      inp.onfocus = ()=>{ const v=liczba(inp.value); inp.value = v||''; inp.classList.remove('puste'); };
      inp.onblur  = ()=>{
        const v=liczba(inp.value);
        inp.value = v ? fmt(v,1) : '';
        inp.classList.toggle('puste', !v);
        zapiszKomorke(inp.dataset.d, inp.dataset.s, inp.value);
        setTimeout(()=>{ if(!document.activeElement?.closest?.('#macierzDawek')) odswiezSumy(); }, 80);
      };
      inp.onkeydown = e=>{
        if(e.key==='Enter'){ inp.blur(); return; }
        if(e.key==='Tab'){
          // nawigacja Tab w macierzy
          e.preventDefault();
          const all = [...w.querySelectorAll('.komorka')];
          const idx = all.indexOf(inp);
          const next = e.shiftKey ? all[idx-1] : all[idx+1];
          if(next){ next.focus(); next.select(); }
        }
      };
    });
    // Strzałki wierszy
    w.querySelectorAll('[data-wgora]').forEach(b=> b.onclick=()=>przesunWiersz(b.dataset.wgora,-1));
    w.querySelectorAll('[data-wdol]').forEach(b=> b.onclick=()=>przesunWiersz(b.dataset.wdol,1));
    // Usuń wiersz
    w.querySelectorAll('[data-usunwiersz]').forEach(b=> b.onclick=()=>usunWiersz(b.dataset.usunwiersz));
    // Edytuj/usuń kolumnę
    w.querySelectorAll('[data-edkol]').forEach(b=> b.onclick=()=>oknoDawka(b.dataset.edkol));
    w.querySelectorAll('[data-usunkol]').forEach(b=> b.onclick=()=>usunDawke(b.dataset.usunkol));
    // + Surowiec
    const btnDW = w.querySelector('#btnDodWiersz');
    if(btnDW) btnDW.onclick = oknoDodajWiersz;
    // + Grupa
    const btnND = w.querySelector('#btnNowaDawka');
    if(btnND) btnND.onclick = ()=>oknoDawka();
  }
  // Rozwiń skład mieszanki
  w.querySelectorAll('[data-rozmix]').forEach(b=>{
    b.onclick=()=>{ const id=b.dataset.rozmix; dRozwiniete.has(id)?dRozwiniete.delete(id):dRozwiniete.add(id); renderDawki(w); };
  });
}

function odswiezSumy(){
  // Lekki re-render sum i kosztów bez przebudowy całej macierzy
  const dawki = dawkiSorted();
  const sumTds = document.querySelectorAll('.suma-wiersz td:not(.lipka)');
  const kosTds = document.querySelectorAll('.koszt-wiersz td:not(.lipka)');
  dawki.forEach((d,i)=>{
    if(sumTds[i]) sumTds[i].textContent = fmt(sumaDawki(d),1);
    if(kosTds[i]) kosTds[i].textContent = fmt(kosztDawki(d),2)+' zł';
  });
}

function przesunWiersz(sid, kier){
  const w = wierszeDawek();
  const i = w.indexOf(sid);
  const j = i+kier;
  if(i<0 || j<0 || j>=w.length) return;
  [w[i], w[j]] = [w[j], w[i]];
  zapiszUkladWierszy(w);
}

function usunWiersz(sid){
  const sur = store.surowce[sid];
  potwierdz('Usunąć wiersz?', `Surowiec „${esc(sur?.nazwa||'?')}" zostanie usunięty ze wszystkich dawek.\nSam surowiec pozostanie w zakładce Surowce.`,
    async ()=>{
      // Usuń z wszystkich dawek
      for(const d of Object.values(store.dawki)){
        const sk = (d.skladniki||[]).filter(s=>s.surowiecId!==sid);
        if(sk.length !== (d.skladniki||[]).length) await DB.zapisz('dawki', d.id, {skladniki:sk});
      }
      // Usuń z układu
      const w = wierszeDawek().filter(id=>id!==sid);
      zapiszUkladWierszy(w);
      toast('Usunięto wiersz z macierzy.');
    }, 'Usuń');
}

  const juzW = new Set(wierszeDawek());

  if(!dostepne.length){ toast('Wszystkie surowce są już w macierzy.'); return; }
  modal({
    tytul:'Dodaj surowiec do macierzy',
    tresc:`
      <div class="pole-grupa">
        <label>Surowiec</label>
        <select id="dwSur" size="${Math.min(dostepne.length,12)}" style="width:100%;padding:6px">
          ${dostepne.map(s=>`<option value="${s.id}">${esc(s.nazwa)} (${esc(s.kategoria||'')})</option>`).join('')}
        </select>
      </div>
      <div class="podpis">Surowiec pojawi się jako nowy wiersz we wszystkich kolumnach z wartością 0.</div>`,

/* ===================== ZAKŁADKI: NADARZYN / BOGUSZYN ====================== */
let gtRozwiniete = new Set();

function grupyLok(lok){
  return Object.values(store.grupyTech).filter(g=>g.lokalizacja===lok)
    .sort((a,b)=>(a.kolejnosc??99)-(b.kolejnosc??99));
}

function obliczGrupe(gr){
  const surMap = {};
  for(const pd of (gr.dawki||[])){
    const daw = store.dawki[pd.dawkaId]; if(!daw) continue;
    const u = (pd.udzial||0)/100;
    for(const sk of (daw.skladniki||[])){
      surMap[sk.surowiecId] = (surMap[sk.surowiecId]||0) + u * sk.kg;
    }
  }
  const skladniki = Object.entries(surMap).map(([id,kg])=>({surowiecId:id,kg:Math.round(kg*10000)/10000})).filter(s=>s.kg>0.0001);
  skladniki.sort((a,b)=>b.kg-a.kg);
  const kgSzt = skladniki.reduce((s,x)=>s+x.kg,0);
  const kgGrupa = (gr.sztuk||0)*kgSzt;
  const koszt = skladniki.reduce((s,x)=>{
    const sur=store.surowce[x.surowiecId]; return s + x.kg*((sur?.cenaTona||0)/1000);
  },0);
  const sumaUdzialow = (gr.dawki||[]).reduce((s,d)=>s+(d.udzial||0),0);
  return {skladniki, kgSzt, kgGrupa, kosztSzt:koszt, kosztGrupa:koszt*(gr.sztuk||0), sumaUdzialow};
}

function renderLokalizacja(w, lok){

    const naWoz  = (gr.naWozKg!=null && gr.naWozKg!=='') ? Number(gr.naWozKg) : null;
    const realKg = naWoz!=null ? naWoz : planKg;    // puste = auto (plan)

    const sur = store.surowce[sk.surowiecId];
    const kgSztReal = sk.kg*wsp;
    const kgGr = kgSztReal*(gr.sztuk||0);
    wWozie += kgGr;
    return `<tr><td>${esc(sur?.nazwa||'?')}</td><td class="num">${fmt(sk.kg,2)}</td><td class="num">${fmt(kgSztReal,2)}</td><td class="num">${fmt(kgGr,1)}</td><td class="num wwozie">${fmt(wWozie,1)}</td></tr>`;
  }).join('');
  return `<div class="gt-det">
    <h4>Karta za\u0142adunku \u2014 ${esc(gr.nazwa)} (${gr.sztuk||0} szt \u00b7 ${fmt(d.realKg,0)} kg TMR)</h4>

    <div class="podpis">Koszt: ${fmt(d.kosztSzt*wsp,2)} z\u0142/szt/dob\u0119 \u00b7 ${fmt(d.kosztSzt*wsp*(gr.sztuk||0),0)} z\u0142/grup\u0119/dob\u0119 \u00b7 realizacja ${fmt(d.proc,0)}%</div>

  else renderMixHistoria(tresc,produkcje);
}

function oknoMix(edId){
  const isEdit=!!edId; const m=isEdit?store.mieszanki[edId]:null;
  const surList=Object.values(store.surowce).filter(s=>!s.zMieszalni).sort((a,b)=>(a.nazwa||'').localeCompare(b.nazwa||'','pl'));
  let skladniki=isEdit?[...(m.skladniki||[])]:[];
  if(skladniki.length===0)skladniki.push({surowiecId:surList[0]?.id||'',procent:0});
  function renderSklad(){return skladniki.map((sk,i)=>`
    <div class="wiersz2" style="margin-bottom:4px;align-items:end">
      <div class="pole-grupa" style="margin:0;flex:2"><select data-si="${i}" data-pole="surowiecId">${surList.map(s=>`<option value="${s.id}" ${s.id===sk.surowiecId?'selected':''}>${esc(s.nazwa)}</option>`).join('')}</select></div>
      <div class="pole-grupa" style="margin:0;flex:1"><input data-si="${i}" data-pole="procent" type="number" value="${sk.procent||0}" min="0" max="100" step="0.1" style="width:70px" inputmode="decimal"></div>
      <button class="ikonka usun" data-usunsk="${i}" title="Usu\u0144">\u2715</button>
    </div>`).join('');}
  modal({tytul:isEdit?`Edytuj: ${m.nazwa}`:'Nowa receptura',szer:'620px',
    tresc:`<div class="pole-grupa"><label>Nazwa</label><input id="mxNazwa" value="${esc(m?.nazwa||'')}" autocomplete="off"></div>
      <hr style="border:none;border-top:1px solid var(--linia);margin:10px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-weight:600">Sk\u0142adniki (% masy)</span><span class="podpis" id="mxSuma">Suma: ${skladniki.reduce((s,x)=>s+x.procent,0)}%</span></div>
      <div id="mxSklad">${renderSklad()}</div>
      <button class="btn maly szary" id="mxDodSk" style="margin-top:4px">+ Sk\u0142adnik</button>`,
    przyciski:[{tekst:'Anuluj'},{tekst:isEdit?'Zapisz':'Dodaj',klasa:'',akcja:async(n)=>{
      const nazwa=n.querySelector('#mxNazwa').value.trim(); if(!nazwa){toast('Podaj nazw\u0119.',true);return false;}
      const sels=n.querySelectorAll('[data-pole="surowiecId"]');const inps=n.querySelectorAll('[data-pole="procent"]');const sk=[];
      sels.forEach((sel,i)=>{const p=liczba(inps[i]?.value);if(sel.value&&p>0)sk.push({surowiecId:sel.value,procent:p});});
      const kosztKg=sk.reduce((s,x)=>{const sur=store.surowce[x.surowiecId];return s+(x.procent/100)*((sur?.cenaTona||0)/1000);},0);
      if(isEdit){await DB.zapisz('mieszanki',edId,{nazwa,skladniki:sk,kosztKg:Math.round(kosztKg*10000)/10000});
        const surMix=Object.values(store.surowce).find(s=>s.mieszankaId===edId);if(surMix)await DB.zapisz('surowce',surMix.id,{nazwa,cenaTona:Math.round(kosztKg*1000*100)/100});
      }else{const newId=await DB.zapisz('mieszanki',null,{nazwa,skladniki:sk,kosztKg:Math.round(kosztKg*10000)/10000});
        await DB.zapisz('surowce',null,{nazwa,kategoria:'Mieszanka w\u0142asna',cenaTona:Math.round(kosztKg*1000*100)/100,dataCeny:dzisiaj(),kolejnosc:Object.keys(store.surowce).length+1,zMieszalni:true,mieszankaId:newId,lokalizacja:null});}
      toast('Zapisano receptur\u0119.');
    }}]});
  function odsw(){const k=document.getElementById('mxSklad');if(k)k.innerHTML=renderSklad();podepnij();
    const s=document.getElementById('mxSuma');if(s)s.textContent='Suma: '+skladniki.reduce((sum,x)=>sum+x.procent,0)+'%';}
  function podepnij(){const n=document.getElementById('nakladka');
    n.querySelectorAll('[data-pole="surowiecId"]').forEach(sel=>{sel.onchange=()=>{skladniki[+sel.dataset.si].surowiecId=sel.value;};});
    n.querySelectorAll('[data-pole="procent"]').forEach(inp=>{inp.onchange=()=>{skladniki[+inp.dataset.si].procent=liczba(inp.value);odsw();};});
    n.querySelectorAll('[data-usunsk]').forEach(b=>{b.onclick=()=>{skladniki.splice(+b.dataset.usunsk,1);odsw();};});}
  podepnij();document.getElementById('mxDodSk').onclick=()=>{skladniki.push({surowiecId:surList[0]?.id||'',procent:0});odsw();};
}


/* ===================== ZAKŁADKA: RAPORTY ================================= */
let rapZakladka = 'dzien';
let rapLok = null;
let rapData = null;
let rapMiesiac = null;
let rapOdDo = null;

function lokDostepne(){
  return (ROLE[rolaAkt]?.lokalizacje||[]).filter(l=>l==='nadarzyn'||l==='boguszyn');
}
function mozeWpisDnia(lok){
  return (ROLE[rolaAkt]?.lokalizacje||[]).includes(lok) && rolaAkt!=='mieszalnia';
}
function idDnia(lok,data){ return lok+'_'+data; }
function dokDnia(lok,data){ return store.zywienie[idDnia(lok,data)] || null; }
function dataMinus(iso,dni){
  const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()-dni);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function biezacyMiesiac(){ return dzisiaj().slice(0,7); }

/* Zapis pojedynczej pozycji dnia. Koszt zamrażamy w chwili wpisu. */
async function zapiszDzien(lok, data, grupaId, pola){
  const id = idDnia(lok,data);
  const stary = store.zywienie[id] || {lokalizacja:lok, data, grupy:{}};
  const gr = store.grupyTech[grupaId];
  const grupy = {...(stary.grupy||{})};
  const poprz = grupy[grupaId] || {};
  let baza = {};
  if(gr && poprz.dawkaWyliczonaKgSzt==null){
    const o = obliczGrupe(gr);
    baza = {
      dawkaWyliczonaKgSzt: Math.round(o.kgSzt*1000)/1000,
      kosztKgTMR: o.kgSzt>0 ? Math.round((o.kosztSzt/o.kgSzt)*10000)/10000 : 0,
      nazwaGrupy: gr.nazwa,
      skladniki: o.skladniki
    };
  }
  grupy[grupaId] = {...poprz, ...baza, ...pola, autor:ROLE[rolaAkt]?.nazwa||'?', ts:Date.now()};
  await DB.zapisz('zywienie', id, {lokalizacja:lok, data, grupy});
}

function odchylenieKolor(proc){
  const a=Math.abs(proc);
  if(a<=3) return 'var(--zielony-ok)';
  if(a<=10) return 'var(--zolty)';
  return 'var(--czerwony)';
}

function csvPobierz(nazwa, wiersze){
  const tresc = wiersze.map(r=>r.map(k=>{
    const s=String(k??'').replace(/"/g,'""');
    return /[;\n"]/.test(s) ? '"'+s+'"' : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\ufeff'+tresc], {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=nazwa+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Pobrano '+nazwa+'.csv');
}

function renderRaporty(w){
  const loki = lokDostepne();
  if(!rapLok || !loki.includes(rapLok)) rapLok = loki[0]||'nadarzyn';
  if(!rapData) rapData = dzisiaj();
  if(!rapMiesiac) rapMiesiac = biezacyMiesiac();
  if(!rapOdDo) rapOdDo = {od:dataMinus(dzisiaj(),30), do:dzisiaj()};

  const podz = [
    {id:'dzien',    txt:'Dzie\u0144 \u017cywienia'},
    {id:'historia', txt:'Historia \u017cywienia'},
    {id:'miesiac',  txt:'Zestawienie miesi\u0119czne'},
    {id:'zuzycie',  txt:'Zu\u017cycie surowc\u00f3w'},
    {id:'produkcja',txt:'Produkcja mieszalni'},
    {id:'snapshoty',txt:'Historia dawek'}
  ];

  w.innerHTML = `
  <div class="panel">
    <div class="panel-tyt">Raporty<span style="flex:1"></span>
      ${loki.length>1?`<select id="rapLokSel" style="padding:6px 10px;border:1.5px solid var(--linia);border-radius:8px">
        ${loki.map(l=>`<option value="${l}" ${l===rapLok?'selected':''}>${l==='nadarzyn'?'Nadarzyn':'Boguszyn'}</option>`).join('')}
      </select>`:`<span class="plakietka">${rapLok==='nadarzyn'?'Nadarzyn':'Boguszyn'}</span>`}
    </div>
    <div class="pasek">
      ${podz.map(p=>`<button class="btn ${rapZakladka===p.id?'':'szary'} maly" data-rz="${p.id}">${p.txt}</button>`).join('')}
    </div>
    <div id="rapTresc"></div>
  </div>`;

  const sel=w.querySelector('#rapLokSel');
  if(sel) sel.onchange=()=>{rapLok=sel.value; renderRaporty(w);};
  w.querySelectorAll('[data-rz]').forEach(b=>b.onclick=()=>{rapZakladka=b.dataset.rz; renderRaporty(w);});

  const t=w.querySelector('#rapTresc');
  if(rapZakladka==='dzien') rapDzien(t);
  else if(rapZakladka==='historia') rapHistoria(t);
  else if(rapZakladka==='miesiac') rapMiesiacWidok(t);
  else if(rapZakladka==='zuzycie') rapZuzycie(t);
  else if(rapZakladka==='produkcja') rapProdukcja(t);
  else rapSnapshoty(t);
}

/* ---------- 8.1 Dzień żywienia (wpis) ---------- */
function rapDzien(el){
  const edy = mozeWpisDnia(rapLok);
  const grupy = grupyLok(rapLok);
  const dok = dokDnia(rapLok, rapData);
  const wczoraj = dataMinus(rapData,1);
  const dokWczoraj = dokDnia(rapLok, wczoraj);

  const wiersze = grupy.map(gr=>{
    const o = obliczGrupe(gr);
    const z = dok?.grupy?.[gr.id] || {};
    const sztuk = z.sztuk!=null ? z.sztuk : (gr.sztuk||0);
    const wylicz = z.dawkaWyliczonaKgSzt!=null ? z.dawkaWyliczonaKgSzt : o.kgSzt;
    const zadaneKg = z.zadaneKg;
    const zadaneKgSzt = (zadaneKg!=null && sztuk>0) ? zadaneKg/sztuk : null;
    const odchKg = zadaneKgSzt!=null ? zadaneKgSzt-wylicz : null;
    const odchProc = (odchKg!=null && wylicz>0) ? (odchKg/wylicz)*100 : null;
    return {gr,o,sztuk,wylicz,zadaneKg,zadaneKgSzt,odchKg,odchProc};
  });

      <input type="date" id="rdData" value="${rapData}" max="${dzisiaj()}"></div>
    <button class="btn szary maly" id="rdWczoraj">\u2039 Poprzedni dzie\u0144</button>
    <button class="btn szary maly" id="rdDzis">Dzi\u015b</button>
    <span style="flex:1"></span>
    <button class="btn szary maly" id="rdCsv">\u2193 CSV</button>
  </div>
  <div class="przewijak">
    <table class="gt-tabela">
      <thead><tr>
        <th>Grupa technologiczna</th>
        <th class="num">Sztuk</th>
        <th class="num">Dawka wyliczona<br>kg/szt</th>
        <th class="num">Dawka zadana<br>kg na grup\u0119</th>
        <th class="num">Zadana<br>kg/szt</th>
        <th class="num">Odchylenie</th>
      </tr></thead>
      <tbody>
        ${wiersze.map(r=>`
        <tr>
          <td><b>${esc(r.gr.nazwa)}</b>${r.gr.parentId?' <span class="podpis">(podgrupa)</span>':''}</td>
          <td class="num">${edy?`<input class="pole num" data-dz-szt="${r.gr.id}" value="${r.sztuk}" style="width:58px" inputmode="numeric">`:r.sztuk}</td>
          <td class="num">${fmt(r.wylicz,1)}</td>
          <td class="num">${edy?`<input class="pole num" data-dz-kg="${r.gr.id}" value="${r.zadaneKg!=null?fmt(r.zadaneKg,0):''}" placeholder="\u2014" style="width:82px" inputmode="decimal">`:(r.zadaneKg!=null?fmt(r.zadaneKg,0):'\u2014')}</td>
          <td class="num"><b>${r.zadaneKgSzt!=null?fmt(r.zadaneKgSzt,1):'\u2014'}</b></td>
          <td class="num">${r.odchProc!=null
              ? `<span style="color:${odchylenieKolor(r.odchProc)};font-weight:700">${r.odchKg>0?'+':''}${fmt(r.odchKg,1)} kg &nbsp;${r.odchProc>0?'+':''}${fmt(r.odchProc,0)}%</span>`
              : '\u2014'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <div style="padding:14px;border-top:8px solid var(--tlo)">
    <div style="font-weight:700;margin-bottom:4px">Niedojady z ${dataPL(rapData)} \u2192 korekta pobrania za ${dataPL(wczoraj)}</div>
    <div class="podpis" style="margin-bottom:10px">Niedojady zebrane rano pomniejszaj\u0105 pobranie dnia poprzedniego, nie dzisiejszego.</div>
    ${!dokWczoraj ? `<div class="pusto" style="padding:18px">Brak wpisu \u017cywienia za ${dataPL(wczoraj)} \u2014 nie ma czego korygowa\u0107.</div>` : `
    <div class="przewijak"><table class="gt-tabela">

        <th class="num">Niedojady<br>kg</th><th class="num">Niedojady<br>%</th>
        <th class="num">Pobranie rzeczywiste<br>kg/szt</th>
      </tr></thead>
      <tbody>
        ${grupy.map(gr=>{
          const zy = dokWczoraj.grupy?.[gr.id]; if(!zy || zy.zadaneKg==null) return '';
          const nd = zy.niedojadyKg;
          const proc = (nd!=null && zy.zadaneKg>0) ? (nd/zy.zadaneKg)*100 : null;
          const pobr = (zy.sztuk>0) ? (zy.zadaneKg-(nd||0))/zy.sztuk : null;

/* Snapshot dawek — debounce: min. 5 min przerwy, nie częściej niż raz na godzinę */
let snapTimer=null;
function zaplanujSnapshot(){
  clearTimeout(snapTimer);
  snapTimer=setTimeout(async()=>{
    const ostatni=Object.values(store.snapshoty).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
    const teraz=Date.now();
    if(ostatni && teraz-(ostatni.ts||0) < 3600000) return;   // max raz na godzinę
    await DB.zapisz('snapshoty', 'snap_'+teraz, {
      typ:'dawki', ts:teraz, autor:ROLE[rolaAkt]?.nazwa||'?', dane:store.dawki
    });
  }, 300000);   // 5 minut ciszy po ostatniej edycji
}

        // Zbierz WSZYSTKIE dane z inputów ZANIM wykonamy jakikolwiek await

      <p style="margin-top:0">Pełny zrzut wszystkich kolekcji do pliku JSON. Rób to regularnie — plik trzymaj poza telefonem.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">
        <button class="btn" id="bkEksport">⬇ Eksportuj JSON</button>
        <button class="btn szary" id="bkImport">⬆ Importuj z pliku</button>
      </div>
      <input type="file" id="bkPlik" accept="application/json,.json" hidden>
      <div class="podpis">Import <b>nadpisuje</b> dokumenty o tych samych identyfikatorach i dodaje brakujące. Nie usuwa dokumentów, których nie ma w pliku.</div>`,
    przyciski:[{tekst:'Zamknij'}]
  });
  document.getElementById('bkEksport').onclick = eksportBackup;
  document.getElementById('bkImport').onclick = ()=> document.getElementById('bkPlik').click();
  document.getElementById('bkPlik').onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{ importBackup(JSON.parse(fr.result)); }catch(err){ toast('Nieprawidłowy plik JSON.', true); } };
    fr.readAsText(f);
  };
}

function eksportBackup(){
  const dane = {
    aplikacja:'OHZ Lubiana — Żywienie',
    wersja:WERSJA_APP,
    data:new Date().toISOString(),
    kolekcje:{}
  };
  KOLEKCJE.forEach(k=> dane.kolekcje[k]=store[k]);
  const blob = new Blob([JSON.stringify(dane,null,2)], {type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download = `lubiana-zywienie-${dzisiaj()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Pobrano kopię zapasową.');
}

function importBackup(dane){
  if(!dane.kolekcje){ toast('Plik nie zawiera danych aplikacji.', true); return; }
  const ile = Object.values(dane.kolekcje).reduce((s,k)=>s+Object.keys(k||{}).length,0);
  potwierdz('Wczytać kopię?',
    `Plik z ${esc(dane.data? dataPL(dane.data.slice(0,10)) : 'nieznanej daty')} — ${ile} dokumentów.\n\nDokumenty o tych samych identyfikatorach zostaną nadpisane.`,
    async ()=>{
      zamknijModal();
      let n=0;
      for(const [kol, docs] of Object.entries(dane.kolekcje)){
        if(!KOLEKCJE.includes(kol)) continue;
        for(const [id, d] of Object.entries(docs||{})){ await DB.zapisz(kol, id, d); n++; }
      }
      toast(`Wczytano ${n} dokumentów.`);
      render();
    }, 'Wczytaj');
}

/* ===================== INFO =============================================== */

  const r = ROLE[rolaAkt];
  const zakl = ZAKLADKI.filter(z=>poziom(z.id))
    .map(z=>`<tr><td>${esc(z.etykieta)}</td><td><span class="plakietka">${poziom(z.id)==='pelny'?'pełny':poziom(z.id)==='wpis'?'tylko wpis kg':'podgląd'}</span></td></tr>`).join('');
  modal({
    tytul:'Informacje',
    tresc:`
      <p style="margin-top:0"><b>OHZ Lubiana — Żywienie</b><br>
      <span class="podpis">Wersja ${esc(WERSJA_APP)} · ${trybLokalny?'tryb lokalny (bez Firebase)':'Firestore'}</span></p>
      <p>Zalogowano jako: <b>${esc(r.nazwa)}</b><br>
      Lokalizacje: ${r.lokalizacje.map(l=>l==='nadarzyn'?'Nadarzyn':'Boguszyn').join(', ')}</p>
      <table style="margin-top:10px">
        <thead><tr><th>Zakładka</th><th>Dostęp</th></tr></thead>
        <tbody>${zakl}</tbody>
      </table>
      <p class="podpis" style="margin-bottom:0">Dane: ${Object.keys(store.surowce).length} surowców · ${Object.keys(store.dawki).length} dawek · ${Object.keys(store.mieszanki).length} mieszanek</p>
      ${rolaAkt==='tworca' ? '<hr style="border:none;border-top:1px solid var(--linia);margin:14px 0"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn szary" id="btnZasiej">🌱 Surowce, mieszanki i dawki</button><button class="btn szary" id="btnZasiejGr">🏠 Grupy technologiczne</button></div><div class="podpis" style="margin-top:6px">Zasiew danych przykładowych. Nadpisuje dokumenty o tych samych ID, nie usuwa Twoich własnych wpisów.</div>' : ''}
      ${deferredPrompt ? '<hr style="border:none;border-top:1px solid var(--linia);margin:14px 0"><button class="btn" id="btnInstalujInfo">📲 Zainstaluj aplikację na tym urządzeniu</button>' : '<p class="podpis">Aby zainstalować jako aplikację: w Chrome kliknij menu ⋮ → „Zainstaluj aplikację" (komputer) lub „Dodaj do ekranu głównego" (Android).</p>'}`,
    przyciski:[{tekst:'Zamknij'}]
  });
  const btnZ = document.getElementById('btnZasiej');
  if(btnZ) btnZ.onclick = async()=>{
    btnZ.disabled=true; btnZ.textContent='Trwa zasiewanie…';
    await zasiejPrzykladowe();
    zamknijModal(); render();
    toast('Wgrano: 24 surowce, 8 mieszanek, 10 dawek, 31 grup.');
  };
  const btnZG = document.getElementById('btnZasiejGr');
  if(btnZG) btnZG.onclick = async()=>{
    btnZG.disabled=true; btnZG.textContent='Trwa zasiewanie…';
    await zasiejGrupy();
    zamknijModal(); render();
    toast('Wgrano grupy technologiczne: 17 Nadarzyn, 14 Boguszyn.');
  };
  const btnII = document.getElementById('btnInstalujInfo');
  if(btnII) btnII.onclick = ()=>{ zamknijModal(); document.getElementById('btnInstaluj').click(); };
}

/* ===================== PODPIĘCIE NAGŁÓWKA ================================= */
document.getElementById('btnOdswiez').onclick   = ()=>{ render(); toast('Odświeżono.'); };
document.getElementById('btnUstawienia').onclick= oknoUstawienia;
document.getElementById('btnBackup').onclick    = oknoBackup;
document.getElementById('btnInfo').onclick      = oknoInfo;
document.getElementById('btnWyloguj').onclick   = ()=> potwierdz('Wylogować?','Wrócisz do ekranu logowania.', wyloguj, 'Wyloguj');

/* ===================== INSTALACJA PWA ===================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btnInstaluj').hidden = false;
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('btnInstaluj').hidden = true;
  toast('Aplikacja zainstalowana.');
});
document.getElementById('btnInstaluj').onclick = async () => {
  if (!deferredPrompt) {
    toast('Otwórz stronę w Chrome i wybierz „Zainstaluj" z menu przeglądarki.');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') toast('Instalowanie…');
  deferredPrompt = null;
  document.getElementById('btnInstaluj').hidden = true;
};

/* ===================== REAKCJA NA ZMIANY DANYCH =========================== */
['surowce','dawki','mieszanki','grupyTech','produkcja','zywienie'].forEach(kol=>{
  nasluchuj(kol, ()=>{
    if(!rolaAkt) return;
    const akt = document.activeElement;
    if(akt && akt.closest && akt.closest('#tabSurowce')){ renderOdlozony=true; return; }
    if(akt && akt.closest && akt.closest('#macierzDawek')){ dRenderOdlozony=true; return; }
    render();
  });
});
nasluchuj('config', ()=>{
  if(!rolaAkt) return;
  document.getElementById('hNazwa').textContent = store.config.settings?.nazwaGospodarstwa || 'OHZ Lubiana';
});
document.addEventListener('focusout', e=>{
  if(renderOdlozony && e.target.closest && e.target.closest('#tabSurowce')){
    renderOdlozony=false; setTimeout(()=>{ if(!document.activeElement?.closest?.('#tabSurowce')) render(); }, 120);
  }
  if(dRenderOdlozony && e.target.closest && e.target.closest('#macierzDawek')){
    dRenderOdlozony=false; setTimeout(()=>{ if(!document.activeElement?.closest?.('#macierzDawek')) render(); }, 120);
  }
});

window.addEventListener('keydown', e=>{ if(e.key==='Escape') zamknijModal(); });
</script>
