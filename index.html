  if(!rapData) rapData = dzisiaj();
  const poz = pozycjeDnia(rapLok, rapData);
  const dokWcz = dokDnia(rapLok, dataMinus(rapData,1));
  const nazwaLok = rapLok==='nadarzyn'?'Nadarzyn':'Boguszyn';
  const sumSzt = poz.reduce((s,p)=>s+p.sztuk,0);
  const sumKoszt = poz.reduce((s,p)=>s+p.koszt,0);
  const ilePotw = poz.filter(p=>p.potw).length;

  el.innerHTML = `
  <div style="padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;border-bottom:1px solid var(--linia)">
    <div class="pole-grupa" style="margin:0"><label>Dzień</label>
      <input type="date" id="rhData" value="${rapData}" max="${dzisiaj()}"></div>
    <button class="btn szary maly" id="rhPrev">‹ Poprzedni</button>
    <button class="btn szary maly" id="rhNext">Następny ›</button>
    <button class="btn szary maly" id="rhDzis">Dziś</button>
    <span style="flex:1"></span>
    <span class="podpis">${poz.length} grup · ${sumSzt} szt · ${ilePotw} potwierdzonych</span>
  </div>
  ${!poz.length ? `<div class="pusto">Brak zapisu żywienia za ${dataPL(rapData)} w lokalizacji ${nazwaLok}.</div>` : `
  <div class="panel-tyt" style="border-bottom:1px solid var(--linia)">
    Realny skład dawek — ${nazwaLok}, ${dataPL(rapData)}
    <span class="licznik">kg surowca / sztukę / dobę</span>
    <span style="flex:1"></span>
    <span class="podpis">koszt dnia: ${fmt(sumKoszt,0)} zł</span>
    ${przyciskEksportu('#macierzHist','sklad_'+rapLok+'_'+rapData,'Realny skład dawek — '+nazwaLok+' '+dataPL(rapData))}
  </div>
  ${macierzSurowcowa(poz, dokWcz, {id:'macierzHist'})}

  <div class="panel-tyt" style="border-top:8px solid var(--tlo)">Podsumowanie grup<span style="flex:1"></span>
    ${przyciskEksportu('#tabHistPodsum','podsumowanie_'+rapLok+'_'+rapData,'Podsumowanie grup — '+nazwaLok+' '+dataPL(rapData))}</div>
  <div class="przewijak"><table class="gt-tabela" id="tabHistPodsum">
    <thead><tr><th>Grupa</th><th class="num">Sztuk</th><th class="num">Wyliczona<br>kg/szt</th>
    <th class="num">Odzysk<br>kg</th><th class="num">Świeży TMR<br>kg</th><th class="num">Podane<br>kg</th>
    <th class="num">Podane<br>kg/szt</th><th class="num">% realiz.</th>
    <th class="num">Niedojady<br>kg</th><th class="num">Pobranie<br>kg/szt</th><th class="num">Koszt zł</th></tr></thead>
    <tbody>
      ${poz.map(p=>{
        const kol = Math.abs(p.proc-100)<=3?'var(--zielony-ok)':(Math.abs(p.proc-100)<=10?'var(--zolty)':'var(--czerwony)');
        return `<tr>
        <td><b>${esc(p.nazwa)}</b>${p.potw?'':' <span class="plakietka auto">plan</span>'}</td>
        <td class="num">${p.sztuk}</td>
        <td class="num">${fmt(p.wylicz,1)}</td>
        <td class="num">${p.odzysk?'<span style="color:#7a5c00;font-weight:600">'+fmt(p.odzysk,0)+'</span>':'—'}</td>
        <td class="num">${fmt(p.swiezy,0)}</td>
        <td class="num">${fmt(p.zadaneKg,0)}</td>
        <td class="num"><b>${fmt(p.perSzt,2)}</b></td>
        <td class="num" style="color:${kol};font-weight:700">${fmt(p.proc,0)}%</td>
        <td class="num">${p.z.niedojadyKg!=null?fmt(p.z.niedojadyKg,0):'—'}</td>
        <td class="num"><b>${fmt(p.pobr,1)}</b></td>
        <td class="num">${fmt(p.koszt,0)}</td>
      </tr>`;}).join('')}
      <tr class="suma"><td>SUMA</td><td class="num">${sumSzt}</td><td class="num"></td>
        <td class="num">${fmt(poz.reduce((s,p)=>s+p.odzysk,0),0)}</td>
        <td class="num">${fmt(poz.reduce((s,p)=>s+p.swiezy,0),0)}</td>
        <td class="num">${fmt(poz.reduce((s,p)=>s+p.zadaneKg,0),0)}</td>
        <td class="num"></td><td class="num"></td>
        <td class="num">${fmt(poz.reduce((s,p)=>s+(p.z.niedojadyKg||0),0),0)}</td>
        <td class="num"></td><td class="num">${fmt(sumKoszt,0)} zł</td></tr>
    </tbody>
  </table></div>`}`;

  el.querySelector('#rhData').onchange=e=>{rapData=e.target.value;renderRaporty(document.getElementById('widok'));};
  el.querySelector('#rhPrev').onclick=()=>{rapData=dataMinus(rapData,1);renderRaporty(document.getElementById('widok'));};
  el.querySelector('#rhNext').onclick=()=>{
    const n=dataPlus(rapData,1); if(n<=dzisiaj()){rapData=n;renderRaporty(document.getElementById('widok'));}
    else toast('To już dziś.');
  };
  el.querySelector('#rhDzis').onclick=()=>{rapData=dzisiaj();renderRaporty(document.getElementById('widok'));};
}

/* ---------- Zestawienie miesięczne ---------- */
function rapMiesiacWidok(el){
  const dni=Object.values(store.zywienie).filter(d=>d.lokalizacja===rapLok && (d.data||'').startsWith(rapMiesiac));
  const agg={};
  dni.forEach(d=>Object.entries(d.grupy||{}).forEach(([gid,z])=>{
    const potw = z.zadaneKg!=null;
    const zadEff = potw ? z.zadaneKg : (z.dawkaWyliczonaKgSzt||0)*(z.sztuk||0);
    if(!zadEff) return;
    const a=agg[gid]||(agg[gid]={dni:0,dniPotw:0,sumPobrKgSzt:0,sumNiedoj:0,sumZadane:0,sumOdzysk:0,sumKoszt:0,sumSzt:0,nazwa:store.grupyTech[gid]?.nazwa||z.nazwaGrupy||'?'});
    const pobr=(z.sztuk>0)?(zadEff-(z.niedojadyKg||0))/z.sztuk:0;
    const odzysk=z.niedojadyDodaneKg||0;
    const swiezy=Math.max(0,zadEff-odzysk);
    a.dni++; if(potw) a.dniPotw++;
    a.sumPobrKgSzt+=pobr; a.sumNiedoj+=(z.niedojadyKg||0); a.sumZadane+=zadEff;
    a.sumOdzysk+=odzysk;
    a.sumKoszt+=swiezy*(z.kosztKgTMR||0); a.sumSzt+=(z.sztuk||0);
  }));
  const lista=Object.values(agg);
  const sumKoszt=lista.reduce((s,a)=>s+a.sumKoszt,0);

  el.innerHTML=`
  <div style="padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;border-bottom:1px solid var(--linia)">
    <div class="pole-grupa" style="margin:0"><label>Miesi\u0105c</label><input type="month" id="rmM" value="${rapMiesiac}"></div>
    <span style="flex:1"></span>${lista.length?przyciskEksportu('#tabMiesiac','miesiac_'+rapLok+'_'+rapMiesiac,'Zestawienie miesi\u0119czne — '+rapMiesiac):''}
  </div>
  ${lista.length?`<div class="przewijak"><table class="gt-tabela" id="tabMiesiac">
    <thead><tr><th>Grupa</th><th class="num">Dni<br>(potwierdzone)</th><th class="num">\u015arednie pobranie<br>kg/szt/dob\u0119</th>
    <th class="num">\u015arednie<br>niedojady %</th><th class="num">Odzysk<br>kg \u0142\u0105cznie</th>
    <th class="num">Koszt<br>z\u0142/szt/dob\u0119</th><th class="num">Koszt \u0142\u0105cznie<br>z\u0142</th></tr></thead>
    <tbody>${lista.map(a=>{
      const srPobr=a.dni?a.sumPobrKgSzt/a.dni:0;
      const srNied=a.sumZadane?(a.sumNiedoj/a.sumZadane)*100:0;
      const srSzt=a.dni?a.sumSzt/a.dni:0;
      const kosztSzt=(srSzt>0&&a.dni>0)?a.sumKoszt/(srSzt*a.dni):0;
      return `<tr><td><b>${esc(a.nazwa)}</b></td><td class="num">${a.dni} <span class="podpis">(${a.dniPotw})</span></td>
        <td class="num"><b>${fmt(srPobr,1)}</b></td>
        <td class="num" style="color:${srNied<=3?'var(--zielony-ok)':srNied<=8?'var(--zolty)':'var(--czerwony)'};font-weight:700">${fmt(srNied,1)}%</td>
        <td class="num">${a.sumOdzysk?'<span style="color:#7a5c00;font-weight:600">'+fmt(a.sumOdzysk,0)+'</span>':'\u2014'}</td>
        <td class="num">${fmt(kosztSzt,2)}</td><td class="num">${fmt(a.sumKoszt,0)}</td></tr>`;
    }).join('')}
    <tr class="suma"><td>SUMA</td><td class="num"></td><td class="num"></td><td class="num"></td>
      <td class="num">${fmt(lista.reduce((s,a)=>s+a.sumOdzysk,0),0)}</td><td class="num"></td><td class="num">${fmt(sumKoszt,0)} z\u0142</td></tr>
    </tbody></table></div>`
  :'<div class="pusto">Brak danych za ten miesi\u0105c.</div>'}`;

  el.querySelector('#rmM').onchange=e=>{rapMiesiac=e.target.value;renderRaporty(document.getElementById('widok'));};
}

/* ---------- Zużycie surowców ---------- */
function rapZuzycie(el){
  const dni=Object.values(store.zywienie).filter(d=>d.lokalizacja===rapLok && d.data>=rapOdDo.od && d.data<=rapOdDo.do);
  const zuz={};
  dni.forEach(d=>Object.entries(d.grupy||{}).forEach(([gid,z])=>{
    const skl=z.skladniki || obliczGrupe(store.grupyTech[gid]||{dawki:[]}).skladniki;
    const planKgSzt=z.dawkaWyliczonaKgSzt||0;
    const planGrupa=planKgSzt*(z.sztuk||0);
    const zadEff = z.zadaneKg!=null ? z.zadaneKg : planGrupa;   // brak wpisu = plan
    const swiezy = Math.max(0, zadEff - (z.niedojadyDodaneKg||0)); // odzysk nie zużywa świeżych surowców
    if(!swiezy) return;
    const wsp=planGrupa>0 ? swiezy/planGrupa : 0;
    (skl||[]).forEach(sk=>{
      zuz[sk.surowiecId]=(zuz[sk.surowiecId]||0)+sk.kg*(z.sztuk||0)*wsp;
    });
  }));
  const lista=Object.entries(zuz).map(([sid,kg])=>{
    const sur=store.surowce[sid];
    return {nazwa:sur?.nazwa||'?', kg, zl:kg*((sur?.cenaTona||0)/1000)};
  }).sort((a,b)=>b.zl-a.zl);
  const sumZl=lista.reduce((s,x)=>s+x.zl,0), sumKg=lista.reduce((s,x)=>s+x.kg,0);

  el.innerHTML=`
  <div style="padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;border-bottom:1px solid var(--linia)">
    <div class="pole-grupa" style="margin:0"><label>Od</label><input type="date" id="rzOd" value="${rapOdDo.od}"></div>
    <div class="pole-grupa" style="margin:0"><label>Do</label><input type="date" id="rzDo" value="${rapOdDo.do}"></div>
    <span style="flex:1"></span>${lista.length?przyciskEksportu('#tabZuzycie','zuzycie_'+rapLok,'Zu\u017cycie surowc\u00f3w '+dataPL(rapOdDo.od)+' — '+dataPL(rapOdDo.do)):''}
  </div>
  ${lista.length?`<div class="przewijak"><table class="gt-tabela" id="tabZuzycie">
    <thead><tr><th>Surowiec</th><th class="num">Zu\u017cycie kg</th><th class="num">Zu\u017cycie t</th><th class="num">Warto\u015b\u0107 z\u0142</th></tr></thead>
    <tbody>${lista.map(x=>`<tr><td>${esc(x.nazwa)}</td><td class="num">${fmt(x.kg,2)}</td>
      <td class="num">${fmt(x.kg/1000,3)}</td><td class="num">${fmt(x.zl,2)}</td></tr>`).join('')}
    <tr class="suma"><td>SUMA</td><td class="num">${fmt(sumKg,0)}</td><td class="num">${fmt(sumKg/1000,2)}</td><td class="num">${fmt(sumZl,0)} z\u0142</td></tr>
    </tbody></table></div>
    <div class="podpis" style="padding:8px 14px">Liczone z faktycznie zadanych kg i receptur dawek obowi\u0105zuj\u0105cych w dniu wpisu.</div>`
  :'<div class="pusto">Brak wpis\u00f3w \u017cywienia w tym okresie.</div>'}`;

  el.querySelector('#rzOd').onchange=e=>{rapOdDo.od=e.target.value;renderRaporty(document.getElementById('widok'));};
  el.querySelector('#rzDo').onchange=e=>{rapOdDo.do=e.target.value;renderRaporty(document.getElementById('widok'));};
}

/* ---------- Produkcja mieszalni ---------- */
function rapProdukcja(el){
  const p=Object.values(store.produkcja)
    .filter(x=>!x.data || (x.data>=rapOdDo.od && x.data<=rapOdDo.do))
    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const sumKg=p.reduce((s,x)=>s+(x.kg||0),0), sumZl=p.reduce((s,x)=>s+(x.koszt||0),0);
  el.innerHTML=`
  <div style="padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;border-bottom:1px solid var(--linia)">
    <div class="pole-grupa" style="margin:0"><label>Od</label><input type="date" id="rpOd" value="${rapOdDo.od}"></div>
    <div class="pole-grupa" style="margin:0"><label>Do</label><input type="date" id="rpDo" value="${rapOdDo.do}"></div>
    <span style="flex:1"></span>${p.length?przyciskEksportu('#tabProdukcja','produkcja','Produkcja mieszalni'):''}
  </div>
  ${p.length?`<div class="przewijak"><table class="gt-tabela" id="tabProdukcja">
    <thead><tr><th>Data</th><th>Mieszanka</th><th class="num">kg</th><th class="num">Koszt z\u0142</th>
    <th class="num">z\u0142/kg</th><th>Lokalizacja</th><th>Kto</th></tr></thead>
    <tbody>${p.map(x=>{const m=store.mieszanki[x.mieszankaId];
      return `<tr><td>${dataPL(x.data)}</td><td><b>${esc(m?.nazwa||'?')}</b></td>
      <td class="num">${fmt(x.kg,0)}</td><td class="num">${fmt(x.koszt,2)}</td>
      <td class="num">${fmt(x.kosztKg,4)}</td>
      <td><span class="plakietka">${x.lokalizacja==='obie'?'obie':esc(x.lokalizacja||'?')}</span></td>
      <td class="podpis">${esc(x.uzytkownik||'')}</td></tr>`;}).join('')}
    <tr class="suma"><td>SUMA</td><td></td><td class="num">${fmt(sumKg,0)}</td><td class="num">${fmt(sumZl,0)} z\u0142</td><td class="num"></td><td></td><td></td></tr>
    </tbody></table></div>`
  :'<div class="pusto">Brak produkcji w tym okresie.</div>'}`;
  el.querySelector('#rpOd').onchange=e=>{rapOdDo.od=e.target.value;renderRaporty(document.getElementById('widok'));};
  el.querySelector('#rpDo').onchange=e=>{rapOdDo.do=e.target.value;renderRaporty(document.getElementById('widok'));};
}

/* ---------- Historia dawek (snapshoty) ---------- */
function rapSnapshoty(el){
  const s=Object.values(store.snapshoty).sort((a,b)=>(b.ts||0)-(a.ts||0));
  el.innerHTML = s.length ? s.map(x=>{
    const d=new Date(x.ts||0);
    const ile=Object.keys(x.dane||{}).length;
    return `<div class="hist-row"><span class="data">${dataPL(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}</span>
      <span class="podpis">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span>
      <b>${esc(x.typ||'dawki')}</b><span>${ile} pozycji</span>
      <span class="podpis">${esc(x.autor||'')}</span></div>`;
  }).join('') : '<div class="pusto">Brak zapisanych wersji. Snapshot powstaje automatycznie po zmianie dawek (co najwy\u017cej raz na godzin\u0119).</div>';
}


/* ===================== USTAWIENIA ========================================= */
function oknoUstawienia(){
  const st = store.config.settings || {};
  const mozeHasla = ROLE[rolaAkt]?.hasla;
  const mozeEd = ['tworca','hodowca'].includes(rolaAkt);
  modal({
    tytul:'Ustawienia',
    szer:'620px',
    tresc:`
      <div class="pole-grupa">
        <label>Nazwa gospodarstwa</label>
        <input id="uNazwa" value="${esc(st.nazwaGospodarstwa||'OHZ Lubiana')}" ${mozeEd?'':'disabled'}>
      </div>
      <div class="pole-grupa">
        <label>Kategorie surowców (jedna w wierszu)</label>
        <textarea id="uKat" rows="6" style="width:100%;padding:10px 12px;border:1.5px solid var(--linia);border-radius:8px" ${mozeEd?'':'disabled'}>${esc(kategorie().join('\n'))}</textarea>
        <div class="hint">Zmiana nazwy kategorii nie przepisuje jej automatycznie w istniejących surowcach.</div>
      </div>
      ${mozeHasla ? `
      <hr style="border:none;border-top:1px solid var(--linia);margin:18px 0">
      <div style="font-weight:600;margin-bottom:10px">Hasła ról</div>
      <div class="podpis" style="margin-bottom:10px">Hasła widoczne poniżej to aktualnie obowiązujące. Zmiana działa od razu na wszystkich urządzeniach.
      <br>Logowanie porównuje skrót SHA-256, ale hasło jest też zapisane jawnie w bazie, żeby dało się je tutaj odczytać —
      kto ma dostęp do konsoli Firebase, ten je zobaczy.</div>
      ${Object.keys(ROLE).map(r=>{
        const dt = store.config.passwords?.zmienioneRole?.[r];
        const akt = store.config.passwords?.jawne?.[r];
        return `
        <div class="pole-grupa">
          <label>${esc(ROLE[r].nazwa)}</label>
          <input data-haslo="${r}" type="text" value="${esc(akt||'')}"
                 placeholder="${akt?'':'hasło nieznane — wpisz nowe'}" autocomplete="off" spellcheck="false">
          <div class="hint">${akt
            ? (dt ? 'Zmienione '+dataPL(dt) : 'Hasło startowe')
            : '<b style="color:var(--zolty)">Hasło ustawiono przed aktualizacją — nie da się go odczytać. Wpisz nowe, żeby było widoczne.</b>'}</div>
        </div>`;}).join('')}
      ` : ''}
      <div class="podpis">Wersja: ${esc(WERSJA_APP)} · Tryb: ${trybLokalny?'lokalny':'Firestore'}</div>`,
    przyciski:[
      {tekst:'Zamknij'},
      ...(mozeEd?[{tekst:'Zapisz', klasa:'', akcja:async(n)=>{
        // Zbierz WSZYSTKIE dane z inputów ZANIM wykonamy jakikolwiek await
        // (modal może zostać zamknięty między await-ami)
        const dane = {
          nazwaGospodarstwa: n.querySelector('#uNazwa').value.trim() || 'OHZ Lubiana',
          kategorie: n.querySelector('#uKat').value.split('\n').map(x=>x.trim()).filter(Boolean)
        };
        let noweHasla = null, noweDaty = null, noweJawne = null;
        if(mozeHasla){
          const hasla = {...(store.config.passwords?.hasla||{})};
          const jawne = {...(store.config.passwords?.jawne||{})};
          const daty  = {...(store.config.passwords?.zmienioneRole||{})};
          let zmiany=0, puste=[];
          n.querySelectorAll('[data-haslo]').forEach(inp=>{
            const r = inp.dataset.haslo;
            const v = inp.value.trim();
            if(!v){ if(jawne[r]) puste.push(ROLE[r].nazwa); return; }   // puste = zostaw stare
            if(v === jawne[r]) return;                                  // bez zmiany
            hasla[r]=sha256(v); jawne[r]=v; daty[r]=dzisiaj(); zmiany++;
          });
          if(puste.length){ toast('Puste pole nie kasuje hasła: '+puste.join(', ')); }
          if(zmiany){ noweHasla=hasla; noweJawne=jawne; noweDaty=daty; }
        }
        // Teraz bezpiecznie zapisujemy — inputy już nie są potrzebne
        await DB.zapisz('config','settings',dane);
        if(noweHasla) await DB.zapisz('config','passwords',
          {hasla:noweHasla, jawne:noweJawne, zmienioneRole:noweDaty, zmienione:dzisiaj()});
        document.getElementById('hNazwa').textContent = dane.nazwaGospodarstwa;
        render();
        toast(noweHasla ? 'Zapisano ustawienia i hasła.' : 'Zapisano ustawienia.');
      }}]:[])
    ]
  });
}

/* ===================== KOPIA ZAPASOWA ===================================== */
function oknoBackup(){
  modal({
    tytul:'Kopia zapasowa',
    tresc:`
      <p style="margin-top:0">Pełny zrzut wszystkich kolekcji do pliku JSON. Rób to regularnie — plik trzymaj poza telefonem.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">
        <button class="btn" id="bkEksport">⬇ Eksportuj JSON</button>
        <button class="btn szary" id="bkImport">⬆ Importuj z pliku</button>
      </div>
      <input type="file" id="bkPlik" accept="application/json,.json" hidden>
      <div class="podpis">Import <b>nadpisuje</b> dokumenty o tych samych identyfikatorach i dodaje brakujące. Nie usuwa dokumentów, których nie ma w pliku.</div>`,
    przyciski:[{tekst:'Zamknij'}]
  });
  document.getElementById('bkEksport').onclick = eksportBackup;
  document.getElementById('bkImport').onclick = ()=> document.getElementById('bkPlik').click();
  document.getElementById('bkPlik').onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{ importBackup(JSON.parse(fr.result)); }catch(err){ toast('Nieprawidłowy plik JSON.', true); } };
    fr.readAsText(f);
  };
}

function eksportBackup(){
  const dane = {
    aplikacja:'OHZ Lubiana — Żywienie',
    wersja:WERSJA_APP,
    data:new Date().toISOString(),
    kolekcje:{}
  };
  KOLEKCJE.forEach(k=> dane.kolekcje[k]=store[k]);
  const blob = new Blob([JSON.stringify(dane,null,2)], {type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download = `lubiana-zywienie-${dzisiaj()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Pobrano kopię zapasową.');
}

function importBackup(dane){
  if(!dane.kolekcje){ toast('Plik nie zawiera danych aplikacji.', true); return; }
  const ile = Object.values(dane.kolekcje).reduce((s,k)=>s+Object.keys(k||{}).length,0);
  potwierdz('Wczytać kopię?',
    `Plik z ${esc(dane.data? dataPL(dane.data.slice(0,10)) : 'nieznanej daty')} — ${ile} dokumentów.\n\nDokumenty o tych samych identyfikatorach zostaną nadpisane.`,
    async ()=>{
      zamknijModal();
      let n=0;
      for(const [kol, docs] of Object.entries(dane.kolekcje)){
        if(!KOLEKCJE.includes(kol)) continue;
        for(const [id, d] of Object.entries(docs||{})){ await DB.zapisz(kol, id, d); n++; }
      }
      toast(`Wczytano ${n} dokumentów.`);
      render();
    }, 'Wczytaj');
}

/* ===================== INFO =============================================== */
function oknoInfo(){
  const r = ROLE[rolaAkt];
  const zakl = ZAKLADKI.filter(z=>poziom(z.id))
    .map(z=>`<tr><td>${esc(z.etykieta)}</td><td><span class="plakietka">${poziom(z.id)==='pelny'?'pełny':poziom(z.id)==='wpis'?'tylko wpis kg':'podgląd'}</span></td></tr>`).join('');
  modal({
    tytul:'Informacje',
    tresc:`
      <p style="margin-top:0"><b>OHZ Lubiana — Żywienie</b><br>
      <span class="podpis">Wersja ${esc(WERSJA_APP)} · ${trybLokalny?'tryb lokalny (bez Firebase)':'Firestore'}</span></p>
      <p>Zalogowano jako: <b>${esc(r.nazwa)}</b><br>
      Lokalizacje: ${r.lokalizacje.map(l=>l==='nadarzyn'?'Nadarzyn':'Boguszyn').join(', ')}</p>
      <table style="margin-top:10px">
        <thead><tr><th>Zakładka</th><th>Dostęp</th></tr></thead>

      </table>

      ${rolaAkt==='tworca' ? '<hr style="border:none;border-top:1px solid var(--linia);margin:14px 0"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn szary" id="btnZasiej">🌱 Surowce, mieszanki i dawki</button><button class="btn szary" id="btnZasiejGr">🏠 Grupy technologiczne</button></div><div class="podpis" style="margin-top:6px">Zasiew danych przykładowych. Nadpisuje dokumenty o tych samych ID, nie usuwa Twoich własnych wpisów.</div>' : ''}
      ${deferredPrompt ? '<hr style="border:none;border-top:1px solid var(--linia);margin:14px 0"><button class="btn" id="btnInstalujInfo">📲 Zainstaluj aplikację na tym urządzeniu</button>' : '<p class="podpis">Aby zainstalować jako aplikację: w Chrome kliknij menu ⋮ → „Zainstaluj aplikację" (komputer) lub „Dodaj do ekranu głównego" (Android).</p>'}`,
    przyciski:[{tekst:'Zamknij'}]
  });
  const btnZ = document.getElementById('btnZasiej');
  if(btnZ) btnZ.onclick = async()=>{
    btnZ.disabled=true; btnZ.textContent='Trwa zasiewanie…';
    await zasiejPrzykladowe();
    zamknijModal(); render();
    toast('Wgrano: 24 surowce, 8 mieszanek, 10 dawek, 31 grup.');
  };
  const btnZG = document.getElementById('btnZasiejGr');
  if(btnZG) btnZG.onclick = async()=>{
    btnZG.disabled=true; btnZG.textContent='Trwa zasiewanie…';
    await zasiejGrupy();
    zamknijModal(); render();
    toast('Wgrano grupy technologiczne: 17 Nadarzyn, 14 Boguszyn.');
  };
  const btnII = document.getElementById('btnInstalujInfo');
  if(btnII) btnII.onclick = ()=>{ zamknijModal(); document.getElementById('btnInstaluj').click(); };
}

/* ===================== PODPIĘCIE NAGŁÓWKA ================================= */
document.getElementById('btnOdswiez').onclick   = ()=>{ render(); toast('Odświeżono.'); };
document.getElementById('btnUstawienia').onclick= oknoUstawienia;
document.getElementById('btnBackup').onclick    = oknoBackup;
document.getElementById('btnInfo').onclick      = oknoInfo;
document.getElementById('btnWyloguj').onclick   = ()=> potwierdz('Wylogować?','Wrócisz do ekranu logowania.', wyloguj, 'Wyloguj');

/* ===================== INSTALACJA PWA ===================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btnInstaluj').hidden = false;
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('btnInstaluj').hidden = true;
  toast('Aplikacja zainstalowana.');
});
document.getElementById('btnInstaluj').onclick = async () => {
  if (!deferredPrompt) {
    toast('Otwórz stronę w Chrome i wybierz „Zainstaluj" z menu przeglądarki.');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') toast('Instalowanie…');
  deferredPrompt = null;
  document.getElementById('btnInstaluj').hidden = true;
};

/* ===================== REAKCJA NA ZMIANY DANYCH =========================== */
['surowce','dawki','mieszanki','grupyTech','produkcja','zywienie'].forEach(kol=>{
  nasluchuj(kol, ()=>{
    if(!rolaAkt) return;
    const akt = document.activeElement;
    if(akt && akt.tagName==='INPUT' && akt.closest && akt.closest('#tabSurowce')){ renderOdlozony=true; return; }
    if(akt && akt.tagName==='INPUT' && akt.closest && akt.closest('#macierzDawek')){ dRenderOdlozony=true; return; }
    render();
  });
});
nasluchuj('config', ()=>{
  if(!rolaAkt) return;
  document.getElementById('hNazwa').textContent = store.config.settings?.nazwaGospodarstwa || 'OHZ Lubiana';
  // Kolejność wierszy macierzy siedzi w config/ukladDawki — bez tego strzałki nie odświeżały widoku
  const akt = document.activeElement;
  if(akt && akt.tagName==='INPUT' && akt.closest && akt.closest('#macierzDawek')) return;
  render();
});
document.addEventListener('focusout', e=>{
  if(renderOdlozony && e.target.closest && e.target.closest('#tabSurowce')){
    renderOdlozony=false; setTimeout(()=>{ if(!document.activeElement?.closest?.('#tabSurowce')) render(); }, 120);
  }
  if(dRenderOdlozony && e.target.closest && e.target.closest('#macierzDawek')){
    dRenderOdlozony=false; setTimeout(()=>{ if(!document.activeElement?.closest?.('#macierzDawek')) render(); }, 120);
  }
});

window.addEventListener('keydown', e=>{ if(e.key==='Escape') zamknijModal(); });
</script>
