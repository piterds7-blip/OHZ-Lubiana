let gtRozwiniete = new Set();

function grupyLok(lok){
  return Object.values(store.grupyTech).filter(g=>g.lokalizacja===lok)
    .sort((a,b)=>(a.kolejnosc??99)-(b.kolejnosc??99));
}

function obliczGrupe(gr){
  const surMap = {};
  for(const pd of (gr.dawki||[])){
    const daw = store.dawki[pd.dawkaId]; if(!daw) continue;
    const u = (pd.udzial||0)/100;
    for(const sk of (daw.skladniki||[])){
      surMap[sk.surowiecId] = (surMap[sk.surowiecId]||0) + u * sk.kg;
    }
  }
  const skladniki = Object.entries(surMap).map(([id,kg])=>({surowiecId:id,kg:Math.round(kg*10000)/10000})).filter(s=>s.kg>0.0001);
  skladniki.sort((a,b)=>b.kg-a.kg);
  const kgSzt = skladniki.reduce((s,x)=>s+x.kg,0);
  const kgGrupa = (gr.sztuk||0)*kgSzt;
  const koszt = skladniki.reduce((s,x)=>{
    const sur=store.surowce[x.surowiecId]; return s + x.kg*((sur?.cenaTona||0)/1000);
  },0);
  const sumaUdzialow = (gr.dawki||[]).reduce((s,d)=>s+(d.udzial||0),0);
  return {skladniki, kgSzt, kgGrupa, kosztSzt:koszt, kosztGrupa:koszt*(gr.sztuk||0), sumaUdzialow};
}

function renderGTDet(p, data){
  const uklad = wierszeDawek();

  ids.sort((a,b)=>{ const ia=uklad.indexOf(a), ib=uklad.indexOf(b); return (ia<0?999:ia)-(ib<0?999:ib); });
  let wWozie = 0;
  const wierszOdzysku = p.odzysk>0.5 ? (()=>{
    wWozie += p.odzysk;
    const zr = (p.niedojadyZrodla||[]).map(x=>esc(store.grupyTech[x.grupaId]?.nazwa||'?')+' '+fmt(x.kg,0)+' kg').join(' + ');
    return `<tr class="wiersz-odzysk"><td><b>♻ Niedojady</b>${zr?'<br><span class="podpis">z: '+zr+'</span>':''}</td>

  })() : '';
  const wiersze = ids.map(sid=>{
    const sur = store.surowce[sid];
    const plan = (p.planSkl||[]).find(x=>x.surowiecId===sid)?.kg || 0;

    return `<tr><td>${esc(sur?.nazwa||'?')}</td><td class="num">${plan?fmt(plan,2):'—'}</td>
      <td class="num">${fmt(kgGr/(p.sztuk||1),2)}</td><td class="num">${fmt(kgGr,1)}</td><td class="num wwozie">${fmt(wWozie,1)}</td></tr>`;

/* ===================== ZAKŁADKA: PASZOWÓZ =================================
   Jeden dokument na dzień × lokalizację:
     niedojady[] — resztki TMR zebrane RANO z sektorów (to, czego zwierzęta nie zjadły
                   WCZORAJ). Obniżają realne pobranie za wczoraj.
     wozy[]      — każdy wóz: najpierw wsypane niedojady (z puli zebranych),
                   potem świeży TMR wg receptur (można mieszać, np. 60/40),
                   masa wozu = suma rozdzielenia na sektory.
   Wszystko, co liczą raporty, synchronizuje się do kolekcji „zywienie”.
   ========================================================================= */
let pzData = {};                 // wybrana data per lokalizacja
const pzAutoProby = new Set();   // autoduplikację próbujemy raz na lokalizację/dzień

function idPz(lok,data){ return lok+'_'+data; }
function pzDok(lok,data){ return store.paszowozy[idPz(lok,data)] || null; }

/* Dawki dostępne dla lokalizacji: W (wspólne) + N (Nadarzyn) lub W + B (Boguszyny).
   'X' = brak przypisania — dawka istnieje w Dawkach, ale nie wchodzi do Paszowozu. */
function dawkiDlaLok(lok){
  const flaga = lok==='nadarzyn' ? 'N' : 'B';
  return dawkiSorted().filter(d=>{ const l = d.lokalizacja || 'W'; return l==='W' || l===flaga; });
}

/* Receptury wozu jako lista — obsługa starego formatu (pojedyncze dawkaId) */
function recepturyWozu(woz){
  if(Array.isArray(woz.receptury) && woz.receptury.length) return woz.receptury;
  if(woz.dawkaId) return [{dawkaId:woz.dawkaId, udzial:100}];
  return [];
}
function masaWozu(woz){ return (woz.rozdzielenie||[]).reduce((s,r)=>s+(r.kg||0),0); }
function masaNiedojadow(woz){ return (woz.niedojady||[]).reduce((s,x)=>s+(x.kg||0),0); }
function masaSwiezaWozu(woz){ return Math.max(0, masaWozu(woz) - masaNiedojadow(woz)); }

/* Skład świeżego TMR wozu: {surowiecId: udział 0..1}. Normalizujemy tylko po wierszach
   z wybraną recepturą — pusty wiersz nie „zjada” procentów. */
function udzialyReceptur(woz){
  const rec = recepturyWozu(woz).filter(r=>r.dawkaId && store.dawki[r.dawkaId] && (r.udzial||0)>0);
  const sumaUdz = rec.reduce((s,r)=>s+(r.udzial||0),0);
  if(sumaUdz<=0) return {};
  const wynik = {};
  rec.forEach(r=>{
    const skl = store.dawki[r.dawkaId].skladniki||[];
    const sumaR = skl.reduce((s,x)=>s+(x.kg||0),0);
    if(sumaR<=0) return;
    const waga = (r.udzial||0)/sumaUdz;
    skl.forEach(x=>{ wynik[x.surowiecId] = (wynik[x.surowiecId]||0) + waga*((x.kg||0)/sumaR); });
  });
  return wynik;
}

/* Ujednolicony stan dokumentu dnia. Każdy zebrany niedojad ma stałe id,
   a wóz odwołuje się do niego (zebraneId) — kg w wozie = kg zebrane, zawsze.
   Usunięcie wpisu z listy zebranych automatycznie wyjmuje go z wozu. */
function normalizujPz(dok){
  dok = dok || {};
  const uzyteId = new Set();
  const niedojady = (dok.niedojady||[]).map((n,i)=>{
    let id = n.id || ('nd_'+i+'_'+(n.zrodloId||'x'));
    while(uzyteId.has(id)) id += '_';
    uzyteId.add(id);
    return {id, zrodloId:n.zrodloId||'', zebranoKg:Math.max(0, Number(n.zebranoKg)||0)};
  });
  const wPuli = new Set();
  const wozy = (dok.wozy||[]).map((w,wi)=>{
    const woz = klon(w) || {};
    woz.id = woz.id || ('w_'+wi);
    woz.nazwa = woz.nazwa || ('Wóz '+(wi+1));
    woz.receptury = recepturyWozu(w).map(r=>({dawkaId:r.dawkaId||'', udzial:Number(r.udzial)||0}));
    if(!woz.receptury.length) woz.receptury = [{dawkaId:'', udzial:100}];
    delete woz.dawkaId; delete woz.wagaFaktyczna; delete woz.dawka;
    woz.rozdzielenie = (w.rozdzielenie||[]).map(r=>({grupaId:r.grupaId||'', kg:Math.max(0, Number(r.kg)||0)}));
    woz.wagaKontrolna = Number(w.wagaKontrolna)||null;
    woz.niedojady = (w.niedojady||[]).map(x=>{
      let nd = x.zebraneId ? niedojady.find(n=>n.id===x.zebraneId && !wPuli.has(n.id)) : null;
      // stary format: dopasowanie po źródle i kg
      if(!nd && !x.zebraneId) nd = niedojady.find(n=>!wPuli.has(n.id) && n.zrodloId===x.zrodloId && Math.abs(n.zebranoKg-(x.kg||0))<0.5);
      if(!nd) return null;
      wPuli.add(nd.id);
      return {zebraneId:nd.id, zrodloId:nd.zrodloId, kg:nd.zebranoKg};
    }).filter(Boolean);
    return woz;
  });
  return {wozy, niedojady, niedojadyPotw:!!dok.niedojadyPotw, autoKopia:dok.autoKopia||null};
}

/* zebraneId → wóz, do którego trafił */
function przypisaniaNd(st){
  const m = {};
  st.wozy.forEach(w=>(w.niedojady||[]).forEach(x=>{ m[x.zebraneId] = w; }));
  return m;
}

/* Przeliczenie całego dnia: per wóz i per sektor. Jedno miejsce — korzystają z niego
   ekran, karty załadunku i synchronizacja do raportów. */
function obliczPaszowoz(lok, data, st){
  const wozy = st.wozy.map(woz=>{
    const recWsz = woz.receptury;
    const rec = recWsz.filter(r=>r.dawkaId && store.dawki[r.dawkaId] && (r.udzial||0)>0);
    const sumaUdzWsz = recWsz.reduce((s,r)=>s+(r.udzial||0),0);
    const sumaUdz = rec.reduce((s,r)=>s+(r.udzial||0),0);
    const masa = masaWozu(woz);
    const ndWpisane = masaNiedojadow(woz);
    const nd = Math.min(ndWpisane, masa);
    const swiezy = Math.max(0, masa-nd);
    const udz = udzialyReceptur(woz);
    const sklSwiezy = mapaSkaluj(udz, swiezy);
    const wspNd = ndWpisane>0 ? nd/ndWpisane : 0;
    const sklNd = {}; const zrodla = {};
    (woz.niedojady||[]).forEach(x=>{
      if(!x.zrodloId || !(x.kg>0)) return;
      mapaDodaj(sklNd, frakcjeNiedojadu(lok, data, x.zrodloId), x.kg*wspNd);
      zrodla[x.zrodloId] = (zrodla[x.zrodloId]||0) + x.kg*wspNd;
    });
    const kosztSwiezy = kosztMapy(sklSwiezy);
    const naDawke = {};
    rec.forEach(r=>{ naDawke[r.dawkaId] = (naDawke[r.dawkaId]||0) + swiezy*(r.udzial/sumaUdz); });
    const opisRec = rec.map(r=>(store.dawki[r.dawkaId]?.nazwa||'?')+(rec.length>1?' '+fmt(r.udzial/sumaUdz*100,0)+'%':'')).join(' + ');

    const bledy = [], ostrz = [];
    if(!rec.length && swiezy>0.5) bledy.push('Wybierz recepturę świeżego TMR.');
    if(recWsz.some(r=>r.dawkaId && !store.dawki[r.dawkaId])) bledy.push('Receptura usunięta z Dawek — wybierz inną.');
    if(rec.length && Math.abs(sumaUdzWsz-100)>0.5) bledy.push(`Udziały receptur sumują się do ${fmt(sumaUdzWsz,0)}% zamiast 100%.`);
    if(masa<=0) bledy.push('Rozdziel wóz na sektory — masa wozu to suma rozdzielenia.');
    if((woz.rozdzielenie||[]).some(r=>r.kg>0 && !r.grupaId)) bledy.push('Wybierz sektor w każdym wierszu rozdzielenia.');
    if((woz.rozdzielenie||[]).some(r=>r.grupaId && !store.grupyTech[r.grupaId])) bledy.push('Sektor usunięty — wybierz inny.');
    if(ndWpisane > masa+0.5) bledy.push(`Niedojady w wozie (${fmt(ndWpisane,0)} kg) większe niż masa wozu (${fmt(masa,0)} kg).`);
    const kontrola = woz.wagaKontrolna||0;
    const odchylka = kontrola>0 ? kontrola-masa : 0;
    if(kontrola>0 && Math.abs(odchylka)>Math.max(20, masa*0.02))
      ostrz.push(`Waga z wozu ${fmt(kontrola,0)} kg — o ${fmt(Math.abs(odchylka),0)} kg ${odchylka>0?'więcej':'mniej'} niż suma rozdzielenia.`);
    const liczony = masa>0 && (rec.length>0 || swiezy<=0.5);
    const stan = !liczony ? 'brak' : (bledy.length||ostrz.length) ? 'zle' : 'ok';
    return {woz, rec, sumaUdzWsz, sumaUdz, masa, nd, ndWpisane, swiezy, udz, sklSwiezy, sklNd, zrodla,
      kosztSwiezy, naDawke, opisRec, bledy, ostrz, kontrola, odchylka, liczony, stan};
  });

  const sektory = {};
  wozy.forEach(W=>{
    if(!W.liczony) return;
    (W.woz.rozdzielenie||[]).forEach(rz=>{
      if(!rz.grupaId || !(rz.kg>0)) return;
      const f = rz.kg / W.masa;
      const a = sektory[rz.grupaId] || (sektory[rz.grupaId] =
        {kg:0, swiezy:0, odzysk:0, sklTotal:{}, sklSwieze:{}, koszt:0, wklady:[], zrodla:{}, naDawke:{}});
      a.kg += rz.kg;
      a.swiezy += W.swiezy*f;
      a.odzysk += W.nd*f;
      mapaDodaj(a.sklSwieze, W.sklSwiezy, f);
      mapaDodaj(a.sklTotal, W.sklSwiezy, f);
      mapaDodaj(a.sklTotal, W.sklNd, f);
      a.koszt += W.kosztSwiezy*f;
      mapaDodaj(a.zrodla, W.zrodla, f);
      mapaDodaj(a.naDawke, W.naDawke, f);
      a.wklady.push({wozId:W.woz.id, wozNazwa:W.woz.nazwa,
        dawkaNazwa:(W.opisRec||'')+(W.nd>0?' + ♻':''), kg:zaokr(rz.kg,2)});
    });
  });
  return {wozy, sektory};
}

/* Porównanie wpisów bez znacznika czasu i autora — żeby nie zapisywać bez zmian */
function bezMeta(o){ if(!o) return o; const {ts, autor, ...r} = o; return JSON.stringify(r); }

/* Paszowóz → zywienie (dzień bieżący) + niedojady → zywienie (dzień poprzedni) */
async function synchronizujZywienieZPaszowozu(lok, data, st){
  st = st || normalizujPz(pzDok(lok,data));
  const {sektory} = obliczPaszowoz(lok, data, st);
  const autor = ROLE[rolaAkt]?.nazwa||'?';
  const dzis = data===dzisiaj();

  // ---- dzień bieżący: co trafiło do sektorów ----
  const id = idDnia(lok,data);
  const stary = store.zywienie[id] || {};
  const grupy = klon(stary.grupy||{});
  for(const [gid,a] of Object.entries(sektory)){
    const gr = store.grupyTech[gid];
    const poprz = grupy[gid] || {};
    const sztuk = poprz.sztuk!=null ? poprz.sztuk : (gr?.sztuk||0);
    const dz = sztuk>0 ? sztuk : 1;
    // Plan: dziś zawsze aktualny z Dawek; dzień miniony — zamrożony, jeśli był zapisany
    const zamroz = !dzis && poprz.dawkaWyliczonaKgSzt!=null;
    const o = gr ? obliczGrupe(gr) : null;
    const nowy = {
      ...poprz,
      sztuk,
      nazwaGrupy: gr?.nazwa || poprz.nazwaGrupy || '?',
      dawkaWyliczonaKgSzt: zamroz ? poprz.dawkaWyliczonaKgSzt : zaokr(o?.kgSzt||0,3),
      udzialy: (zamroz && poprz.udzialy) ? poprz.udzialy : (gr?.dawki||[]).map(d=>({dawkaId:d.dawkaId, udzial:d.udzial})),
      zadaneKg: zaokr(a.kg,2),
      niedojadyDodaneKg: zaokr(a.odzysk,2),
      niedojadyZrodla: Object.entries(a.zrodla).filter(([,kg])=>kg>0.01).map(([grupaId,kg])=>({grupaId, kg:zaokr(kg,2)})),
      skladniki: mapaNaListe(a.sklTotal, dz),
      skladnikiSwieze: mapaNaListe(a.sklSwieze, dz),
      kosztKgTMR: a.swiezy>0 ? zaokr(a.koszt/a.swiezy,4) : 0,
      udzialyFakt: Object.entries(a.naDawke).filter(([,kg])=>kg>0.01)
        .map(([dawkaId,kg])=>({dawkaId, nazwa:store.dawki[dawkaId]?.nazwa||'?', kg:zaokr(kg,2)})),
      zPaszowozu: true,
      wklady: a.wklady
    };
    grupy[gid] = bezMeta(nowy)===bezMeta(poprz) ? poprz : {...nowy, autor, ts:Date.now()};
  }
  // Sieroty: wpisy z Paszowozu, których nie ma już w żadnym wozie
  for(const gid of Object.keys(grupy)){
    if(sektory[gid]) continue;
    const g = grupy[gid];
    if(!g || !(g.zPaszowozu || g.wklady)) continue;
    const {zadaneKg, niedojadyDodaneKg, niedojadyZrodla, skladniki, skladnikiSwieze, kosztKgTMR,
           udzialyFakt, zPaszowozu, wklady, ...reszta} = g;
    if(reszta.niedojadyKg==null && !store.grupyTech[gid]) delete grupy[gid];
    else if(reszta.niedojadyKg==null && store.grupyTech[gid]) delete grupy[gid];   // wraca do planu
    else grupy[gid] = reszta;
  }
  if(JSON.stringify(grupy)!==JSON.stringify(stary.grupy||{}) || !store.zywienie[id]){
    if(Object.keys(grupy).length || store.zywienie[id])
      await DB.zapiszCaly('zywienie', id, {lokalizacja:lok, data, grupy});
  }

  // ---- dzień poprzedni: niedojady zebrane dziś rano ----
  const wczoraj = dataMinus(data,1);
  const idW = idDnia(lok, wczoraj);
  const staryW = store.zywienie[idW] || {};
  const grupyW = klon(staryW.grupy||{});
  const perZr = {};
  st.niedojady.forEach(n=>{ if(n.zrodloId && n.zebranoKg>0) perZr[n.zrodloId]=(perZr[n.zrodloId]||0)+n.zebranoKg; });
  for(const [gid,kg] of Object.entries(perZr)){
    const g = grupyW[gid] || {nazwaGrupy:store.grupyTech[gid]?.nazwa||'?'};
    grupyW[gid] = {...g, niedojadyKg:zaokr(kg,2), niedojadyZPaszowozu:true};
  }
  for(const gid of Object.keys(grupyW)){
    if(perZr[gid]) continue;
    const g = grupyW[gid];
    if(g && (g.niedojadyZPaszowozu || g.niedojadyKg!=null)){
      const {niedojadyKg, niedojadyZPaszowozu, ...reszta} = g;
      // wpis utworzony tylko dla niedojadów — znika w całości
      if(reszta.zadaneKg==null && reszta.sztuk==null && reszta.dawkaWyliczonaKgSzt==null) delete grupyW[gid];
      else grupyW[gid] = reszta;
    }
  }
  if(JSON.stringify(grupyW)!==JSON.stringify(staryW.grupy||{})){
    await DB.zapiszCaly('zywienie', idW, {lokalizacja:lok, data:wczoraj, grupy:grupyW});
  }
}

async function zapiszPaszowoz(lok, data, st){
  const dok = {
    lokalizacja:lok, data,
    wozy: st.wozy, niedojady: st.niedojady,
    niedojadyPotw: !!st.niedojadyPotw,
    autoKopia: st.autoKopia || null,
    autor: ROLE[rolaAkt]?.nazwa||'?', ts: Date.now()
  };
  await DB.zapiszCaly('paszowozy', idPz(lok,data), dok);
  await synchronizujZywienieZPaszowozu(lok, data, normalizujPz(dok));
}

/* Każda edycja: świeży stan z magazynu → zmiana → zapis całości.
   Dzięki temu żadna akcja nie gubi niedojadów ani wozów zmienionych w międzyczasie. */
async function pzEdytuj(lok, data, fn){
  const st = normalizujPz(pzDok(lok,data));
  if(fn(st)===false) return;
  await zapiszPaszowoz(lok, data, st);
}

    niedojady:[], wagaKontrolna:null}));
}

/* Autoduplikacja: TYLKO na dziś, TYLKO gdy serwer potwierdził, że dzisiejszego dokumentu
   nie ma (nie na podstawie starej pamięci podręcznej), i tylko raz. */
function pzAutoDuplikacja(lok){
  const data = dzisiaj();
  const klucz = idPz(lok,data);
  if(pzAutoProby.has(klucz)) return;
  if(!trybLokalny && !serwerPotwierdzil.paszowozy) return;
  pzAutoProby.add(klucz);
  if(pzDok(lok,data)) return;
  for(let i=1;i<=7;i++){
    const zr = dataMinus(data,i);
    const prev = pzDok(lok, zr);
    if(prev?.wozy?.length){
      const st = {wozy:kopiujWozy(prev.wozy), niedojady:[], niedojadyPotw:false, autoKopia:zr};
      setTimeout(async()=>{
        if(pzDok(lok,data)) return;          // ktoś zdążył zapisać
        await zapiszPaszowoz(lok, data, st);
        toast(`Skopiowano wozy z ${dataPL(zr)} — sprawdź receptury i ilości.`);
      }, 0);
      return;
    }
  }
}

/* ---------- Karty załadunku ---------- */
function wierszeSurowcow(ids){
  const uklad = wierszeDawek();
  const zb = [...ids];
  return [...uklad.filter(id=>zb.includes(id)), ...zb.filter(id=>!uklad.includes(id))];
}

/* Karta pojedynczego wozu: najpierw niedojady, potem świeży TMR; narastająco = odczyt wagi */
function kartaZaladunku(W){
  const woz = W.woz;
  let narast = 0;
  const ndHtml = (woz.niedojady||[]).filter(x=>x.kg>0).map(x=>{
    narast += x.kg;
    return `<tr style="background:#fff3d6">
      <td>♻ NIEDOJADY z: ${esc(store.grupyTech[x.zrodloId]?.nazwa||'?')}</td>
      <td class="num">—</td><td class="num">${fmt(x.kg,0)}</td><td class="num">${fmt(narast,0)}</td></tr>`;
  }).join('');
  const ids = wierszeSurowcow(Object.keys(W.sklSwiezy).filter(k=>W.sklSwiezy[k]>0.05));
  const swHtml = ids.map(sid=>{
    const kg = W.sklSwiezy[sid];
    narast += kg;
    return `<tr><td>${esc(store.surowce[sid]?.nazwa||'?')}</td>
      <td class="num">${fmt((W.udz[sid]||0)*100,1)}%</td><td class="num">${fmt(kg,0)}</td><td class="num">${fmt(narast,0)}</td></tr>`;
  }).join('');
  const rozdz = (woz.rozdzielenie||[]).filter(r=>r.grupaId && r.kg>0).map(r=>{
    const gr = store.grupyTech[r.grupaId];
    return `<tr><td>${esc(gr?.nazwa||'?')}</td><td class="num">${gr?.sztuk||0}</td>
      <td class="num">${fmt(r.kg,0)}</td><td class="num">${gr?.sztuk>0?fmt(r.kg/gr.sztuk,2):'—'}</td></tr>`;
  }).join('');
  return `
    <div style="margin-bottom:12px;line-height:1.5">
      <div><b>Receptura:</b> ${esc(W.opisRec||'—')}</div>
      <div><b>Waga końcowa wozu: ${fmt(W.masa,0)} kg</b>${W.nd>0?` — najpierw niedojady ${fmt(W.nd,0)} kg, potem świeży TMR ${fmt(W.swiezy,0)} kg`:''}</div>
    </div>
    <table>
      <thead><tr><th>ZAŁADUNEK — kolejno</th><th>Udział</th><th>kg</th><th>Waga narastająco</th></tr></thead>
      <tbody>${ndHtml}${swHtml}
        <tr><td>RAZEM DO WOZU</td><td class="num"></td><td class="num">${fmt(W.masa,0)}</td><td class="num">${fmt(W.masa,0)}</td></tr>
      </tbody>
    </table>
    <h2>ROZWIEŹĆ NA SEKTORY</h2>
    <table>
      <thead><tr><th>Sektor</th><th>Sztuk</th><th>kg</th><th>kg/szt</th></tr></thead>
      <tbody>${rozdz || '<tr><td colspan="4">Brak rozdzielenia</td></tr>'}
        <tr><td>RAZEM</td><td class="num"></td><td class="num">${fmt(W.masa,0)}</td><td class="num"></td></tr>
      </tbody>
    </table>`;
}

/* Zbiorcza karta — wszystkie wozy w jednej tabeli (A4 poziomo, do ~10 wozów) */
function zbiorczaKartaZaladunku(lista){
  const uzyte = new Set();
  lista.forEach(W=>Object.entries(W.sklSwiezy).forEach(([sid,kg])=>{ if(kg>0.05) uzyte.add(sid); }));
  const wiersze = wierszeSurowcow([...uzyte]);
  const nag = lista.map(W=>`<th>${esc(W.woz.nazwa)}<br><span style="font-weight:400;font-size:.8em">${esc(W.opisRec||'')}</span></th>`).join('');
  const suma = f => lista.reduce((s,W)=>s+f(W),0);
  const maNd = lista.some(W=>W.nd>0);
  const sektory = [];
  lista.forEach(W=>(W.woz.rozdzielenie||[]).forEach(r=>{ if(r.grupaId && r.kg>0 && !sektory.includes(r.grupaId)) sektory.push(r.grupaId); }));
  return `
  <table>
    <thead><tr><th>ZAŁADUNEK</th>${nag}<th>Razem</th></tr></thead>
    <tbody>
      ${maNd?`<tr style="background:#fff3d6"><td>♻ 1. NIEDOJADY</td>${lista.map(W=>`<td>${W.nd>0?fmt(W.nd,0):'—'}</td>`).join('')}<td>${fmt(suma(W=>W.nd),0)}</td></tr>`:''}
      ${wiersze.map(sid=>`<tr><td>${esc(store.surowce[sid]?.nazwa||'?')}</td>
        ${lista.map(W=>{ const kg=W.sklSwiezy[sid]||0; return `<td>${kg>0.05?fmt(kg,0):'—'}</td>`; }).join('')}
        <td>${fmt(suma(W=>W.sklSwiezy[sid]||0),0)}</td></tr>`).join('')}
      ${maNd?`<tr><td>Świeży TMR</td>${lista.map(W=>`<td>${fmt(W.swiezy,0)}</td>`).join('')}<td>${fmt(suma(W=>W.swiezy),0)}</td></tr>`:''}
      <tr><td>RAZEM DO WOZU</td>${lista.map(W=>`<td>${fmt(W.masa,0)}</td>`).join('')}<td>${fmt(suma(W=>W.masa),0)}</td></tr>
    </tbody>
  </table>
  <h2>ROZWIEŹĆ NA SEKTORY</h2>
  <table>
    <thead><tr><th>Sektor</th><th>Sztuk</th>${lista.map(W=>`<th>${esc(W.woz.nazwa)}</th>`).join('')}<th>Razem kg</th><th>kg/szt</th></tr></thead>
    <tbody>
      ${sektory.map(gid=>{
        const gr = store.grupyTech[gid];
        const kol = lista.map(W=>(W.woz.rozdzielenie||[]).filter(x=>x.grupaId===gid).reduce((s,x)=>s+(x.kg||0),0));
        const raz = kol.reduce((a,b)=>a+b,0);
        return `<tr><td>${esc(gr?.nazwa||'?')}</td><td>${gr?.sztuk||0}</td>
          ${kol.map(kg=>`<td>${kg>0?fmt(kg,0):'—'}</td>`).join('')}
          <td>${fmt(raz,0)}</td><td>${gr?.sztuk>0?fmt(raz/gr.sztuk,2):'—'}</td></tr>`;
      }).join('')}
      <tr><td>RAZEM</td><td></td>${lista.map(W=>`<td>${fmt(W.masa,0)}</td>`).join('')}<td>${fmt(suma(W=>W.masa),0)}</td><td></td></tr>
    </tbody>
  </table>`;
}

                <span class="pz-hint" style="min-width:58px;text-align:right">${gr?.sztuk>0&&rz.kg>0?fmt(rz.kg/gr.sztuk,2)+'/szt':''}</span>
                ${edycja?`<button class="ikonka usun" data-rz-usun="${woz.id}|${ri}" title="Usuń">✕</button>`:''}
              </div>`;
            }).join('') : '<div class="pz-pusto">Kliknij + żeby dodać sektor</div>'}

            <div class="pz-masa-box">
              <div class="pz-masa-lbl">Masa wozu (z rozdzielenia)</div>
              <div class="pz-masa-val">${fmt(X.masa,0)} <span>kg</span></div>
              ${X.nd>0?`<div class="pz-hint">♻ niedojady ${fmt(X.nd,0)} kg + świeży TMR <b>${fmt(X.swiezy,0)} kg</b></div>`:''}
            </div>
            <label class="pz-lbl">Waga z wagi wozu <span>(opcjonalnie, kontrola)</span></label>
            <input class="pz-input num" data-woz-kontrola="${woz.id}" type="number" step="1" min="0" inputmode="numeric" value="${woz.wagaKontrolna||''}" placeholder="—" ${edycja?'':'readonly'}>
            ${X.bledy.map(b=>`<div class="pz-alert nadmiar">⚠ ${esc(b)}</div>`).join('')}
            ${X.ostrz.map(b=>`<div class="pz-alert brak">⚠ ${esc(b)}</div>`).join('')}
            ${X.kontrola>0 && !X.ostrz.length ? '<div class="pz-hint" style="color:var(--zielony-ok)">✓ Waga zgodna z planem</div>':''}
          </div>
        </div>`;
      }).join('')}
    </div>` : `<div class="pusto" style="padding:40px 20px;text-align:center">
      <div style="font-size:44px;margin-bottom:14px">🚛</div>
      <div style="font-size:15px;font-weight:600;color:var(--tekst);margin-bottom:6px">Brak wozów na ${dataPL(data)}</div>
      <div class="podpis" style="max-width:440px;margin:0 auto">${edycja?'Kliknij <b>+ Wóz</b>, albo <b>⎘ Duplikuj z dnia</b>, jeśli układ jest podobny jak wcześniej.':''}</div>
    </div>`}
  </div>

  ${Object.keys(wynik.sektory).length ? `
  <div class="panel" id="pzKrok3">
    <div class="panel-tyt krok"><span class="krok-nr">3</span>
      Podsumowanie dnia — sektory
      <span class="licznik">${Object.keys(wynik.sektory).length} obsłużonych · ${fmt(sumaMasa,0)} kg</span>
      <span style="flex:1"></span>
      ${przyciskEksportu('#pzZbiorczo','paszowoz_sektory_'+lok+'_'+data,'Paszowóz '+nazwaLok+' — sektory '+dataPL(data))}
    </div>
    <div class="przewijak"><table class="gt-tabela" id="pzZbiorczo">
      <thead><tr><th>Sektor</th><th class="num">Sztuk</th><th class="num">Plan<br>kg/szt</th><th class="num">Plan<br>kg</th>
        <th class="num">Zadane<br>kg</th><th class="num">♻ w tym<br>odzysk</th><th class="num">Świeży<br>TMR kg</th>
        <th class="num">Zadane<br>kg/szt</th><th class="num">%<br>zadania</th><th>Z wozów</th></tr></thead>
      <tbody>
        ${poDzis.map(p=>`<tr>
          <td><b>${esc(p.nazwa)}</b></td><td class="num">${p.sztuk}</td>
          <td class="num">${fmt(p.wylicz,2)}</td><td class="num">${fmt(p.planKg,0)}</td>
          <td class="num"><b>${fmt(p.zadaneKg,0)}</b></td>
          <td class="num">${p.odzysk>0.5?'<span class="odzysk">'+fmt(p.odzysk,0)+'</span>':'—'}</td>
          <td class="num">${fmt(p.swiezy,0)}</td>
          <td class="num"><b>${fmt(p.perSzt,2)}</b></td>${procKomorka(p.procZad)}
          <td class="podpis">${p.wklady.map(x=>esc((x.wozNazwa||'')+': '+fmt(x.kg,0)+' kg')).join(' · ')}</td>
        </tr>`).join('')}
        <tr class="suma"><td>SUMA</td><td class="num">${poDzis.reduce((s,p)=>s+p.sztuk,0)}</td><td></td>
          <td class="num">${fmt(poDzis.reduce((s,p)=>s+p.planKg,0),0)}</td>
          <td class="num">${fmt(poDzis.reduce((s,p)=>s+p.zadaneKg,0),0)}</td>
          <td class="num">${fmt(poDzis.reduce((s,p)=>s+p.odzysk,0),0)}</td>
          <td class="num">${fmt(poDzis.reduce((s,p)=>s+p.swiezy,0),0)}</td><td></td><td></td><td></td></tr>
      </tbody>
    </table></div>

    <div class="panel-tyt" style="border-top:1px solid var(--linia)">Surowce na wozy <span class="licznik">kg do załadunku</span>
      <span style="flex:1"></span>
      ${przyciskEksportu('#pzSurowce','surowce_na_wozy_'+lok+'_'+data,'Surowce na wozy — '+nazwaLok+' '+dataPL(data))}
    </div>
    ${(()=>{
      const L = W.filter(X=>X.liczony);
      const uzyte = new Set(); L.forEach(X=>Object.entries(X.sklSwiezy).forEach(([s,kg])=>{ if(kg>0.05) uzyte.add(s); }));
      const wiersze = wierszeSurowcow([...uzyte]);
      return `<div class="macierz" style="max-height:none" id="pzSurowce"><table>
        <colgroup><col style="width:220px">${L.map(()=>'<col style="width:120px">').join('')}<col style="width:120px"></colgroup>
        <thead><tr><th class="lipka">Surowiec</th>${L.map(X=>`<th><span class="nazwa-kol" title="${esc(X.woz.nazwa)}">${esc(X.woz.nazwa)}</span><span class="mac-pod">${fmt(X.masa,0)} kg</span></th>`).join('')}<th>Razem</th></tr></thead>
        <tbody>
          ${sumaNd>0?`<tr class="wiersz-odzysk"><td class="lipka">♻ Niedojady (najpierw)</td>${L.map(X=>`<td class="num">${X.nd>0?fmt(X.nd,0):'—'}</td>`).join('')}<td class="num"><b>${fmt(sumaNd,0)}</b></td></tr>`:''}
          ${wiersze.map(sid=>`<tr><td class="lipka"><span class="nazwaS">${esc(store.surowce[sid]?.nazwa||'?')}</span></td>
            ${L.map(X=>{ const kg=X.sklSwiezy[sid]||0; return `<td class="num">${kg>0.05?fmt(kg,1):'—'}</td>`; }).join('')}
            <td class="num"><b>${fmt(L.reduce((s,X)=>s+(X.sklSwiezy[sid]||0),0),1)}</b></td></tr>`).join('')}
          <tr class="suma-wiersz"><td class="lipka">Razem do wozu</td>${L.map(X=>`<td class="num">${fmt(X.masa,0)}</td>`).join('')}<td class="num">${fmt(sumaMasa,0)}</td></tr>
        </tbody></table></div>`;
    })()}

    <div class="panel-tyt" style="border-top:1px solid var(--linia)">Realny skład dawek zadanych <span class="licznik">kg surowca / sztukę / dobę</span>
      <span style="flex:1"></span>
      ${przyciskEksportu('#pzRealny','sklad_zadany_'+lok+'_'+data,'Skład dawek zadanych — '+nazwaLok+' '+dataPL(data))}
    </div>
    ${macierzSkladu(poDzis, {id:'pzRealny', tryb:'zadany'})}
  </div>` : ''}

  <div class="panel" id="pzKrok4">
    <div class="panel-tyt krok"><span class="krok-nr">4</span>
      Realne pobranie za ${dataPL(wczoraj)}
      <span class="licznik">zadane − niedojady zebrane ${dataPL(data)} rano</span>
      <span style="flex:1"></span>
      ${poWcz.length?przyciskEksportu('#pzPobranie','pobranie_'+lok+'_'+wczoraj,'Realne pobranie — '+nazwaLok+' '+dataPL(wczoraj)):''}
    </div>
    ${!poWcz.length ? `<div class="pusto">Brak danych żywienia za ${dataPL(wczoraj)}.</div>`
      : (!ndZnane ? `<div class="pasek-wersja">Niedojady za ${dataPL(wczoraj)} nie są jeszcze wpisane — uzupełnij krok 1 (albo potwierdź <b>✓ Brak niedojadów</b>), żeby policzyć realne pobranie.</div>`:'')
        + (poWcz.length ? tabelaDniaHTML(poWcz, 'pzPobranie', wczoraj) : '')}
    ${poWcz.length && ndZnane ? `
      <div class="panel-tyt" style="border-top:1px solid var(--linia)">Skład realnie pobrany za ${dataPL(wczoraj)} <span class="licznik">kg / szt / dobę</span>
        <span style="flex:1"></span>
        ${przyciskEksportu('#pzPobranieMac','sklad_pobrany_'+lok+'_'+wczoraj,'Skład realnie pobrany — '+nazwaLok+' '+dataPL(wczoraj))}
      </div>
      ${macierzSkladu(poWcz, {id:'pzPobranieMac', tryb:'pobrany'})}` : ''}
  </div>`;

  // ===== PODPIĘCIA =====
  const ustaw = d=>{ pzData[lok]=d; renderPaszowoz(w,lok); };
  w.querySelector('#pzData').onchange = e=>{ if(e.target.value) ustaw(e.target.value); };
  w.querySelector('#pzPrev').onclick = ()=>ustaw(dataMinus(data,1));
  w.querySelector('#pzNext').onclick = ()=>{ const n=dataPlus(data,1); if(n<=dzisiaj()) ustaw(n); };
  w.querySelector('#pzDzis').onclick = ()=>ustaw(dzisiaj());

  const nazwaWoz = id => st.wozy.find(x=>x.id===id)?.nazwa || '';
  w.querySelector('#pzKartyWszystkie').onclick = ()=>{
    const L = W.filter(X=>X.liczony);
    if(!L.length){ toast('Brak wozów z recepturą i rozdzieleniem.', true); return; }
    drukujHTML(zbiorczaKartaZaladunku(L), 'Karty załadunku — '+nazwaLok+' '+dataPL(data), {poziom:true, duzy:true, zbiorcza:true});
  };
  w.querySelectorAll('[data-woz-karta]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const X = W.find(x=>x.woz.id===b.dataset.wozKarta); if(!X) return;
      if(!X.liczony){ toast('Uzupełnij recepturę i rozdzielenie wozu.', true); return; }
      drukujHTML(kartaZaladunku(X), 'Karta załadunku: '+X.woz.nazwa+' — '+nazwaLok+' '+dataPL(data), {duzy:true});
    };
  });
  w.querySelector('#pzRaport').onclick = ()=>{
    const czesci = [];
    const dodaj = (sel, tyt)=>{ const el=w.querySelector(sel); if(el) czesci.push('<h2>'+esc(tyt)+'</h2>'+htmlDoDruku(el)); };
    dodaj('#pzZbiorczo', 'Sektory — '+dataPL(data));
    dodaj('#pzSurowce', 'Surowce na wozy');
    dodaj('#pzPobranie', 'Realne pobranie za '+dataPL(wczoraj));
    if(!czesci.length){ toast('Brak danych do raportu.', true); return; }
    drukujHTML(czesci.join(''), 'Raport dnia — Paszowóz '+nazwaLok+' '+dataPL(data), {poziom:true});
  };

  if(!edycja) return;
  const E = fn => pzEdytuj(lok, data, fn);
  const woz = (st2, id) => st2.wozy.find(x=>x.id===id);

  const ok = w.querySelector('#pzAutoOk');
  if(ok) ok.onclick = ()=>E(s=>{ s.autoKopia=null; });
  w.querySelector('#pzDodaj').onclick = ()=>E(s=>{ s.wozy.push(nowyWoz(s.wozy.length+1)); s.autoKopia=null; });
  w.querySelector('#pzBrakNd').onclick = ()=>E(s=>{
    if(s.niedojady.length){ toast('Najpierw usuń wpisane niedojady.', true); return false; }
    s.niedojadyPotw = !s.niedojadyPotw;
  });
  w.querySelector('#pzDodZebr').onclick = ()=>E(s=>{
    s.niedojady.push({id:'nd'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), zrodloId:'', zebranoKg:0});
    s.niedojadyPotw = false;
  });
  w.querySelectorAll('[data-zebr-zrodlo]').forEach(el=>{
    el.onchange = ()=>E(s=>{ const n=s.niedojady.find(x=>x.id===el.dataset.zebrZrodlo); if(!n) return false; n.zrodloId=el.value; });
  });
  w.querySelectorAll('[data-zebr-kg]').forEach(el=>{
    el.onchange = ()=>E(s=>{ const n=s.niedojady.find(x=>x.id===el.dataset.zebrKg); if(!n) return false; n.zebranoKg=Math.max(0,liczba(el.value)); });
  });
  w.querySelectorAll('[data-zebr-usun]').forEach(b=>{
    b.onclick = ()=>E(s=>{
      const id = b.dataset.zebrUsun;
      s.niedojady = s.niedojady.filter(x=>x.id!==id);
      s.wozy.forEach(x=>{ x.niedojady=(x.niedojady||[]).filter(y=>y.zebraneId!==id); });
    });
  });

  w.querySelector('#pzDuplikuj').onclick = ()=>oknoDuplikujPz(lok, data, st);

  w.querySelectorAll('[data-woz-nazwa]').forEach(el=>{
    el.onchange = ()=>E(s=>{ const x=woz(s,el.dataset.wozNazwa); if(!x) return false; x.nazwa = el.value.trim() || x.nazwa; });
  });
  w.querySelectorAll('[data-woz-usun]').forEach(b=>{
    b.onclick = ()=>{
      const id=b.dataset.wozUsun;
      potwierdz('Usunąć wóz?', `„${esc(nazwaWoz(id))}” zniknie z dnia ${dataPL(data)}. Niedojady z tego wozu wrócą do puli.`,
        ()=>E(s=>{ s.wozy = s.wozy.filter(x=>x.id!==id); }));
    };
  });
  w.querySelectorAll('[data-rec-dawka]').forEach(el=>{
    el.onchange = ()=>E(s=>{ const [wid,ri]=el.dataset.recDawka.split('|'); const x=woz(s,wid); if(!x||!x.receptury[+ri]) return false; x.receptury[+ri].dawkaId=el.value; });
  });
  w.querySelectorAll('[data-rec-udzial]').forEach(el=>{
    el.onchange = ()=>E(s=>{
      const [wid,ri]=el.dataset.recUdzial.split('|'); const x=woz(s,wid); if(!x||!x.receptury[+ri]) return false;
      const v = Math.max(0, Math.min(100, liczba(el.value)));
      x.receptury[+ri].udzial = v;
      // przy dwóch recepturach druga uzupełnia się do 100%
      if(x.receptury.length===2) x.receptury[1-(+ri)].udzial = Math.round((100-v)*100)/100;
    });
  });
  w.querySelectorAll('[data-woz-dodrec]').forEach(b=>{
    b.onclick = ()=>E(s=>{
      const x=woz(s,b.dataset.wozDodrec); if(!x) return false;
      if(x.receptury.length===1 && x.receptury[0].udzial>=100){ x.receptury[0].udzial=50; x.receptury.push({dawkaId:'', udzial:50}); }
      else { const suma=x.receptury.reduce((a,r)=>a+(r.udzial||0),0); x.receptury.push({dawkaId:'', udzial:Math.max(0,100-suma)}); }
    });
  });
  w.querySelectorAll('[data-rec-usun]').forEach(b=>{
    b.onclick = ()=>E(s=>{
      const [wid,ri]=b.dataset.recUsun.split('|'); const x=woz(s,wid); if(!x) return false;
      x.receptury.splice(+ri,1);
      if(x.receptury.length===1) x.receptury[0].udzial=100;
    });
  });
  w.querySelectorAll('[data-woz-kontrola]').forEach(el=>{
    el.onchange = ()=>E(s=>{ const x=woz(s,el.dataset.wozKontrola); if(!x) return false; x.wagaKontrolna = Math.max(0,liczba(el.value)) || null; });
  });
  w.querySelectorAll('[data-woz-dodaj]').forEach(b=>{
    b.onclick = ()=>E(s=>{ const x=woz(s,b.dataset.wozDodaj); if(!x) return false; x.rozdzielenie.push({grupaId:'', kg:0}); });
  });
  w.querySelectorAll('[data-rz-grupa]').forEach(el=>{
    el.onchange = ()=>E(s=>{ const [wid,i]=el.dataset.rzGrupa.split('|'); const x=woz(s,wid); if(!x||!x.rozdzielenie[+i]) return false; x.rozdzielenie[+i].grupaId=el.value; });
  });
  w.querySelectorAll('[data-rz-kg]').forEach(el=>{
    el.onchange = ()=>E(s=>{ const [wid,i]=el.dataset.rzKg.split('|'); const x=woz(s,wid); if(!x||!x.rozdzielenie[+i]) return false; x.rozdzielenie[+i].kg=Math.max(0,liczba(el.value)); });
  });
  w.querySelectorAll('[data-rz-usun]').forEach(b=>{
    b.onclick = ()=>E(s=>{ const [wid,i]=b.dataset.rzUsun.split('|'); const x=woz(s,wid); if(!x) return false; x.rozdzielenie.splice(+i,1); });
  });
  w.querySelectorAll('[data-wnd-usun]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const [wid,zid]=b.dataset.wndUsun.split('|');
      E(s=>{ const x=woz(s,wid); if(!x) return false; x.niedojady=x.niedojady.filter(y=>y.zebraneId!==zid); });
    };
  });

  // ===== Niedojady → wóz: przeciągnij (mysz), przeciągnij palcem, albo dotknij chmurki i wozu =====
  const wrzuc = (zid, wid)=>E(s=>{
    const n = s.niedojady.find(x=>x.id===zid);
    const x = woz(s,wid);
    if(!n || !x || !n.zrodloId || !(n.zebranoKg>0)) return false;
    s.wozy.forEach(y=>{ y.niedojady=(y.niedojady||[]).filter(q=>q.zebraneId!==zid); });   // nigdy w dwóch wozach
    x.niedojady.push({zebraneId:n.id, zrodloId:n.zrodloId, kg:n.zebranoKg});
  });
  let wybrany = null;
  w.querySelectorAll('[data-chip]').forEach(chip=>{
    chip.ondragstart = e=>{ e.dataTransfer.setData('text/plain', chip.dataset.chip); chip.classList.add('dragging'); };
    chip.ondragend = ()=>chip.classList.remove('dragging');
    chip.onclick = ()=>{
      const juz = chip.classList.contains('wybrany');
      w.querySelectorAll('.pz-chip.wybrany').forEach(c=>c.classList.remove('wybrany'));
      w.querySelectorAll('.pz-drop-zone').forEach(z=>z.classList.toggle('czeka', !juz));
      wybrany = juz ? null : chip.dataset.chip;
      if(!juz){ chip.classList.add('wybrany'); toast('Dotknij teraz wozu, do którego trafią te niedojady.'); }
    };
    // dotyk: przeciąganie palcem
    let duch=null, start=null, ruszyl=false;
    chip.addEventListener('touchstart', e=>{ const t=e.touches[0]; start={x:t.clientX,y:t.clientY}; ruszyl=false; }, {passive:true});
    chip.addEventListener('touchmove', e=>{
      const t=e.touches[0];
      if(!ruszyl && Math.hypot(t.clientX-start.x, t.clientY-start.y)<8) return;
      e.preventDefault();
      if(!ruszyl){
        ruszyl=true;
        duch = chip.cloneNode(true); duch.classList.add('pz-ghost');
        duch.style.cssText='position:fixed;z-index:999;pointer-events:none;opacity:.9';
        document.body.appendChild(duch); chip.classList.add('dragging');
      }
      duch.style.left=(t.clientX-60)+'px'; duch.style.top=(t.clientY-22)+'px';
      w.querySelectorAll('.pz-drop-zone').forEach(z=>z.classList.remove('drag-over'));
      document.elementFromPoint(t.clientX,t.clientY)?.closest?.('.pz-drop-zone')?.classList.add('drag-over');
    }, {passive:false});
    chip.addEventListener('touchend', e=>{
      if(!ruszyl) return;                           // zwykłe dotknięcie → obsłuży onclick
      e.preventDefault();
      duch?.remove(); duch=null; chip.classList.remove('dragging');
      w.querySelectorAll('.pz-drop-zone').forEach(z=>z.classList.remove('drag-over'));
      const t=e.changedTouches[0];
      const zona = document.elementFromPoint(t.clientX,t.clientY)?.closest?.('.pz-drop-zone, .pz-woz');
      const wid = zona?.dataset.dropWoz || zona?.dataset.woz;
      if(wid) wrzuc(chip.dataset.chip, wid);
    });
  });
  w.querySelectorAll('.pz-woz').forEach(karta=>{
    const wid = karta.dataset.woz;
    karta.ondragover = e=>{ e.preventDefault(); karta.querySelector('.pz-drop-zone')?.classList.add('drag-over'); };
    karta.ondragleave = e=>{ if(!karta.contains(e.relatedTarget)) karta.querySelector('.pz-drop-zone')?.classList.remove('drag-over'); };
    karta.ondrop = e=>{
      e.preventDefault();
      karta.querySelector('.pz-drop-zone')?.classList.remove('drag-over');
      const zid = e.dataTransfer.getData('text/plain');
      if(zid) wrzuc(zid, wid);
    };
    karta.addEventListener('click', e=>{
      if(!wybrany || e.target.closest('button,select,input')) return;
      const zid = wybrany; wybrany = null;
      wrzuc(zid, wid);
    });
  });
}

function oknoDuplikujPz(lok, data, st){
  const dostepne = [];
  for(let i=1;i<=45 && dostepne.length<6;i++){
    const dd = dataMinus(data,i);
    const dk = pzDok(lok,dd);
    if(dk?.wozy?.length) dostepne.push({data:dd, ile:dk.wozy.length, kg:dk.wozy.reduce((s,w)=>s+masaWozu(w),0)});
  }
  modal({
    tytul:'Z którego dnia skopiować wozy?',
    tresc:`
      <div class="podpis" style="margin-bottom:12px">Kopiujemy receptury i rozdzielenie na sektory. Niedojady i waga kontrolna
        się nie kopiują — niedojady wpisujesz każdego dnia rano.
        ${st.wozy.length?'<br><b style="color:var(--zolty)">Bieżące wozy ('+st.wozy.length+') zostaną zastąpione.</b>':''}</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:6px">
        ${dostepne.map((x,i)=>`<label class="wybor-data"><input type="radio" name="dupd" value="${x.data}" ${i===0?'checked':''}>
          <span><b>${dataPL(x.data)}</b> — ${x.ile} ${x.ile===1?'wóz':x.ile<5?'wozy':'wozów'} · ${fmt(x.kg,0)} kg</span></label>`).join('')}
        <label class="wybor-data"><input type="radio" name="dupd" value="__data" ${dostepne.length?'':'checked'}>
          <span><b>Inny dzień</b><br><input type="date" id="dupData" max="${dzisiaj()}" value="${dataMinus(data,1)}" style="margin-top:5px"></span></label>
      </div>`,
    przyciski:[
      {tekst:'Anuluj'},
      {tekst:'Kopiuj', klasa:'', akcja:async(n)=>{
        const wyb = n.querySelector('input[name=dupd]:checked')?.value;
        const zrod = (!wyb || wyb==='__data') ? n.querySelector('#dupData')?.value : wyb;
        if(!zrod){ toast('Wybierz dzień.', true); return false; }
        if(zrod===data){ toast('To ten sam dzień.', true); return false; }
        const src = pzDok(lok, zrod);
        if(!src?.wozy?.length){ toast('Brak wozów za '+dataPL(zrod), true); return false; }
        const kopia = kopiujWozy(src.wozy);
        await pzEdytuj(lok, data, s=>{ s.wozy = kopia; s.autoKopia = null; });
        toast(`Skopiowano ${kopia.length} ${kopia.length===1?'wóz':'wozów'} z ${dataPL(zrod)}.`);
      }}
    ]
  });
}

/* ===================== ZAKŁADKA: MIESZALNIA =============================== */
let mixRozwiniete = new Set();
let mixZakladka = 'receptury';

function kosztMieszanki(m){
  return (m.skladniki||[]).reduce((s,sk)=>{
    const sur=store.surowce[sk.surowiecId];
    return s + (sk.procent/100)*((sur?.cenaTona||0)/1000);
  },0);
}

/* Automatyczne przeliczanie cen mieszanek własnych.
   Cena mieszanki to FUNKCJA cen składników, nie niezależna wartość —
   utrzymywanie dwóch źródeł prawdy ręcznie to pewny błąd.
   Wywoływane przy każdym otwarciu Surowców i przy zmianie ceny dowolnego surowca. */
function przeliczCenyMieszanek(){
  let zmian=0;
  for(const [sid,sur] of Object.entries(store.surowce)){
    if(!sur.zMieszalni) continue;
    const m = store.mieszanki[sur.mieszankaId] || Object.values(store.mieszanki).find(x=>x.nazwa===sur.nazwa);
    if(!m) continue;
    const kosztKg = kosztMieszanki(m);
    const kosztTona = Math.round(kosztKg*1000*100)/100;
    if(Math.abs((sur.cenaTona||0) - kosztTona) > 0.01){
      DB.zapisz('surowce', sid, {cenaTona:kosztTona, dataCeny:dzisiaj(), cenaZReceptury:true});
      zmian++;
    }
  }
  if(zmian) console.info(`Przeliczono ceny ${zmian} mieszanek wg bieżących cen składników.`);
}

function renderMieszalnia(w){
  const edycja = mozeEdytowac('mieszalnia');
  const mieszanki = Object.values(store.mieszanki).sort((a,b)=>(a.nazwa||'').localeCompare(b.nazwa||'','pl'));
  const produkcje = Object.values(store.produkcja).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  w.innerHTML = `
  <div class="panel">
    <div class="panel-tyt">Mieszalnia <span class="licznik">${mieszanki.length} receptur</span><span style="flex:1"></span>
      ${mixZakladka==='receptury'&&mieszanki.length?przyciskEksportu('#tabReceptury','receptury_mieszanek','Receptury mieszanek'):''}
      ${mixZakladka==='historia'&&produkcje.length?przyciskEksportu('#tabMixHist','produkcja_mieszalni','Mieszalnia — historia produkcji'):''}
      ${edycja?'<button class="btn maly" id="btnNowaMix">+ Receptura</button>':''}
    </div>
    <div class="pasek">
      <button class="btn ${mixZakladka==='receptury'?'':'szary'} maly" data-mz="receptury">Receptury</button>
      <button class="btn ${mixZakladka==='produkcja'?'':'szary'} maly" data-mz="produkcja">Produkuj parti\u0119</button>
      <button class="btn ${mixZakladka==='historia'?'':'szary'} maly" data-mz="historia">Historia (${produkcje.length})</button>
    </div>
    <div id="mixTresc"></div>
  </div>`;
  w.querySelectorAll('[data-mz]').forEach(b=>b.onclick=()=>{mixZakladka=b.dataset.mz;renderMieszalnia(w);});
  if(edycja){const b=w.querySelector('#btnNowaMix');if(b)b.onclick=()=>oknoMix();}
  const tresc=w.querySelector('#mixTresc');
  if(mixZakladka==='receptury') renderMixReceptury(tresc,mieszanki,edycja);
  else if(mixZakladka==='produkcja') renderMixProdukcja(tresc,mieszanki);
  else renderMixHistoria(tresc,produkcje);
}

    <div class="wiersz2" style="margin-bottom:4px;align-items:end">
      <div class="pole-grupa" style="margin:0;flex:2"><select data-si="${i}" data-pole="surowiecId">${surList.map(s=>`<option value="${s.id}" ${s.id===sk.surowiecId?'selected':''}>${esc(s.nazwa)}</option>`).join('')}</select></div>

      <button class="ikonka usun" data-usunsk="${i}" title="Usu\u0144">\u2715</button>

  modal({tytul:isEdit?`Edytuj: ${m.nazwa}`:'Nowa receptura',szer:'620px',
    tresc:`<div class="pole-grupa"><label>Nazwa</label><input id="mxNazwa" value="${esc(m?.nazwa||'')}" autocomplete="off"></div>
      <hr style="border:none;border-top:1px solid var(--linia);margin:10px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-weight:600">Sk\u0142adniki (% masy)</span><span class="podpis" id="mxSuma">Suma: ${skladniki.reduce((s,x)=>s+x.procent,0)}%</span></div>
      <div id="mxSklad">${renderSklad()}</div>

    przyciski:[{tekst:'Anuluj'},{tekst:isEdit?'Zapisz':'Dodaj',klasa:'',akcja:async(n)=>{
      const nazwa=n.querySelector('#mxNazwa').value.trim(); if(!nazwa){toast('Podaj nazw\u0119.',true);return false;}
      const sels=n.querySelectorAll('[data-pole="surowiecId"]');const inps=n.querySelectorAll('[data-pole="procent"]');const sk=[];
      sels.forEach((sel,i)=>{const p=liczba(inps[i]?.value);if(sel.value&&p>0)sk.push({surowiecId:sel.value,procent:p});});
      const kosztKg=sk.reduce((s,x)=>{const sur=store.surowce[x.surowiecId];return s+(x.procent/100)*((sur?.cenaTona||0)/1000);},0);
      if(isEdit){await DB.zapisz('mieszanki',edId,{nazwa,skladniki:sk,kosztKg:Math.round(kosztKg*10000)/10000});
        const surMix=Object.values(store.surowce).find(s=>s.mieszankaId===edId);if(surMix)await DB.zapisz('surowce',surMix.id,{nazwa,cenaTona:Math.round(kosztKg*1000*100)/100});
      }else{const newId=await DB.zapisz('mieszanki',null,{nazwa,skladniki:sk,kosztKg:Math.round(kosztKg*10000)/10000});
        await DB.zapisz('surowce',null,{nazwa,kategoria:'Mieszanka w\u0142asna',cenaTona:Math.round(kosztKg*1000*100)/100,dataCeny:dzisiaj(),kolejnosc:Object.keys(store.surowce).length+1,zMieszalni:true,mieszankaId:newId,lokalizacja:null});}
      toast('Zapisano receptur\u0119.');

  function odsw(){const k=document.getElementById('mxSklad');if(k)k.innerHTML=renderSklad();podepnij();
    const s=document.getElementById('mxSuma');if(s)s.textContent='Suma: '+skladniki.reduce((sum,x)=>sum+x.procent,0)+'%';}

    n.querySelectorAll('[data-pole="procent"]').forEach(inp=>{inp.onchange=()=>{skladniki[+inp.dataset.si].procent=liczba(inp.value);odsw();};});

/* ===================== ZAKŁADKA: RAPORTY ================================= */
let rapZakladka = 'kalendarz';
let rapLok = null;
let rapData = null;
let rapMiesiac = null;
let rapOdDo = null;

/* Dawki, mieszalnia i snapshoty są wspólne dla gospodarstwa — selektor lokalizacji
   w tych podzakładkach sugerowałby nieprawdę. */
function zalezyOdLokalizacji(pz){
  return ['kalendarz','historia','miesiac','zuzycie'].includes(pz);
}
function lokDostepne(){
  return (ROLE[rolaAkt]?.lokalizacje||[]).filter(l=>l==='nadarzyn'||l==='boguszyn');
}
function mozeWpisDnia(lok){
  return (ROLE[rolaAkt]?.lokalizacje||[]).includes(lok) && rolaAkt!=='mieszalnia';
}
function idDnia(lok,data){ return lok+'_'+data; }
function dokDnia(lok,data){ return store.zywienie[idDnia(lok,data)] || null; }
function dataPlus(iso,dni){ return dataMinus(iso,-dni); }
function dataMinus(iso,dni){
  const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()-dni);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function biezacyMiesiac(){ return dzisiaj().slice(0,7); }

/* Zapis pojedynczej pozycji dnia. Koszt zamrażamy w chwili wpisu. */
async function zapiszDzien(lok, data, grupaId, pola){
  const id = idDnia(lok,data);
  const stary = store.zywienie[id] || {lokalizacja:lok, data, grupy:{}};
  const gr = store.grupyTech[grupaId];
  const grupy = {...(stary.grupy||{})};
  const poprz = grupy[grupaId] || {};
  // Dzień POTWIERDZONY (wpisano kg) ma dane zamrożone. Niepotwierdzony przelicza się
  // z aktualnie obowiązującej wersji dawek — zgodnie z ustaleniem "od dziś" działa dziś.
  const potwierdzony = poprz.zadaneKg!=null || pola.zadaneKg!=null;
  let baza = {};
  if(gr && (!potwierdzony || poprz.dawkaWyliczonaKgSzt==null)){
    const o = obliczGrupe(gr);
    baza = {
      dawkaWyliczonaKgSzt: Math.round(o.kgSzt*1000)/1000,
      kosztKgTMR: o.kgSzt>0 ? Math.round((o.kosztSzt/o.kgSzt)*10000)/10000 : 0,
      nazwaGrupy: gr.nazwa,
      skladniki: o.skladniki,
      udzialy: (gr.dawki||[]).map(d=>({dawkaId:d.dawkaId, udzial:d.udzial}))  // zamrożone udziały
    };
  }
  // Liczba sztuk MUSI być zapisana — bez niej raporty liczą zadane = dawka × 0 i wiersz znika
  if(gr && poprz.sztuk==null && pola.sztuk==null) baza.sztuk = gr.sztuk||0;
  grupy[grupaId] = {...poprz, ...baza, ...pola, autor:ROLE[rolaAkt]?.nazwa||'?', ts:Date.now()};
  await DB.zapisz('zywienie', id, {lokalizacja:lok, data, grupy});
}

function odchylenieKolor(proc){
  const a=Math.abs(proc);
  if(a<=3) return 'var(--zielony-ok)';
  if(a<=10) return 'var(--zolty)';
  return 'var(--czerwony)';
}

function csvPobierz(nazwa, wiersze){
  const tresc = wiersze.map(r=>r.map(k=>{
    const s=String(k??'').replace(/"/g,'""');
    return /[;\n"]/.test(s) ? '"'+s+'"' : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\ufeff'+tresc], {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=nazwa+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Pobrano '+nazwa+'.csv');
}

    </div>

/* ---------- Kalendarz: cofnij się do dowolnego dnia ---------- */
let kalMiesiac = null;
let kalWybranyDzien = null;

function rapKalendarz(el){
  if(!kalMiesiac) kalMiesiac = biezacyMiesiac();
  const [rok,mies] = kalMiesiac.split('-').map(Number);
  const pierwszy = new Date(rok, mies-1, 1);
  const ostatni  = new Date(rok, mies, 0).getDate();
  let dzienTyg = pierwszy.getDay(); dzienTyg = dzienTyg===0 ? 6 : dzienTyg-1;   // pon=0

  // Które dni mają dane
  const maDane = {};
  Object.values(store.zywienie).filter(d=>d.lokalizacja===rapLok).forEach(d=>{
    if(!(d.data||'').startsWith(kalMiesiac)) return;
    const grupy = Object.values(d.grupy||{});
    const potw = grupy.filter(g=>g.zadaneKg!=null).length;
    maDane[d.data] = {ile:grupy.length, potw};
  });
  const maSnap = {};
  Object.values(store.snapshoty).forEach(s=>{ if((s.data||'').startsWith(kalMiesiac)) maSnap[s.data]=true; });

  let komorki = '';
  for(let i=0;i<dzienTyg;i++) komorki += '<div class="kal-pusta"></div>';
  for(let d=1; d<=ostatni; d++){
    const iso = `${rok}-${String(mies).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const info = maDane[iso];
    const dzis = iso===dzisiaj();
    const wybr = iso===kalWybranyDzien;
    const przyszly = iso>dzisiaj();
    komorki += `<div class="kal-dzien ${info?'ma':''} ${dzis?'dzis':''} ${wybr?'wybr':''} ${przyszly?'przyszly':''}" ${przyszly?'':`data-kal="${iso}"`}>
      <span class="kal-nr">${d}</span>
      ${info?`<span class="kal-kropki">${info.potw?'<b title="dni potwierdzone">●</b>':''}${info.ile>info.potw?'<i title="wg planu">○</i>':''}</span>`:''}
      ${maSnap[iso]?'<span class="kal-snap" title="Zapisano wersję dawek">✎</span>':''}
    </div>`;
  }

  el.innerHTML = `
  <div style="padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--linia)">
    <button class="btn szary maly" id="kalPrev">‹</button>
    <b style="min-width:150px;text-align:center">${['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'][mies-1]} ${rok}</b>
    <button class="btn szary maly" id="kalNext">›</button>
    <span style="flex:1"></span>
    <span class="podpis">● potwierdzone · ○ wg planu · ✎ zmiana dawek</span>
  </div>
  <div class="kal-siatka">
    ${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(x=>`<div class="kal-nag">${x}</div>`).join('')}
    ${komorki}
  </div>
  <div id="kalSzczegoly"></div>`;

  el.querySelector('#kalPrev').onclick=()=>{
    const d=new Date(rok,mies-2,1); kalMiesiac=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    kalWybranyDzien=null; renderRaporty(document.getElementById('widok'));
  };
  el.querySelector('#kalNext').onclick=()=>{
    const d=new Date(rok,mies,1); kalMiesiac=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    kalWybranyDzien=null; renderRaporty(document.getElementById('widok'));
  };
  el.querySelectorAll('[data-kal]').forEach(c=>{
    c.onclick=()=>{ kalWybranyDzien = (kalWybranyDzien===c.dataset.kal) ? null : c.dataset.kal;
      renderRaporty(document.getElementById('widok')); };
  });

  if(kalWybranyDzien) rysujDzienSzczegoly(el.querySelector('#kalSzczegoly'), kalWybranyDzien);
}

function tabelaZuzyciaHTML(zuz, id){
  const lista = Object.entries(zuz).filter(([,kg])=>kg>0.005).map(([sid,kg])=>{

  return `<div class="przewijak"><table class="gt-tabela" id="${id}" style="max-width:720px">

}

function rapMiesiacWidok(el){

    .map(d=>d.data).sort();
  const agg = {};
  dni.forEach(data=>analizaDnia(rapLok, data, false).forEach(p=>{
    if(!(p.zadaneKg>0)) return;
    const a = agg[p.gid] || (agg[p.gid] = {nazwa:p.nazwa, kolejnosc:p.kolejnosc, dni:0, dniPotw:0, dniZnane:0,
      sztDni:0, plan:0, zad:0, odzysk:0, koszt:0, planZn:0, zadZn:0, nied:0, pobr:0, sztDniZn:0});
    a.dni++; if(p.potw) a.dniPotw++;
    a.sztDni += p.sztuk; a.plan += p.planKg; a.zad += p.zadaneKg; a.odzysk += p.odzysk; a.koszt += p.koszt;
    if(p.niedojadyKg!=null){ a.dniZnane++; a.planZn += p.planKg; a.zadZn += p.zadaneKg; a.nied += p.niedojadyKg; a.pobr += p.pobraneKg; a.sztDniZn += p.sztuk; }
  }));
  const lista = Object.values(agg).sort((a,b)=>a.kolejnosc-b.kolejnosc);
  const S = k => lista.reduce((s,a)=>s+a[k],0);

      <th class="num">Śr. plan<br>kg/szt</th><th class="num">Śr. zadane<br>kg/szt</th><th class="num">%<br>zadania</th>
      <th class="num">Dni z<br>niedojadami</th><th class="num">Śr. pobranie<br>kg/szt</th><th class="num">%<br>pobrania</th>
      <th class="num">Niedojady<br>%</th><th class="num">♻ Odzysk<br>kg</th>
      <th class="num">Koszt<br>zł/szt/dobę</th><th class="num">Koszt<br>zł</th></tr></thead>
    <tbody>${lista.map(a=>{
      const procZ = a.plan>0 ? a.zad/a.plan*100 : null;
      const procP = a.planZn>0 ? a.pobr/a.planZn*100 : null;
      const procN = a.zadZn>0 ? a.nied/a.zadZn*100 : null;
      return `<tr><td><b>${esc(a.nazwa)}</b></td><td class="num">${a.dni} <span class="podpis">(${a.dniPotw})</span></td>
        <td class="num">${fmt(a.sztDni?a.plan/a.sztDni:0,2)}</td>
        <td class="num"><b>${fmt(a.sztDni?a.zad/a.sztDni:0,2)}</b></td>${procKomorka(procZ)}
        <td class="num">${a.dniZnane}</td>
        <td class="num"><b>${a.sztDniZn?fmt(a.pobr/a.sztDniZn,2):'—'}</b></td>${procKomorka(procP)}
        <td class="num">${procN!=null?fmt(procN,1)+'%':'—'}</td>
        <td class="num">${a.odzysk>0.5?'<span class="odzysk">'+fmt(a.odzysk,0)+'</span>':'—'}</td>

      <td class="num">${S('zadZn')>0?fmt(S('nied')/S('zadZn')*100,1)+'%':'—'}</td>
      <td class="num">${fmt(S('odzysk'),0)}</td><td></td><td class="num">${fmt(S('koszt'),0)} zł</td></tr>
    </tbody></table></div>
    <div class="podpis" style="padding:8px 14px">Średnie ważone liczbą sztuk. Pobranie i niedojady liczone tylko z dni, w których wpisano niedojady

  :'<div class="pusto">Brak danych za ten miesiąc.</div>'}`;

/* Macierz dawek z dowolnego zestawu danych — używana i dla stanu bieżącego, i dla historii */
function macierzDawekHTML(dawkiObj, opcje){
  opcje = opcje||{};
  const dawki = Object.values(dawkiObj).sort((a,b)=>(a.kolejnosc??99)-(b.kolejnosc??99));
  if(!dawki.length) return '<div class="pusto">Brak danych.</div>';
  const uzyte = new Set();
  dawki.forEach(d=>(d.skladniki||[]).forEach(s=>{ if(s.kg>0) uzyte.add(s.surowiecId); }));
  const uklad = wierszeDawek();
  const wiersze = [...uklad.filter(id=>uzyte.has(id)), ...[...uzyte].filter(id=>!uklad.includes(id))];
  const kg = (d,sid)=>{ const s=(d.skladniki||[]).find(x=>x.surowiecId===sid); return s?s.kg:0; };
  const suma = d=>(d.skladniki||[]).reduce((s,x)=>s+x.kg,0);
  const koszt = d=>(d.skladniki||[]).reduce((s,x)=>{
    const sur=store.surowce[x.surowiecId]; return s+x.kg*((sur?.cenaTona||0)/1000);
  },0);

  return `<div class="macierz" style="max-height:none" ${opcje.id?`id="${opcje.id}"`:''}>
    <table>
      <thead><tr><th class="lipka">Surowiec</th>
        ${dawki.map(d=>`<th><span class="nazwa-kol" title="${esc(d.nazwa)}">${esc(d.nazwa)}</span>
          ${d.suchyTMR?'<span style="font-size:9px;opacity:.7;display:block">(suchy TMR)</span>':''}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${wiersze.map(sid=>{
          const sur=store.surowce[sid];
          return `<tr><td class="lipka"><span class="nazwaS" title="${esc(sur?.nazwa||'?')}">${esc(sur?.nazwa||'?')}</span></td>
          ${dawki.map(d=>{
            const v=kg(d,sid);
            const pod = opcje.podswietl && opcje.podswietl[d.id+'|'+sid];
            const tyt = pod ? `${pod.rola} \u00b7 ${dataPL(pod.data)} ${new Date(pod.ts).toTimeString().slice(0,5)} \u00b7 ${fmt(pod.stara,2)} \u2192 ${fmt(pod.nowa,2)} kg` : '';
            return `<td class="num" ${tyt?`title="${esc(tyt)}"`:''} ${pod?'style="color:var(--czerwony);font-weight:700"':''}>${v?fmt(v,2):'\u2014'}</td>`;
          }).join('')}</tr>`;
        }).join('')}
        <tr class="suma-wiersz"><td class="lipka">Ca\u0142o\u015b\u0107 kg/szt</td>
          ${dawki.map(d=>`<td class="num">${fmt(suma(d),2)}</td>`).join('')}</tr>
        <tr class="koszt-wiersz"><td class="lipka">Koszt z\u0142/szt/dob\u0119</td>
          ${dawki.map(d=>`<td class="num">${fmt(koszt(d),2)} z\u0142</td>`).join('')}</tr>
      </tbody>
    </table>
  </div>`;
}
